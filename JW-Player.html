<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>PWlr Player - Big Skin (JW Style)</title>
    
    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            position: fixed;
        }
        
        #player-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        
        #player {
            width: 100% !important;
            height: 100% !important;
            background: #000;
        }
        
        /* ============================================================
           PLYR বড় স্কিন (JW Player স্টাইল)
           ============================================================ */
        
        /* ১. প্লেয়ার কন্টেইনার */
        .plyr {
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            border-radius: 0 !important;
            background: #000 !important;
            font-family: inherit !important;
        }
        
        /* ২. ভিডিও পুরো স্ক্রিন ফিট */
        .plyr__video-wrapper {
            width: 100% !important;
            height: 100% !important;
            background: #000 !important;
        }
        
        .plyr__video-wrapper video {
            width: 100% !important;
            height: 100% !important;
            object-fit: fill !important;
            background: #000 !important;
        }
        
        /* ৩. ফুলস্ক্রিন মোডে ফিট */
        .plyr--fullscreen .plyr__video-wrapper video {
            object-fit: fill !important;
            width: 100% !important;
            height: 100% !important;
        }
        
        .plyr--fullscreen {
            background: #000 !important;
        }
        
        /* ============================================================
           বড় কন্ট্রোল বাটন (JW স্টাইল)
           ============================================================ */
        
        /* ৪. কন্ট্রোল বার - বড় এবং ট্রান্সপারেন্ট */
        .plyr__controls {
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.85)) !important;
            padding: 25px 20px 20px 20px !important;
            gap: 10px !important;
            border: none !important;
        }
        
        /* ৫. সব কন্ট্রোল বাটন বড় করা */
        .plyr__controls .plyr__control {
            background: rgba(255, 255, 255, 0.08) !important;
            border-radius: 8px !important;
            padding: 12px 18px !important;
            transition: all 0.2s ease !important;
            color: #fff !important;
            min-width: 48px !important;
            min-height: 48px !important;
        }
        
        .plyr__controls .plyr__control:hover {
            background: rgba(255, 255, 255, 0.2) !important;
            transform: scale(1.05);
        }
        
        .plyr__controls .plyr__control svg {
            fill: #fff !important;
            width: 22px !important;
            height: 22px !important;
        }
        
        /* ৬. বড় প্লে বাটন (ওভারলে) */
        .plyr__control--overlaid {
            background: rgba(0, 195, 255, 0.85) !important;
            border: 3px solid rgba(255, 255, 255, 0.3) !important;
            backdrop-filter: blur(10px) !important;
            width: 80px !important;
            height: 80px !important;
            border-radius: 50% !important;
        }
        
        .plyr__control--overlaid:hover {
            background: rgba(0, 195, 255, 1) !important;
            transform: scale(1.1);
        }
        
        .plyr__control--overlaid svg {
            width: 35px !important;
            height: 35px !important;
        }
        
        /* ৭. বড় প্রগ্রেস বার */
        .plyr__progress {
            height: 8px !important;
            background: rgba(255, 255, 255, 0.2) !important;
            border-radius: 10px !important;
            margin: 0 10px !important;
        }
        
        .plyr__progress__played {
            background: linear-gradient(90deg, #00c3ff, #0099ff) !important;
            border-radius: 10px !important;
        }
        
        .plyr__progress__buffer {
            background: rgba(255, 255, 255, 0.1) !important;
        }
        
        /* প্রগ্রেস থাম্ব বড় করা */
        .plyr__progress input[type="range"]::-webkit-slider-thumb {
            width: 18px !important;
            height: 18px !important;
            background: #00c3ff !important;
            border: 2px solid #fff !important;
            box-shadow: 0 0 15px rgba(0, 195, 255, 0.5) !important;
        }
        
        .plyr__progress input[type="range"]::-moz-range-thumb {
            width: 18px !important;
            height: 18px !important;
            background: #00c3ff !important;
            border: 2px solid #fff !important;
        }
        
        /* ৮. বড় টাইম ডিসপ্লে */
        .plyr__time {
            color: rgba(255, 255, 255, 0.9) !important;
            font-size: 16px !important;
            font-weight: 500 !important;
            letter-spacing: 0.5px !important;
            padding: 0 8px !important;
        }
        
        /* ৯. বড় ভলিউম কন্ট্রোল */
        .plyr__volume input[type="range"] {
            background: rgba(255, 255, 255, 0.2) !important;
            height: 5px !important;
        }
        
        .plyr__volume input[type="range"]::-webkit-slider-thumb {
            width: 16px !important;
            height: 16px !important;
            background: #00c3ff !important;
            border: 2px solid #fff !important;
        }
        
        /* ১০. বড় সেটিংস মেনু */
        .plyr__menu__container {
            background: rgba(0, 0, 0, 0.95) !important;
            backdrop-filter: blur(20px) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 12px !important;
            padding: 8px !important;
            min-width: 200px !important;
        }
        
        .plyr__menu__container .plyr__control {
            color: #fff !important;
            padding: 12px 16px !important;
            font-size: 15px !important;
            border-radius: 6px !important;
        }
        
        .plyr__menu__container .plyr__control:hover {
            background: rgba(255, 255, 255, 0.1) !important;
        }
        
        /* ১১. বড় ফুলস্ক্রিন বাটন */
        .plyr__control[data-plyr="fullscreen"] svg {
            width: 24px !important;
            height: 24px !important;
        }
        
        /* ১২. কাস্টম JW লোগো */
        .jw-logo {
            position: absolute;
            top: 20px;
            right: 25px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }
        
        /* ============================================================
           লোডার (আপনার দেওয়া স্টাইল)
           ============================================================ */
        #loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99;
            flex-direction: column;
            transition: opacity 0.4s ease;
        }
        
        .loader-container {
            position: relative;
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .loader-brand {
            text-align: center;
            z-index: 10;
        }
        
        .tv-icon {
            font-size: 24px;
            color: #00c3ff;
            text-shadow: 0 0 10px #00c3ff;
        }
        
        .brand-name {
            font-size: 10px;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            margin-top: 5px;
            letter-spacing: 1px;
        }
        
        .brand-name span {
            color: #00c3ff;
        }
        
        .neon-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid transparent;
            animation: rotate-vortex 1.5s linear infinite;
        }
        
        .neon-ring:nth-child(1) {
            border-top: 2px solid #00c3ff;
            border-right: 2px solid #00c3ff;
            box-shadow: 0 0 10px #00c3ff;
        }
        
        .neon-ring:nth-child(2) {
            border-bottom: 2px solid #ff007f;
            border-left: 2px solid #ff007f;
            animation-direction: reverse;
            animation-duration: 2s;
            box-shadow: 0 0 10px #ff007f;
        }
        
        @keyframes rotate-vortex {
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 10px;
            margin-top: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .hide-now {
            opacity: 0 !important;
            visibility: hidden !important;
        }
        
        .error-content {
            text-align: center;
            color: #fff;
            z-index: 100;
        }
        
        .error-content i {
            font-size: 40px;
            color: #ff4d4d;
            margin-bottom: 15px;
        }
        
        /* ============================================================
           মোবাইল ফ্রেন্ডলি
           ============================================================ */
        @media (max-width: 768px) {
            .plyr__controls {
                padding: 15px 10px 10px 10px !important;
                gap: 5px !important;
            }
            
            .plyr__controls .plyr__control {
                padding: 8px 10px !important;
                min-width: 38px !important;
                min-height: 38px !important;
            }
            
            .plyr__controls .plyr__control svg {
                width: 18px !important;
                height: 18px !important;
            }
            
            .plyr__control--overlaid {
                width: 60px !important;
                height: 60px !important;
            }
            
            .plyr__control--overlaid svg {
                width: 28px !important;
                height: 28px !important;
            }
            
            .plyr__time {
                font-size: 13px !important;
            }
            
            .plyr__progress {
                height: 6px !important;
            }
            
            .jw-logo {
                font-size: 11px;
                top: 15px;
                right: 15px;
            }
        }
    </style>
</head>
<body>

<div id="player-wrapper">
    <!-- JW লোগো -->
    <div class="jw-logo">▶ JW STYLE</div>
    
    <!-- লোডার -->
    <div id="loader">
        <div class="loader-container">
            <div class="neon-ring"></div>
            <div class="neon-ring"></div>
            <div class="loader-brand">
                <i class="fas fa-tv tv-icon"></i>
                <div class="brand-name">RS LIVE <span>TV</span></div>
            </div>
        </div>
        <div class="loading-text">BUFFERING...</div>
    </div>
    
    <!-- প্লেয়ার -->
    <video id="player" playsinline crossorigin>
        <source src="" type="application/vnd.apple.mpegurl" />
    </video>
</div>

<!-- Plyr JS -->
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>

<!-- HLS.js -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js"></script>

<script>
    (function() {
        const urlParams = new URLSearchParams(window.location.search);
        const videoSrc = urlParams.get('url');
        
        const video = document.getElementById('player');
        const loader = document.getElementById('loader');
        
        if (!videoSrc) {
            loader.innerHTML = '<div class="brand-name">No Stream URL Found</div>';
            return;
        }
        
        // ভিডিও সোর্স সেট
        const source = video.querySelector('source');
        source.src = videoSrc;
        video.load();
        
        // Plyr প্লেয়ার ইনিশিয়ালাইজ (বড় স্কিন)
        const player = new Plyr(video, {
            controls: [
                'play-large',
                'play',
                'progress',
                'current-time',
                'mute',
                'volume',
                'captions',
                'settings',
                'pip',
                'airplay',
                'fullscreen'
            ],
            settings: ['quality', 'speed'],
            speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] },
            autoplay: true,
            muted: false
        });
        
        // HLS সাপোর্ট
        if (Hls.isSupported()) {
            const hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                backbufferLength: 30
            });
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(function(error) {
                    console.log('Auto-play prevented:', error);
                });
            });
            
            hls.on(Hls.Events.ERROR, function(event, data) {
                if (data.fatal) {
                    loader.classList.remove('hide-now');
                    loader.innerHTML = `
                        <div class="error-content">
                            <i class="fas fa-exclamation-triangle"></i>
                            <p>Stream Offline!</p>
                            <div class="brand-name">RS LIVE <span>TV</span></div>
                        </div>
                    `;
                }
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Safari native HLS
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', function() {
                video.play().catch(function(error) {
                    console.log('Auto-play prevented:', error);
                });
            });
        }
        
        // লোডার লুকানো
        video.addEventListener('playing', function() {
            loader.classList.add('hide-now');
        });
        
        video.addEventListener('waiting', function() {
            loader.classList.remove('hide-now');
        });
        
        video.addEventListener('canplay', function() {
            loader.classList.add('hide-now');
        });
        
        // অটোপ্লে ফলের
        video.addEventListener('loadedmetadata', function() {
            video.play().catch(function(error) {
                console.log('Auto-play prevented:', error);
                document.addEventListener('click', function playOnClick() {
                    video.play();
                    document.removeEventListener('click', playOnClick);
                }, { once: true });
            });
        });
        
        // কিবোর্ড শর্টকাট
        document.addEventListener('keydown', function(e) {
            if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey) {
                e.preventDefault();
                player.fullscreen.toggle();
            }
            if (e.key === ' ' && e.target === document.body) {
                e.preventDefault();
                player.togglePlay();
            }
        });
        
        console.log('🎬 PWlr প্লেয়ার লোড হয়েছে! (বড় স্কিন - JW স্টাইল)');
    })();
</script>

</body>
</html>
