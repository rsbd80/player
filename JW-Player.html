<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
    <title>RS Player - All Device</title>

    <script src="https://content.jwplatform.com/libraries/IDzF9Zmk.js"></script>
    <script>
        jwplayer.key="Khpp2dHxlBJHC8MCmLnBuV2jK/DwDnJMniwF6EO9HC/riJ712ZmbHg==";
    </script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html,body { width:100%; height:100%; background:#000; overflow:hidden; position:fixed; }
        #player { width:100%; height:100%; position:absolute; top:0; left:0; }
        
        /* ভিডিও পুরো স্ক্রিনে ফিট - কাটবে না */
        .jw-video.jw-reset {
            object-fit: contain !important;
            width: 100% !important;
            height: 100% !important;
        }
        
        .jw-media, .jw-media video, .jw-preview {
            width: 100% !important;
            height: 100% !important;
        }
        
        .jwplayer.jw-flag-fullscreen {
            width: 100vw !important;
            height: 100vh !important;
        }
        
        .jwplayer.jw-flag-fullscreen .jw-media video {
            object-fit: contain !important;
            width: 100% !important;
            height: 100% !important;
        }
        
        @supports (padding: env(safe-area-inset-top)) {
            .jwplayer.jw-flag-fullscreen {
                padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left) !important;
            }
        }
        
        /* লোডার */
        #loader {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:#000; display:flex; justify-content:center; align-items:center;
            z-index:9999; flex-direction:column; transition: opacity 0.3s ease;
        }
        #loader.hide { opacity:0; pointer-events:none; }
        .spinner {
            width:50px; height:50px; border:4px solid rgba(255,255,255,.1);
            border-top:4px solid #00c3ff; border-radius:50%;
            animation:spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform:rotate(360deg); } }
        #loader p { margin-top:15px; color:#fff; font-family:sans-serif; font-size:14px; }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <p id="status-text">Loading...</p>
</div>

<div id="player"></div>

<script>
    function getStreamUrl() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('url');
    }

    const streamSource = getStreamUrl();

    if (streamSource) {
        const player = jwplayer("player");

        // ============================================================
        // ইউনিভার্সাল সেটআপ - সব ডিভাইসে কাজ করবে
        // ============================================================
        player.setup({
            playlist: [{
                file: streamSource,
                type: "hls"
            }],
            width: "100%",
            height: "100%",
            autostart: true,
            mute: false,
            stretching: "uniform",      // ভিডিও কাটবে না
            controls: true,
            preload: "auto",
            playbackRateControls: [0.5, 0.75, 1, 1.25, 1.5, 2],
            defaultPlaybackRate: 1,
            primary: "html5",           // HTML5 প্রাথমিক
            hlshtml: true,              // HLS সাপোর্ট অন
            androidhls: true,           // অ্যান্ড্রয়েড HLS
            file: streamSource,
            type: "hls",
            // মোবাইল ও ডেস্কটপ উভয়ের জন্য
            sources: [{
                file: streamSource,
                type: "hls"
            }],
            // ফুলস্ক্রিনে পোর্ট্রেট সাপোর্ট
            fullscreen: {
                allow: true,
                on: false,
                orientation: "auto"
            }
        });

        // ============================================================
        // ডিভাইস ডিটেক্ট ও অ্যাডজাস্ট
        // ============================================================
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        const isDesktop = !isMobile;

        if (isDesktop) {
            // ডেস্কটপে HLS নেটিভ সাপোর্ট নেই - HLS.js ব্যবহার
            console.log('Desktop detected - using HLS.js fallback');
            
            // HLS.js লোড করুন
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js';
            script.onload = function() {
                if (Hls.isSupported()) {
                    const hls = new Hls({
                        enableWorker: true,
                        lowLatencyMode: true,
                        backbufferLength: 30
                    });
                    
                    // ভিডিও এলিমেন্ট খুঁজুন
                    const videoElement = document.querySelector('.jw-video');
                    if (videoElement) {
                        hls.loadSource(streamSource);
                        hls.attachMedia(videoElement);
                        
                        hls.on(Hls.Events.MANIFEST_PARSED, function() {
                            videoElement.play().catch(function(e) {
                                console.log('Play prevented:', e);
                            });
                        });
                        
                        hls.on(Hls.Events.ERROR, function(event, data) {
                            if (data.fatal) {
                                console.log('HLS Error - trying native playback');
                                // নেটিভ প্লেব্যাক চেষ্টা
                                videoElement.src = streamSource;
                                videoElement.play().catch(function(e) {
                                    console.log('Native play failed:', e);
                                });
                            }
                        });
                    }
                }
            };
            document.head.appendChild(script);
        }

        // ============================================================
        // JW Player ইভেন্ট
        // ============================================================
        let loaderHidden = false;
        
        function hideLoader() {
            if (!loaderHidden) {
                document.getElementById('loader').classList.add('hide');
                loaderHidden = true;
                setTimeout(() => {
                    document.getElementById('loader').style.display = 'none';
                }, 400);
            }
        }

        player.on("ready", function() {
            hideLoader();
            player.setMute(false);
            player.setVolume(100);
            
            // ভিডিও ফিট ফোর্স
            setTimeout(() => {
                const videoElement = document.querySelector('.jw-video');
                if (videoElement) {
                    videoElement.style.objectFit = 'contain';
                    videoElement.style.width = '100%';
                    videoElement.style.height = '100%';
                }
            }, 200);
        });

        player.on("play", function() {
            hideLoader();
            if(player.getMute()) {
                player.setMute(false);
            }
        });

        player.on("fullscreen", function() {
            setTimeout(() => {
                const videoElement = document.querySelector('.jw-video');
                if (videoElement) {
                    videoElement.style.objectFit = 'contain';
                    videoElement.style.width = '100%';
                    videoElement.style.height = '100%';
                }
            }, 200);
        });

        player.on("error", function(error) {
            console.log("JW Player Error:", error);
            
            // যদি স্ট্রিম ফেইল করে, রিলোড চেষ্টা
            setTimeout(() => {
                try {
                    player.load([{
                        file: streamSource,
                        type: "hls"
                    }]);
                } catch(e) {
                    document.getElementById("status-text").innerText = "Stream Failed!";
                }
            }, 2000);
        });

        // ============================================================
        // কিবোর্ড শর্টকাট
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey) {
                e.preventDefault();
                player.setFullscreen(true);
            }
            if (e.key === ' ' && e.target === document.body) {
                e.preventDefault();
                if (player.getState() === 'playing') {
                    player.pause();
                } else {
                    player.play();
                }
            }
        });

        console.log('RS Player Loaded - All Device Support');
        console.log('Device:', isMobile ? 'Mobile' : 'Desktop');

    } else {
        document.getElementById("status-text").innerText = "No URL Provided!";
    }
</script>

</body>
</html>
