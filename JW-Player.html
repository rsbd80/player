
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RS LIVE TV Player</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
    }
    #player {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="player"></div>

  <script src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
  <script>
    const m3u8Url = new URLSearchParams(window.location.search).get('url');

    if (m3u8Url) {
      new Clappr.Player({
        source: m3u8Url,
        parentId: '#player',
        autoPlay: true,
        width: '100%',
        height: '100%',
        mute: false,
      });
    } else {
      document.body.innerHTML = "<h2 style='color:white; text-align:center; margin-top:20%'>No stream URL provided.</h2>";
    }
  </script>
</body>
</html>
