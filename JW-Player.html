<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>RS Player Pro</title>

    <script src="https://content.jwplatform.com/libraries/IDzF9Zmk.js"></script>
    <script>
        jwplayer.key = "Khpp2dHxlBJHC8MCmLnBuV2jK/DwDnJMniwF6EO9HC/riJ712ZmbHg==";
    </script>

    <link rel="preconnect" href="https://content.jwplatform.com">

    <style>
        :root{
            --bg: #06090a;
            --panel: #0c1412;
            --signal: #6dffb0;
            --signal-dim: #235c44;
            --warn: #ffb84d;
            --alert: #ff5d5d;
            --text: #d9f2e6;
            --text-dim: #6d8a80;
            --mono: 'JetBrains Mono','Space Mono','Courier New',monospace;
        }
        *{ margin:0; padding:0; box-sizing:border-box; }
        html,body{
            width:100%; height:100%;
            background:var(--bg);
            overflow:hidden;
            font-family:var(--mono);
            position:fixed;
        }

        #player-wrapper{
            position:relative;
            width:100%; height:100%;
            overflow:hidden;
            background:#000;
        }
        #player{
            width:100% !important;
            height:100% !important;
            position:absolute;
            top:0; left:0;
        }

        /* ---------- JW controlbar skin ---------- */
        .jw-skin-glow .jw-display-icon-container{
            background: rgba(109,255,176,0.08) !important;
            border: 1px solid rgba(109,255,176,0.35);
            backdrop-filter: none !important;
        }
        .jw-skin-glow .jw-button-color{ color:#ffffff !important; }
        .jw-skin-glow .jw-controlbar{
            background: linear-gradient(0deg, rgba(0,0,0,0.75), transparent) !important;
            backdrop-filter: none !important;
        }
        .jw-skin-glow .jw-slider-time .jw-progress{ background: var(--signal) !important; }
        .jw-skin-glow .jw-knob{ background: var(--signal) !important; }

        .jw-video.jw-reset{ object-fit: fill !important; }

        /* ================= SIGNAL TUNER LOADER ================= */
        #loader{
            position:absolute; inset:0;
            background: radial-gradient(120% 100% at 50% 100%, #0c1a15 0%, var(--bg) 60%);
            display:flex; justify-content:center; align-items:center;
            flex-direction:column;
            z-index:99;
            transition: opacity .5s ease, visibility .5s ease;
        }
        #loader::before{
            /* scanline texture */
            content:"";
            position:absolute; inset:0;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,0.025) 0px,
                rgba(255,255,255,0.025) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events:none;
            animation: scan-drift 6s linear infinite;
        }
        @keyframes scan-drift{
            0%{ background-position: 0 0; }
            100%{ background-position: 0 40px; }
        }

        .tuner{
            position:relative;
            display:flex; flex-direction:column;
            align-items:center;
            gap:22px;
        }

        /* frequency bars — the signature element */
        .freq-bars{
            display:flex;
            align-items:flex-end;
            gap:5px;
            height:54px;
        }
        .freq-bars span{
            width:5px;
            border-radius:2px;
            background: linear-gradient(to top, var(--signal-dim), var(--signal));
            box-shadow: 0 0 8px rgba(109,255,176,0.55);
            animation: bar-pulse 1.1s ease-in-out infinite;
            transform-origin: bottom;
        }
        .freq-bars span:nth-child(1){ height:18%; animation-delay:-1.0s; }
        .freq-bars span:nth-child(2){ height:42%; animation-delay:-0.8s; }
        .freq-bars span:nth-child(3){ height:70%; animation-delay:-0.6s; }
        .freq-bars span:nth-child(4){ height:95%; animation-delay:-0.4s; }
        .freq-bars span:nth-child(5){ height:55%; animation-delay:-0.9s; }
        .freq-bars span:nth-child(6){ height:80%; animation-delay:-0.3s; }
        .freq-bars span:nth-child(7){ height:35%; animation-delay:-0.7s; }
        .freq-bars span:nth-child(8){ height:60%; animation-delay:-0.2s; }
        .freq-bars span:nth-child(9){ height:25%; animation-delay:-0.5s; }

        @keyframes bar-pulse{
            0%,100%{ transform: scaleY(0.35); opacity:.6; }
            50%{ transform: scaleY(1); opacity:1; }
        }

        .dial-ring{
            position:absolute;
            top:-26px; left:50%;
            transform: translateX(-50%);
            width:120px; height:120px;
            border-radius:50%;
            border: 1px solid rgba(109,255,176,0.15);
        }
        .dial-ring::after{
            content:"";
            position:absolute;
            top:-1px; left:50%;
            width:6px; height:6px;
            margin-left:-3px;
            border-radius:50%;
            background: var(--signal);
            box-shadow: 0 0 6px var(--signal), 0 0 14px var(--signal);
            animation: dial-sweep 2.4s linear infinite;
        }
        @keyframes dial-sweep{
            100%{ transform: rotate(360deg); transform-origin: 3px 63px; }
        }

        .brand-row{
            display:flex; align-items:baseline; gap:8px;
            letter-spacing:2px;
        }
        .brand-name{
            font-size:13px; font-weight:700;
            color:var(--text);
            text-transform:uppercase;
        }
        .brand-name em{
            color:var(--signal);
            font-style:normal;
        }
        .chan-tag{
            font-size:10px;
            color:var(--text-dim);
            border:1px solid var(--signal-dim);
            border-radius:3px;
            padding:1px 6px;
        }

        .status-line{
            font-size:10.5px;
            letter-spacing:2.5px;
            color:var(--text-dim);
            text-transform:uppercase;
            min-height:14px;
        }
        .status-line .cursor{
            display:inline-block;
            width:6px;
            animation: blink 1s steps(1) infinite;
            color:var(--signal);
        }
        @keyframes blink{ 50%{ opacity:0; } }

        .hide-now{ opacity:0 !important; visibility:hidden !important; }

        /* ---------- tap-to-toggle sound flash ---------- */
        #sound-flash{
            position:absolute;
            top:50%; left:50%;
            transform: translate(-50%,-50%) scale(0.85);
            z-index:50;
            width:64px; height:64px;
            border-radius:50%;
            background: rgba(6,9,10,0.68);
            border:1px solid rgba(109,255,176,0.4);
            display:flex; align-items:center; justify-content:center;
            opacity:0;
            pointer-events:none;
            transition: opacity .18s ease, transform .18s ease;
            backdrop-filter: blur(4px);
        }
        #sound-flash.show{
            opacity:1;
            transform: translate(-50%,-50%) scale(1);
        }
        #sound-flash svg{ width:26px; height:26px; }
        #sound-flash .bar{
            fill:none;
            stroke: var(--signal);
            stroke-width:2.4;
            stroke-linecap:round;
        }

        /* ---------- error / empty states ---------- */
        .state-content{
            text-align:center;
            color: var(--text);
            z-index:100;
            padding: 0 24px;
        }
        .state-content .glyph{
            font-size:34px;
            color: var(--alert);
            margin-bottom:14px;
            line-height:1;
        }
        .state-content .glyph.warn{ color: var(--warn); }
        .state-content p.title{
            font-size:12px;
            letter-spacing:2px;
            text-transform:uppercase;
        }
        .state-content p.sub{
            font-size:10.5px;
            color: var(--text-dim);
            margin-top:8px;
            letter-spacing:1px;
            max-width:280px;
        }
        .state-content .brand-row{ justify-content:center; margin-top:18px; }

        .retry-btn{
            margin-top:16px;
            padding:8px 18px;
            font-family:var(--mono);
            font-size:10.5px;
            letter-spacing:1.5px;
            text-transform:uppercase;
            color:var(--bg);
            background: var(--signal);
            border:none;
            border-radius:18px;
            cursor:pointer;
        }
        .retry-btn:active{ transform: scale(0.96); }
    </style>
</head>
<body>

    <div id="player-wrapper">
        <div id="loader">
            <div class="tuner">
                <div class="dial-ring"></div>
                <div class="freq-bars">
                    <span></span><span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span>
                </div>
                <div class="brand-row">
                    <span class="brand-name">RS LIVE <em>TV</em></span>
                    <span class="chan-tag" id="chan-tag">SRC 01</span>
                </div>
                <div class="status-line" id="status-line">ACQUIRING SIGNAL<span class="cursor">_</span></div>
            </div>
        </div>
        <div id="player"></div>
        <div id="sound-flash"></div>
    </div>

    <script>
        const urlParams   = new URLSearchParams(window.location.search);
        const streamSource = urlParams.get('url');
        const forcedType   = (urlParams.get('type') || '').toLowerCase();
        const startMuted   = urlParams.get('mute') !== '0'; // muted-autostart by default = faster, reliable start

        const loaderEl    = document.getElementById('loader');
        const statusEl    = document.getElementById('status-line');
        const chanTagEl   = document.getElementById('chan-tag');
        const soundFlash  = document.getElementById('sound-flash');
        const wrapperEl   = document.getElementById('player-wrapper');

        const ICON_ON  = '<svg viewBox="0 0 24 24"><path class="bar" d="M4 9v6h4l5 4V5L8 9H4z"/><path class="bar" d="M16.5 8.5c1.2 1.2 1.2 5.8 0 7"/><path class="bar" d="M19 6c2.5 2.5 2.5 9.5 0 12"/></svg>';
        const ICON_OFF = '<svg viewBox="0 0 24 24"><path class="bar" d="M4 9v6h4l5 4V5L8 9H4z"/><path class="bar" d="M16 9l5 6"/><path class="bar" d="M21 9l-5 6"/></svg>';

        function flashSoundIcon(muted){
            soundFlash.innerHTML = muted ? ICON_OFF : ICON_ON;
            soundFlash.classList.add('show');
            clearTimeout(flashSoundIcon._t);
            flashSoundIcon._t = setTimeout(() => soundFlash.classList.remove('show'), 550);
        }

        const statusMessages = [
            'ACQUIRING SIGNAL',
            'LOCKING FREQUENCY',
            'DECODING STREAM',
            'BUFFERING FEED'
        ];
        let statusIdx = 0;
        let statusTimer = setInterval(() => {
            statusIdx = (statusIdx + 1) % statusMessages.length;
            statusEl.innerHTML = statusMessages[statusIdx] + '<span class="cursor">_</span>';
        }, 1600);

        function showLoader(){ loaderEl.classList.remove('hide-now'); }
        function hideLoader(){ loaderEl.classList.add('hide-now'); }

        function showState(html){
            clearInterval(statusTimer);
            showLoader();
            loaderEl.innerHTML = html;
        }

        function brandBlock(){
            return '<div class="brand-row"><span class="brand-name">RS LIVE <em>TV</em></span></div>';
        }

        // ---- detect stream type from the URL so every common link works ----
        function detectType(raw){
            if (forcedType) return forcedType;
            const clean = raw.split('?')[0].split('#')[0].toLowerCase();
            if (clean.endsWith('.m3u8'))            return 'hls';
            if (clean.endsWith('.mpd'))             return 'dash';
            if (clean.endsWith('.mp4'))             return 'mp4';
            if (clean.endsWith('.webm'))            return 'webm';
            if (clean.endsWith('.mov'))             return 'mp4';
            if (clean.endsWith('.ogg') || clean.endsWith('.ogv')) return 'ogg';
            if (raw.includes('.m3u8'))              return 'hls'; // token stream: .m3u8?token=...
            if (raw.includes('.mpd'))               return 'dash';
            return null; // let JW Player auto-sniff anything else
        }

        if (!streamSource) {
            showState(
                '<div class="state-content">' +
                    '<div class="glyph warn"><i>&#9888;</i></div>' +
                    '<p class="title">No stream URL supplied</p>' +
                    '<p class="sub">Add ?url=YOUR_STREAM_LINK to this page\'s address.</p>' +
                    brandBlock() +
                '</div>'
            );
        } else {
            const streamType = detectType(streamSource);
            chanTagEl.textContent = (streamType || 'auto').toUpperCase();

            const playlistItem = { file: streamSource };
            if (streamType) playlistItem.type = streamType;

            const player = jwplayer('player').setup({
                playlist: [ playlistItem ],
                width: '100%',
                height: '100%',
                autostart: true,
                mute: startMuted,          // muted autostart = browsers allow it instantly, video appears fastest
                preload: 'auto',
                stretching: 'exactfit',    // keeps the frame filled edge-to-edge (matches source aspect handling)
                liveTimeout: 0,            // never auto-stop a live feed on its own
                skin: { name: 'glow' },
                displaytitle: false
            });

            let retryCount = 0;
            const maxRetries = 6;
            let retryTimer = null;
            let isMuted = startMuted;

            player.on('ready', () => {
                console.log('Player ready — source type:', streamType || 'auto-detected');
            });

            player.on('firstFrame', () => {
                clearInterval(statusTimer);
                hideLoader();
                retryCount = 0;
                console.log('First frame painted');
            });

            player.on('play', () => {
                hideLoader();
            });

            player.on('buffer', () => {
                showLoader();
            });

            player.on('error', handleFault);
            player.on('setupError', handleFault);

            function handleFault(err){
                console.error('Player error:', err);
                if (retryCount < maxRetries) {
                    retryCount++;
                    statusEl.innerHTML = 'RECONNECTING (' + retryCount + '/' + maxRetries + ')<span class="cursor">_</span>';
                    showLoader();
                    clearTimeout(retryTimer);
                    retryTimer = setTimeout(() => {
                        player.load([ playlistItem ]);
                        player.play(true);
                    }, Math.min(1000 * retryCount, 4000));
                    return;
                }
                showState(
                    '<div class="state-content">' +
                        '<div class="glyph"><i>&#10060;</i></div>' +
                        '<p class="title">Stream offline</p>' +
                        '<p class="sub">' + ((err && err.message) ? err.message : 'The source could not be reached.') + '</p>' +
                        '<button class="retry-btn" onclick="location.reload()">Retry</button>' +
                        brandBlock() +
                    '</div>'
                );
            }

            // every tap on the video toggles sound on/off — no separate unmute button
            wrapperEl.addEventListener('click', (e) => {
                if (e.target.closest('.jw-controlbar')) return; // let volume/seek controls behave normally
                isMuted = !isMuted;
                player.setMute(isMuted);
                if (!isMuted) player.setVolume(100);
                flashSoundIcon(isMuted);
            });
        }
    </script>

</body>
</html>
