<!DOCTYPE html>
<html>
<head>
    <title>Fullscreen Cover Player</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.6.2/dist/plyr.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            background: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        
        #player-container {
            width: 100%;
            height: 100vh;
            position: relative;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #player {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
            object-fit: contain;
        }
        
        /* Plyr ওভাররাইড - পুরো স্ক্রিন কভার */
        .plyr {
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            border-radius: 0 !important;
            background: #000 !important;
        }
        
        .plyr__video-wrapper {
            width: 100% !important;
            height: 100% !important;
            background: #000 !important;
            position: relative !important;
        }
        
        .plyr__video-wrapper video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            background: #000 !important;
        }
        
        /* ফুলস্ক্রিন মোড - পুরো স্ক্রিন কভার */
        .plyr--fullscreen {
            background: #000 !important;
        }
        
        .plyr--fullscreen .plyr__video-wrapper {
            width: 100vw !important;
            height: 100vh !important;
        }
        
        .plyr--fullscreen .plyr__video-wrapper video {
            object-fit: cover !important;
            width: 100vw !important;
            height: 100vh !important;
        }
        
        /* কন্ট্রোল স্টাইল */
        .plyr__controls {
            background: linear-gradient(transparent, rgba(0,0,0,0.8)) !important;
            padding: 20px 15px 15px 15px !important;
        }
        
        .plyr__control {
            background: rgba(255,255,255,0.1) !important;
            border-radius: 6px !important;
            padding: 8px 12px !important;
        }
        
        .plyr__control:hover {
            background: rgba(255,255,255,0.2) !important;
        }
        
        .plyr__progress {
            height: 6px !important;
            background: rgba(255,255,255,0.2) !important;
        }
        
        .plyr__progress__played {
            background: linear-gradient(90deg, #00b3ff, #0099ff) !important;
        }
        
        /* মোবাইল ফ্রেন্ডলি */
        @media (max-width: 768px) {
            .plyr__controls {
                padding: 15px 8px 10px 8px !important;
                gap: 3px !important;
            }
            .plyr__control {
                padding: 6px 8px !important;
                min-width: 32px !important;
            }
            .plyr__progress {
                min-width: 50px !important;
            }
        }
        
        /* ল্যান্ডস্কেপ মোডে */
        @media (orientation: landscape) {
            .plyr--fullscreen .plyr__video-wrapper video {
                object-fit: cover !important;
            }
        }
        
        /* পোর্ট্রেট মোডে */
        @media (orientation: portrait) {
            .plyr--fullscreen .plyr__video-wrapper video {
                object-fit: cover !important;
            }
        }
    </style>
</head>
<body>

<div id="player-container">
    <video id="player" controls crossorigin playsinline autoplay>
        <source type="application/vnd.apple.mpegurl" src="">
    </video>
</div>

<script src="https://cdn.jsdelivr.net/npm/plyr@3.6.12/dist/plyr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.4/dist/hls.min.js"></script>

<script>
    // URL থেকে url প্যারামিটার
    const urlParams = new URLSearchParams(window.location.search);
    const videoSrc = urlParams.get('url');
    
    const video = document.getElementById('player');
    const source = video.querySelector('source');
    const container = document.getElementById('player-container');
    
    if (videoSrc) {
        source.src = videoSrc;
    }

    document.addEventListener("DOMContentLoaded", () => {
        // প্লেয়ার ইনিশিয়ালাইজ
        const player = new Plyr(video, {
            autoplay: true,
            controls: [
                'play-large', 'play', 'progress', 'current-time', 'mute', 
                'volume', 'captions', 'settings', 'pip', 'airplay', 
                'fullscreen'
            ]
        });

        // HLS সাপোর্ট
        if (Hls.isSupported() && videoSrc) {
            const hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                backbufferLength: 30
            });
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(function(error) {
                    console.log('Auto-play prevented:', error);
                });
            });
        }

        // ফুলস্ক্রিন ইভেন্ট - পুরো স্ক্রিন কভার নিশ্চিত
        player.on('fullscreen', () => {
            if (player.fullscreen.active) {
                // ফুলস্ক্রিনে গেলে
                document.documentElement.style.overflow = 'hidden';
                document.body.style.overflow = 'hidden';
                
                // ভিডিও পুরো স্ক্রিন কভার
                video.style.objectFit = 'cover';
                video.style.width = '100vw';
                video.style.height = '100vh';
                
                // Plyr কন্টেইনার পুরো স্ক্রিন
                const plyrContainer = document.querySelector('.plyr');
                if (plyrContainer) {
                    plyrContainer.style.width = '100vw';
                    plyrContainer.style.height = '100vh';
                    plyrContainer.style.maxWidth = 'none';
                    plyrContainer.style.borderRadius = '0';
                }
            } else {
                // ফুলস্ক্রিন থেকে বের হলে
                document.documentElement.style.overflow = '';
                document.body.style.overflow = '';
                
                video.style.objectFit = 'contain';
                video.style.width = '100%';
                video.style.height = '100%';
            }
        });

        // স্ক্রিন রোটেশন ডিটেক্ট
        let lastOrientation = window.orientation || 0;
        window.addEventListener('orientationchange', () => {
            const newOrientation = window.orientation || 0;
            
            // ফুলস্ক্রিনে থাকলে ভিডিও কভার রেখে
            if (player.fullscreen.active) {
                setTimeout(() => {
                    video.style.objectFit = 'cover';
                    video.style.width = '100vw';
                    video.style.height = '100vh';
                }, 300);
            }
            lastOrientation = newOrientation;
        });

        // অটোপ্লে
        video.addEventListener('loadedmetadata', function() {
            video.play().catch(function(error) {
                console.log('Auto-play prevented:', error);
                document.addEventListener('click', function playOnClick() {
                    video.play();
                    document.removeEventListener('click', playOnClick);
                }, { once: true });
            });
        });

        // কিবোর্ড শর্টকাট
        document.addEventListener('keydown', (e) => {
            if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey) {
                e.preventDefault();
                player.fullscreen.toggle();
            }
            if (e.key === ' ' && e.target === document.body) {
                e.preventDefault();
                player.togglePlay();
            }
        });

        console.log('🎬 ফুলস্ক্রিন কভার প্লেয়ার লোড হয়েছে!');
    });
</script>

</body>
</html>
