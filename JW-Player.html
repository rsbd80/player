<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>RS Player Pro</title>

    <script src="https://content.jwplatform.com/libraries/IDzF9Zmk.js"></script>
    <script>
        jwplayer.key = "Khpp2dHxlBJHC8MCmLnBuV2jK/DwDnJMniwF6EO9HC/riJ712ZmbHg==";
    </script>

    <link rel="preconnect" href="https://content.jwplatform.com">

    <style>
        :root{
            --bg-1: #07070d;
            --bg-2: #14101f;
            --bg-3: #1b1330;
            --grad-a: #22d3ee;
            --grad-b: #a78bfa;
            --grad-c: #fb923c;
            --grad-d: #f472b6;
            --warn: #ffb84d;
            --alert: #ff5d5d;
            --text: #eef0f7;
            --text-dim: #8a8aa5;
            --font: 'Poppins','Segoe UI',sans-serif;
            --mono: 'JetBrains Mono','Courier New',monospace;
        }
        *{ margin:0; padding:0; box-sizing:border-box; }
        html,body{
            width:100%; height:100%;
            background:var(--bg-1);
            overflow:hidden;
            font-family:var(--font);
            position:fixed;
        }

        #player-wrapper{
            position:relative;
            width:100%; height:100%;
            overflow:hidden;
            background:#000;
        }
        #player{
            width:100% !important;
            height:100% !important;
            position:absolute;
            top:0; left:0;
            touch-action: manipulation; /* suppress native double-tap zoom/fullscreen gesture */
        }
        #player video{
            touch-action: manipulation;
        }

        /* ---------- JW controlbar skin ---------- */
        .jw-skin-glow .jw-display-icon-container{
            background: rgba(167,139,250,0.10) !important;
            border: 1px solid rgba(167,139,250,0.4);
            backdrop-filter: none !important;
        }
        .jw-skin-glow .jw-button-color{ color:#ffffff !important; }
        .jw-skin-glow .jw-controlbar{
            background: linear-gradient(0deg, rgba(0,0,0,0.75), transparent) !important;
            backdrop-filter: none !important;
        }
        .jw-skin-glow .jw-slider-time .jw-progress{ background: var(--grad-b) !important; }
        .jw-skin-glow .jw-knob{ background: var(--grad-b) !important; }

        .jw-video.jw-reset{ object-fit: fill !important; }

        /* ================= LOADER ================= */
        #loader{
            position:absolute; inset:0;
            display:flex; justify-content:center; align-items:center;
            flex-direction:column;
            z-index:99;
            overflow:hidden;
            transition: opacity .5s ease, visibility .5s ease;
        }

        /* animated gradient backdrop */
        #loader::before{
            content:'';
            position:absolute; inset:-20%;
            background:
                radial-gradient(38% 30% at 20% 25%, rgba(34,211,238,0.16), transparent 65%),
                radial-gradient(42% 34% at 80% 20%, rgba(167,139,250,0.18), transparent 65%),
                radial-gradient(46% 38% at 50% 85%, rgba(251,146,60,0.10), transparent 65%),
                radial-gradient(100% 80% at 50% 50%, var(--bg-2) 0%, var(--bg-1) 75%);
            animation: backdrop-drift 12s ease-in-out infinite;
            z-index:0;
        }
        @keyframes backdrop-drift{
            0%,100%{ transform: translate3d(0,0,0) scale(1); }
            50%{ transform: translate3d(-2%, -1.5%, 0) scale(1.06); }
        }

        /* faint sweeping scanline for a "tuning in" feel */
        #loader::after{
            content:'';
            position:absolute;
            left:-10%; right:-10%; height:140px;
            top:-140px;
            background: linear-gradient(180deg, transparent, rgba(238,240,247,0.05), transparent);
            animation: scan-sweep 3.6s linear infinite;
            z-index:0;
            pointer-events:none;
        }
        @keyframes scan-sweep{
            0%{ transform: translateY(0); }
            100%{ transform: translateY(calc(100vh + 280px)); }
        }

        .tuner{
            position:relative;
            z-index:2;
            display:flex; flex-direction:column;
            align-items:center;
            gap:22px;
        }

        /* signature element — TV set with a looping colour-bar screen, glowing frame + orbiting ring */
        .tv-wrap{
            position:relative;
            width:92px; height:92px;
            display:flex; align-items:center; justify-content:center;
        }
        .tv-glow{
            position:absolute;
            width:100%; height:100%;
            border-radius:50%;
            background: radial-gradient(circle, rgba(167,139,250,0.38), transparent 70%);
            animation: glow-pulse 2.4s ease-in-out infinite;
        }
        @keyframes glow-pulse{
            0%,100%{ transform:scale(0.85); opacity:.5; }
            50%{ transform:scale(1.18); opacity:1; }
        }

        /* rotating dashed ring — reads as "searching / connecting" */
        .tv-ring{
            position:absolute;
            width:100%; height:100%;
            border-radius:50%;
            border: 2px solid transparent;
            border-top-color: var(--grad-a);
            border-right-color: var(--grad-b);
            filter: drop-shadow(0 0 6px rgba(167,139,250,0.35));
            animation: ring-spin 1.5s linear infinite;
        }
        .tv-ring.slow{
            width:112%; height:112%;
            border-top-color: transparent;
            border-right-color: transparent;
            border-bottom-color: var(--grad-c);
            border-left-color: var(--grad-d);
            opacity:.55;
            animation: ring-spin-rev 2.6s linear infinite;
        }
        @keyframes ring-spin{ from{ transform: rotate(0); } to{ transform: rotate(360deg); } }
        @keyframes ring-spin-rev{ from{ transform: rotate(360deg); } to{ transform: rotate(0); } }

        .tv-icon{ position:relative; width:56px; height:56px; z-index:1; }
        .tv-icon .tv-body{
            fill:none;
            stroke: var(--text);
            stroke-width:2;
            stroke-linecap:round;
            stroke-linejoin:round;
        }
        .tv-icon .screen-bars rect{
            transform-origin: bottom;
            animation: bar-flicker 1.6s ease-in-out infinite;
        }
        .tv-icon .screen-bars rect:nth-child(1){ fill:var(--grad-a); animation-delay:-1.2s; }
        .tv-icon .screen-bars rect:nth-child(2){ fill:var(--grad-b); animation-delay:-0.9s; }
        .tv-icon .screen-bars rect:nth-child(3){ fill:var(--grad-c); animation-delay:-0.6s; }
        .tv-icon .screen-bars rect:nth-child(4){ fill:var(--grad-b); animation-delay:-0.3s; }
        .tv-icon .screen-bars rect:nth-child(5){ fill:var(--grad-a); animation-delay:0s; }
        @keyframes bar-flicker{
            0%,100%{ transform: scaleY(0.45); opacity:.65; }
            50%{ transform: scaleY(1); opacity:1; }
        }

        .brand-block{
            display:flex; flex-direction:column; align-items:center; gap:8px;
        }
        .brand-name{
            font-size:16px; font-weight:700;
            letter-spacing:1.5px;
            text-transform:uppercase;
            background: linear-gradient(90deg, var(--grad-a), var(--grad-b), var(--grad-d));
            background-size: 200% auto;
            -webkit-background-clip:text;
            background-clip:text;
            color:transparent;
            animation: brand-sheen 3.5s linear infinite;
        }
        @keyframes brand-sheen{
            0%{ background-position: 0% center; }
            100%{ background-position: 200% center; }
        }
        .brand-name b{ color:var(--text); -webkit-text-fill-color:var(--text); }

        /* three softly pulsing dots — the only loading indicator, no cycling text */
        .dots{
            display:flex; gap:7px;
        }
        .dots span{
            width:6px; height:6px;
            border-radius:50%;
            background: linear-gradient(135deg, var(--grad-a), var(--grad-b));
            animation: dot-pulse 1.2s ease-in-out infinite;
        }
        .dots span:nth-child(1){ animation-delay:0s; }
        .dots span:nth-child(2){ animation-delay:.2s; }
        .dots span:nth-child(3){ animation-delay:.4s; }
        @keyframes dot-pulse{
            0%,80%,100%{ transform:scale(0.6); opacity:.35; }
            40%{ transform:scale(1.15); opacity:1; }
        }

        .status-line{
            font-family:var(--mono);
            font-size:9.5px;
            letter-spacing:2.5px;
            color:var(--text-dim);
            text-transform:uppercase;
            min-width:1px;
            transition: opacity .25s ease;
        }

        /* thin indeterminate progress bar under the status text */
        .progress-track{
            width:120px; height:2px;
            border-radius:2px;
            background: rgba(238,240,247,0.08);
            overflow:hidden;
            position:relative;
        }
        .progress-track::after{
            content:'';
            position:absolute;
            top:0; left:0; height:100%; width:40%;
            border-radius:2px;
            background: linear-gradient(90deg, transparent, var(--grad-a), var(--grad-b), transparent);
            animation: progress-slide 1.4s ease-in-out infinite;
        }
        @keyframes progress-slide{
            0%{ left:-40%; }
            100%{ left:100%; }
        }

        .hide-now{ opacity:0 !important; visibility:hidden !important; }

        /* ---------- error / empty states ---------- */
        .state-content{
            position:relative; z-index:2;
            text-align:center;
            color: var(--text);
            padding: 0 24px;
            font-family:var(--font);
        }
        .state-content .glyph{
            font-size:34px;
            color: var(--alert);
            margin-bottom:14px;
            line-height:1;
            filter: drop-shadow(0 0 10px rgba(255,93,93,0.35));
        }
        .state-content .glyph.warn{
            color: var(--warn);
            filter: drop-shadow(0 0 10px rgba(255,184,77,0.35));
        }
        .state-content p.title{
            font-size:13px;
            letter-spacing:1px;
            font-weight:600;
        }
        .state-content p.sub{
            font-family:var(--mono);
            font-size:10.5px;
            color: var(--text-dim);
            margin-top:8px;
            letter-spacing:.5px;
            max-width:280px;
            margin-left:auto; margin-right:auto;
        }
        .state-content .brand-name{ display:block; margin-top:18px; }

        .retry-btn{
            margin-top:16px;
            padding:9px 22px;
            font-family:var(--font);
            font-weight:600;
            font-size:11px;
            letter-spacing:.5px;
            color:#0a0a12;
            background: linear-gradient(90deg, var(--grad-a), var(--grad-b));
            border:none;
            border-radius:18px;
            cursor:pointer;
            box-shadow: 0 4px 18px rgba(167,139,250,0.35);
            transition: transform .15s ease, box-shadow .15s ease;
        }
        .retry-btn:active{ transform: scale(0.96); box-shadow: 0 2px 10px rgba(167,139,250,0.3); }
    </style>
</head>
<body>

    <div id="player-wrapper">
        <div id="loader">
            <div class="tuner">
                <div class="tv-wrap">
                    <div class="tv-glow"></div>
                    <div class="tv-ring"></div>
                    <div class="tv-ring slow"></div>
                    <svg class="tv-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                        <path class="tv-body" d="M22 12 32 20 42 12"/>
                        <clipPath id="screenClip"><rect x="12" y="20" width="40" height="26" rx="4"/></clipPath>
                        <g class="screen-bars" clip-path="url(#screenClip)">
                            <rect x="12" y="20" width="8" height="26"/>
                            <rect x="20" y="20" width="8" height="26"/>
                            <rect x="28" y="20" width="8" height="26"/>
                            <rect x="36" y="20" width="8" height="26"/>
                            <rect x="44" y="20" width="8" height="26"/>
                        </g>
                        <rect class="tv-body" x="12" y="20" width="40" height="26" rx="4"/>
                        <line class="tv-body" x1="24" y1="46" x2="24" y2="50"/>
                        <line class="tv-body" x1="40" y1="46" x2="40" y2="50"/>
                        <line class="tv-body" x1="20" y1="50" x2="44" y2="50"/>
                    </svg>
                </div>
                <div class="brand-block">
                    <div class="brand-name"><b>RS LIVE</b> TV</div>
                    <div class="dots"><span></span><span></span><span></span></div>
                </div>
                <div class="progress-track"></div>
                <div class="status-line" id="status-line">LOADING</div>
            </div>
        </div>
        <div id="player"></div>
    </div>

    <script>
        const urlParams   = new URLSearchParams(window.location.search);
        const streamSource = urlParams.get('url');
        const forcedType   = (urlParams.get('type') || '').toLowerCase();
        const startMuted   = urlParams.get('mute') === '1'; // plays with sound on by default now

        const loaderEl    = document.getElementById('loader');
        const statusEl    = document.getElementById('status-line');

        const statusMessages = ['LOADING', 'BUFFERING', 'CONNECTING'];
        let statusIdx = 0;
        let statusTimer = setInterval(() => {
            statusEl.style.opacity = '0';
            setTimeout(() => {
                statusIdx = (statusIdx + 1) % statusMessages.length;
                statusEl.textContent = statusMessages[statusIdx];
                statusEl.style.opacity = '1';
            }, 200);
        }, 1800);

        function showLoader(){ loaderEl.classList.remove('hide-now'); }
        function hideLoader(){ loaderEl.classList.add('hide-now'); }

        function showState(html){
            clearInterval(statusTimer);
            showLoader();
            loaderEl.innerHTML = html;
        }

        function brandBlock(){
            return '<div class="brand-name"><b>RS LIVE</b> TV</div>';
        }

        // ---- detect stream type from the URL so every common link works ----
        function detectType(raw){
            if (forcedType) return forcedType;
            const clean = raw.split('?')[0].split('#')[0].toLowerCase();
            if (clean.endsWith('.m3u8'))            return 'hls';
            if (clean.endsWith('.mpd'))             return 'dash';
            if (clean.endsWith('.mp4'))             return 'mp4';
            if (clean.endsWith('.webm'))            return 'webm';
            if (clean.endsWith('.mov'))             return 'mp4';
            if (clean.endsWith('.ogg') || clean.endsWith('.ogv')) return 'ogg';
            if (raw.includes('.m3u8'))              return 'hls'; // token stream: .m3u8?token=...
            if (raw.includes('.mpd'))               return 'dash';
            return null; // let JW Player auto-sniff anything else
        }

        if (!streamSource) {
            showState(
                '<div class="state-content">' +
                    '<div class="glyph warn"><i>&#9888;</i></div>' +
                    '<p class="title">No stream URL supplied</p>' +
                    '<p class="sub">Add ?url=YOUR_STREAM_LINK to this page\'s address.</p>' +
                    brandBlock() +
                '</div>'
            );
        } else {
            const streamType = detectType(streamSource);

            const playlistItem = { file: streamSource };
            if (streamType) playlistItem.type = streamType;

            const player = jwplayer('player').setup({
                playlist: [ playlistItem ],
                width: '100%',
                height: '100%',
                autostart: true,
                mute: startMuted,          // sound on by default now — plays audibly right away
                preload: 'auto',
                stretching: 'uniform',      // less GPU-heavy than exactfit; reduces resize hitches on fullscreen toggle
                liveTimeout: 0,            // never auto-stop a live feed on its own
                skin: { name: 'glow' },
                displaytitle: false
            });

            let retryCount = 0;
            const maxRetries = 6;
            let retryTimer = null;
            let everPlayed = false;

            // if nothing plays within this window, stop retrying and tell the user the link won't play
            const NO_STREAM_TIMEOUT = 10000;
            let noStreamTimer = setTimeout(() => {
                if (!everPlayed) showNoStreamState();
            }, NO_STREAM_TIMEOUT);

            player.on('ready', () => {
                console.log('Player ready — source type:', streamType || 'auto-detected');
            });

            player.on('firstFrame', () => {
                clearInterval(statusTimer);
                clearTimeout(noStreamTimer);
                hideLoader();
                everPlayed = true;
                retryCount = 0;
                console.log('First frame painted');
            });

            player.on('play', () => {
                clearTimeout(noStreamTimer);
                everPlayed = true;
                hideLoader();
            });

            // Only show the full loader overlay if buffering lasts longer than
            // this many ms — avoids flashing the loader (feels like a "hang")
            // on very brief, harmless buffer blips.
            const BUFFER_SHOW_DELAY = 400;
            let bufferShowTimer = null;

            player.on('ready', () => {
                const videoEl = document.querySelector('#player video');
                if (videoEl) {
                    videoEl.addEventListener('dblclick', function(e){
                        e.preventDefault();
                        e.stopPropagation();
                    }, true);
                }
            });

            let inFullscreenTransition = false;

            player.on('buffer', () => {
                if (inFullscreenTransition) return; // skip loader flash caused by fullscreen resize
                clearTimeout(bufferShowTimer);
                bufferShowTimer = setTimeout(showLoader, BUFFER_SHOW_DELAY);
            });
            player.on('play', () => {
                clearTimeout(bufferShowTimer);
            });
            player.on('firstFrame', () => {
                clearTimeout(bufferShowTimer);
            });

            // JW fires 'fullscreen' with {fullscreen: true/false} right as the
            // transition starts. Give the resize/reflow a short grace window
            // where we won't pop the loader overlay for the expected hitch.
            player.on('fullscreen', (evt) => {
                inFullscreenTransition = true;
                clearTimeout(bufferShowTimer);
                hideLoader();
                setTimeout(() => { inFullscreenTransition = false; }, 1200);
            });

            player.on('error', handleFault);
            player.on('setupError', handleFault);

            function handleFault(err){
                console.error('Player error:', err);

                if (!everPlayed) {
                    // still inside the initial window — try again quickly, but never past NO_STREAM_TIMEOUT
                    clearTimeout(retryTimer);
                    retryTimer = setTimeout(() => {
                        player.load([ playlistItem ]);
                        player.play(true);
                    }, 900);
                    return;
                }

                // stream had already been playing (e.g. a live feed dropped) — retry with backoff
                if (retryCount < maxRetries) {
                    retryCount++;
                    statusEl.textContent = 'RECONNECTING (' + retryCount + '/' + maxRetries + ')';
                    showLoader();
                    clearTimeout(retryTimer);
                    retryTimer = setTimeout(() => {
                        player.load([ playlistItem ]);
                        player.play(true);
                    }, Math.min(1000 * retryCount, 4000));
                    return;
                }

                showNoStreamState(err);
            }

            function showNoStreamState(err){
                clearTimeout(retryTimer);
                clearTimeout(noStreamTimer);
                showState(
                    '<div class="state-content">' +
                        '<div class="glyph"><i>&#10060;</i></div>' +
                        '<p class="title">No streaming — this link won\'t play</p>' +
                        '<p class="sub">' + ((err && err.message) ? err.message : 'The source could not be reached.') + '</p>' +
                        '<button class="retry-btn" onclick="location.reload()">Retry</button>' +
                        brandBlock() +
                    '</div>'
                );
            }
        }
    </script>

</body>
</html>
