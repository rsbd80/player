<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<meta name="referrer" content="no-referrer">

<title>Shaka Player</title>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">


<style>

/* =========================
   RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;

  font-family:
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

  -webkit-user-select:none;
  user-select:none;

  -webkit-touch-callout:none;
}


/* =========================
   PLAYER
========================= */

#player{
  position:fixed;
  inset:0;

  width:100%;
  height:100%;

  background:#000;

  touch-action:manipulation;
}


video{
  width:100%;
  height:100%;

  object-fit:fill; /* Default fill for full screen like */

  background:#000;

  will-change:transform;
}


/* Fit */

video.mode-fit{
  object-fit:contain;
}


/* Fill */

video.mode-fill{
  object-fit:fill;
}


/* Zoom */

video.mode-zoom{
  object-fit:cover;
}


/* =========================
   LOADING - CLEAN VERSION
========================= */

#loading{
  position:fixed;
  inset:0;

  z-index:9999;

  display:flex;

  align-items:center;
  justify-content:center;

  flex-direction:column;

  gap:12px;

  background:#000;
}

/* Simple dot loader */
.dot-loader {
  display: flex;
  gap: 8px;
  align-items: center;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #ef4444;
  animation: dot-bounce 1.4s infinite ease-in-out both;
}

.dot:nth-child(1) {
  animation-delay: -0.32s;
}

.dot:nth-child(2) {
  animation-delay: -0.16s;
}

@keyframes dot-bounce {
  0%, 80%, 100% { 
    transform: scale(0);
    opacity: 0.3;
  }
  40% { 
    transform: scale(1);
    opacity: 1;
  }
}

#loadingText {
  color: #999;
  font-size: 13px;
  letter-spacing: 0.5px;
  font-weight: 300;
}


/* =========================
   ERROR
========================= */

#error{

  position:fixed;

  inset:0;

  z-index:10000;

  display:none;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  gap:12px;

  padding:25px;

  background:#080808;

  color:#fff;

  text-align:center;

}


#error h2{

  font-size:18px;

  font-weight:600;

}


#error p{

  max-width:600px;

  color:#999;

  font-size:13px;

  line-height:1.6;

  word-break:break-word;

}


#retry{

  margin-top:8px;

  padding:10px 22px;

  border:0;

  border-radius:7px;

  background:#ef4444;

  color:#fff;

  font-size:13px;

  cursor:pointer;

}


/* =========================
   FIT BUTTON - REMOVED
========================= */

.sp-fit-btn {
  display: none !important;
}


/* =========================
   PIP BUTTON - REMOVED
========================= */

.sp-pip-btn {
  display: none !important;
}


/* =========================
   SHAKA - KEEP BOTH BUTTONS
========================= */

.shaka-controls-container
.shaka-controls-button-panel
button{

  color:#fff!important;

}


.shaka-controls-container
.shaka-play-button{

  color:#ef4444!important;

}


.shaka-controls-container
.shaka-mute-button{

  color:#ef4444!important;

}


.shaka-controls-container
.shaka-fullscreen-button{

  color:#fff!important;
  display: flex !important; /* Fullscreen button visible */

}


.shaka-controls-container
.shaka-overflow-menu-button{

  color:#fff!important;
  display: flex !important; /* Settings button visible */

}


.shaka-controls-container
.shaka-seek-bar
.shaka-seek-bar-played{

  background:#ef4444!important;

}


.shaka-controls-container
.shaka-seek-bar
.shaka-seek-bar-buffered{

  background:#7f1d1d!important;

}


.shaka-video-container{

  background:#000!important;

}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

  .fit-ratio{

    font-size:9px;

  }

  .sp-fit-btn{

    padding:
      0 5px!important;

    min-width:42px;

  }

}


/* Hide Shaka loading spinner */
.shaka-loading-spinner {
  display: none !important;
}

/* Hide Shaka controls initially */
.shaka-controls-container {
  opacity: 0 !important;
  transition: opacity 0.3s ease;
}

.shaka-controls-container.visible {
  opacity: 1 !important;
}

/* Hide quality and pip from overflow menu */
.shaka-overflow-menu button[data-shaka-item="quality"],
.shaka-overflow-menu button[data-shaka-item="picture_in_picture"] {
  display: none !important;
}

/* Hide quality from main controls */
.shaka-quality-button {
  display: none !important;
}

/* Hide PiP from main controls */
.shaka-pip-button {
  display: none !important;
}

</style>

</head>


<body>


<!-- =========================
     LOADING - CLEAN
========================= -->

<div id="loading">

  <div class="dot-loader">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <div id="loadingText">
    Loading...
  </div>

</div>


<!-- =========================
     ERROR
========================= -->

<div id="error">

  <h2>
    Unable to play stream
  </h2>

  <p id="errorText"></p>

  <button id="retry">
    Retry
  </button>

</div>


<!-- =========================
     PLAYER
========================= -->

<div id="player">

  <video
    id="video"
    playsinline
    webkit-playsinline
    preload="auto"
    autoplay>
  </video>

</div>


<!-- =========================
     SHAKA
========================= -->

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.compiled.js">
</script>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js">
</script>


<script>

(function(){

"use strict";


/* =========================
   ELEMENTS
========================= */

const video =
  document.getElementById("video");

const playerContainer =
  document.getElementById("player");

const loading =
  document.getElementById("loading");

const loadingText =
  document.getElementById("loadingText");

const errorBox =
  document.getElementById("error");

const errorText =
  document.getElementById("errorText");

const retryButton =
  document.getElementById("retry");


let player = null;

let streamURL = null;

let reconnectTimer = null;


/* =========================
   GET URL
========================= */

function getStreamURL(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  let url =
    params.get("url");

  if(!url){
    return null;
  }

  try{

    return decodeURIComponent(url);

  }catch(e){

    return url;

  }

}


/* =========================
   UI
========================= */

function showLoading(text){

  loadingText.textContent =
    text || "Loading...";

  loading.style.display =
    "flex";

  errorBox.style.display =
    "none";

  // Hide controls when loading
  const controls = document.querySelector('.shaka-controls-container');
  if (controls) {
    controls.classList.remove('visible');
  }

}


function hideLoading(){

  loading.style.display =
    "none";

  // Show controls after loading with slight delay
  setTimeout(() => {
    const controls = document.querySelector('.shaka-controls-container');
    if (controls) {
      controls.classList.add('visible');
    }
  }, 100);

}


function showError(message){

  hideLoading();

  errorText.textContent =
    message;

  errorBox.style.display =
    "flex";

}


function hideError(){

  errorBox.style.display =
    "none";

}


/* =========================
   STREAM TYPE
========================= */

function isM3U8(url){

  return /\.m3u8($|[?#])/i
    .test(url);

}


function isMPD(url){

  return /\.mpd($|[?#])/i
    .test(url);

}


/* =========================
   SHAKA PLAYER
========================= */

async function startShaka(url){

  showLoading(
    "Loading..."
  );


  shaka.polyfill.installAll();


  if(
    !shaka.Player.isBrowserSupported()
  ){

    throw new Error(
      "Shaka Player is not supported by this browser."
    );

  }


  player =
    new shaka.Player();


  await player.attach(
    video
  );


  /* -------------------------
     UI - KEEP BOTH BUTTONS
  ------------------------- */

  // Create overlay
  const overlay = new shaka.ui.Overlay(
    player,
    playerContainer,
    video
  );

  overlay.configure({

    controlPanelElements:[

      "play_pause",

      "mute",

      "volume",

      "time_and_duration",

      "spacer",

      "overflow_menu",     // Settings button

      "fullscreen"         // Fullscreen button

    ],


    overflowMenuButtons:[

      "loop",

      "playback_rate"

    ],


    seekBarColors:{

      base:"#777",

      buffered:"#7f1d1d",

      played:"#ef4444"

    }

  });

  // Hide controls initially
  const controls = document.querySelector('.shaka-controls-container');
  if (controls) {
    controls.classList.remove('visible');
  }


  /* -------------------------
     Config
  ------------------------- */

  player.configure({

    streaming:{

      lowLatencyMode:false,

      bufferingGoal:10,

      rebufferingGoal:2,

      bufferBehind:30,

      safeSeekOffset:4,

      stallEnabled:true,

      stallThreshold:2,

      retryParameters:{

        maxAttempts:5,

        baseDelay:500,

        backoffFactor:2,

        fuzzFactor:.5,

        timeout:30000

      }

    },


    manifest:{

      ignoreTextStreamFailures:true,

      retryParameters:{

        maxAttempts:5,

        baseDelay:500,

        backoffFactor:2,

        fuzzFactor:.5,

        timeout:30000

      }

    },


    abr:{

      enabled:true,

      defaultBandwidthEstimate:2000000,

      switchInterval:4

    }

  });


  /* -------------------------
     Shaka Errors
  ------------------------- */

  player.addEventListener(
    "error",
    function(event){

      console.error(
        "Shaka error:",
        event.detail
      );

    }
  );


  /* -------------------------
     LOAD
  ------------------------- */

  await player.load(
    url
  );


  // Hide loading and show video
  hideLoading();


  // Force autoplay after load
  try {
    await video.play();
  } catch (e) {
    console.warn("Autoplay blocked, waiting for user interaction");
  }

  // Show controls after video starts playing
  video.addEventListener('playing', function onPlaying() {
    const controls = document.querySelector('.shaka-controls-container');
    if (controls) {
      controls.classList.add('visible');
    }
    video.removeEventListener('playing', onPlaying);
  });

}


/* =========================
   NATIVE HLS
========================= */

async function startNativeHLS(url){

  showLoading(
    "Loading..."
  );


  video.controls =
    true;


  video.src =
    url;


  return new Promise(
    function(resolve,reject){

      function success(){

        hideLoading();

        video.play().catch(
          function(){}
        );

        resolve();

      }


      function failed(){

        reject(
          new Error(
            "Native HLS playback failed."
          )
        );

      }


      video.addEventListener(
        "loadedmetadata",
        success,
        {once:true}
      );


      video.addEventListener(
        "error",
        failed,
        {once:true}
      );

    }
  );

}


/* =========================
   DESTROY
========================= */

async function destroyPlayer(){

  if(player){

    try{

      await player.destroy();

    }catch(error){

      console.warn(
        error
      );

    }

    player =
      null;

  }


  video.pause();

  video.removeAttribute(
    "src"
  );


  try{

    video.load();

  }catch(error){}

  // Reset controls visibility
  const controls = document.querySelector('.shaka-controls-container');
  if (controls) {
    controls.classList.remove('visible');
  }

}


/* =========================
   START PLAYER
========================= */

async function startPlayer(){

  hideError();

  showLoading(
    "Loading..."
  );


  const url =
    getStreamURL();


  if(!url){

    showError(
      "No stream URL was provided.\n\n" +
      "Example:\n" +
      "?url=https://example.com/live/index.m3u8"
    );

    return;

  }


  streamURL =
    url;


  console.log(
    "Stream:",
    streamURL
  );


  await destroyPlayer();


  /*
   * M3U8
   */

  if(isM3U8(url)){

    try{

      /*
       * First Shaka
       */

      await startShaka(
        url
      );

      return;

    }catch(error){

      console.warn(
        "Shaka HLS failed:",
        error
      );


      await destroyPlayer();


      /*
       * Native HLS fallback
       */

      if(
        video.canPlayType(
          "application/vnd.apple.mpegurl"
        )
      ){

        try{

          await startNativeHLS(
            url
          );

          return;

        }catch(nativeError){

          console.warn(
            nativeError
          );

        }

      }


      showError(
        "M3U8 stream could not be played.\n\n" +
        "Possible reasons:\n" +
        "• CORS restriction\n" +
        "• Stream is offline\n" +
        "• Authentication/token required\n" +
        "• Playlist or segments unavailable"
      );


      return;

    }

  }


  /*
   * MPD
   */

  if(isMPD(url)){

    try{

      await startShaka(
        url
      );

      return;

    }catch(error){

      console.error(
        error
      );


      showError(
        "MPD/DASH playback failed.\n\n" +
        (
          error.message
          ||
          "Unknown error"
        )
      );


      return;

    }

  }


  /*
   * Unknown format
   */

  try{

    await startShaka(
      url
    );

  }catch(error){

    console.error(
      error
    );


    showError(
      "Unable to play this stream.\n\n" +
      (
        error.message
        ||
        "Unknown error"
      )
    );

  }

}


/* =========================
   RETRY
========================= */

retryButton.addEventListener(
  "click",
  function(){

    startPlayer();

  }
);


/* =========================
   BUFFER RECOVERY
========================= */

video.addEventListener(
  "waiting",
  function(){

    console.log(
      "Buffering..."
    );

    // Show loading indicator while buffering
    showLoading("Buffering...");

  }
);


video.addEventListener(
  "playing",
  function(){

    hideLoading();

  }
);


/* =========================
   VISIBILITY
========================= */

document.addEventListener(
  "visibilitychange",
  function(){

    if(!document.hidden){

      setTimeout(
        function(){

          if(
            video.paused &&
            streamURL
          ){

            video.play().catch(
              function(){}
            );

          }

        },
        500
      );

    }

  }
);


/* =========================
   START
========================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    startPlayer();

  }
);


})();

</script>

</body>
</html>
