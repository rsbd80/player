<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
    <title>RS Player - Full Cover</title>

    <script src="https://content.jwplatform.com/libraries/IDzF9Zmk.js"></script>
    <script>
        jwplayer.key="Khpp2dHxlBJHC8MCmLnBuV2jK/DwDnJMniwF6EO9HC/riJ712ZmbHg==";
    </script>

    <style>
        * { 
            margin:0; 
            padding:0; 
            box-sizing:border-box; 
        }
        html,body { 
            width:100%; 
            height:100%; 
            background:#000; 
            overflow:hidden; 
            position:fixed;
        }
        #player { 
            width:100%; 
            height:100%; 
            position: absolute; 
            top:0; 
            left:0; 
        }
        
        /* ============================================================
           ভিডিও পুরো স্ক্রিন কাভার - কোনো ফাঁকা জায়গা থাকবে না
           ============================================================ */
        .jw-video.jw-reset {
            object-fit: cover !important;
            width: 100% !important;
            height: 100% !important;
        }
        
        .jw-media, .jw-media video, .jw-preview {
            width: 100% !important;
            height: 100% !important;
        }
        
        .jwplayer.jw-flag-fullscreen {
            width: 100vw !important;
            height: 100vh !important;
        }
        
        .jwplayer.jw-flag-fullscreen .jw-media video {
            object-fit: cover !important;
            width: 100% !important;
            height: 100% !important;
        }
        
        .jwplayer.jw-flag-fullscreen .jw-media {
            width: 100% !important;
            height: 100% !important;
        }
        
        /* ক্যামেরা কাটআউট */
        @supports (padding: env(safe-area-inset-top)) {
            .jwplayer.jw-flag-fullscreen {
                padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left) !important;
            }
        }
        
        /* লোডার */
        #loader {
            position:fixed; 
            top:0; 
            left:0; 
            width:100%; 
            height:100%;
            background:#000; 
            display:flex; 
            justify-content:center; 
            align-items:center;
            z-index:9999; 
            flex-direction:column;
            transition: opacity 0.3s ease;
        }
        #loader.hide {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width:50px; 
            height:50px; 
            border:4px solid rgba(255,255,255,.1);
            border-top:4px solid #00c3ff; 
            border-radius:50%;
            animation:spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform:rotate(360deg); } }
        #loader p { 
            margin-top:15px; 
            color:#fff; 
            font-family: sans-serif; 
            font-size:14px; 
        }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <p id="status-text">Loading...</p>
</div>

<div id="player"></div>

<script>
    function getStreamUrl() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('url');
    }

    const streamSource = getStreamUrl();

    if (streamSource) {
        const player = jwplayer("player");

        player.setup({
            playlist: [{
                file: streamSource,
                type: "hls"
            }],
            width: "100%",
            height: "100%",
            autostart: true,
            mute: false,
            stretching: "exactfit",  // exactfit = পুরো স্ক্রিন কাভার
            controls: true,
            preload: "auto",
            playbackRateControls: [0.5, 0.75, 1, 1.25, 1.5, 2],
            defaultPlaybackRate: 1,
            aspectratio: "16:9",
            fullscreen: {
                allow: true,
                on: false,
                orientation: "auto"
            },
            displaytitle: false,
            displaydescription: false
        });

        let loaderHidden = false;
        
        function hideLoader() {
            if (!loaderHidden) {
                const loader = document.getElementById('loader');
                loader.classList.add('hide');
                loaderHidden = true;
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 400);
            }
        }

        player.on("ready", function() {
            hideLoader();
            player.setMute(false);
            player.setVolume(100);
            
            // ভিডিও পুরো স্ক্রিন কাভার ফোর্স
            setTimeout(() => {
                const videoElement = document.querySelector('.jw-video');
                if (videoElement) {
                    videoElement.style.objectFit = 'cover';
                    videoElement.style.width = '100%';
                    videoElement.style.height = '100%';
                }
            }, 100);
        });

        player.on("play", function() {
            hideLoader();
            if(player.getMute()) {
                player.setMute(false);
            }
        });

        // ফুলস্ক্রিনে পুরো স্ক্রিন কাভার নিশ্চিত
        player.on("fullscreen", function(event) {
            setTimeout(() => {
                const videoElement = document.querySelector('.jw-video');
                if (videoElement) {
                    videoElement.style.objectFit = 'cover';
                    videoElement.style.width = '100%';
                    videoElement.style.height = '100%';
                }
                
                const mediaElements = document.querySelectorAll('.jw-media, .jw-media video');
                mediaElements.forEach(el => {
                    el.style.width = '100%';
                    el.style.height = '100%';
                });
            }, 100);
        });

        player.on("loaded", function() {
            hideLoader();
        });

        player.on("bufferChange", function(event) {
            if (event.bufferPercent === 100) {
                hideLoader();
            }
        });

        player.on("error", function(error) {
            document.getElementById("status-text").innerText = "Stream Failed!";
            console.log("JW Player Error:", error);
        });

        // কিবোর্ড শর্টকাট
        document.addEventListener('keydown', function(e) {
            if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey) {
                e.preventDefault();
                player.setFullscreen(true);
            }
            if (e.key === ' ' && e.target === document.body) {
                e.preventDefault();
                if (player.getState() === 'playing') {
                    player.pause();
                } else {
                    player.play();
                }
            }
        });

        console.log('RS Player Loaded - Full Cover Mode');

    } else {
        document.getElementById("status-text").innerText = "No URL Provided!";
    }
</script>

</body>
</html>
