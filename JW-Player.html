<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>PWlr Player - Rotate Fullscreen</title>
    
    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            position: fixed;
        }
        
        #player-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        
        #player-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.4s ease;
        }
        
        #player {
            width: 100% !important;
            height: 100% !important;
            background: #000;
        }
        
        /* ============================================================
           রোটেশন স্টাইল
           ============================================================ */
        .rotated-90 {
            transform: rotate(90deg) scale(1.5) !important;
            transform-origin: center center !important;
        }
        
        .rotated-180 {
            transform: rotate(180deg) !important;
            transform-origin: center center !important;
        }
        
        .rotated-270 {
            transform: rotate(270deg) scale(1.5) !important;
            transform-origin: center center !important;
        }
        
        /* ফুলস্ক্রিন রোটেশন */
        .plyr--fullscreen #player-container.rotated-90 {
            transform: rotate(90deg) scale(1.8) !important;
            transform-origin: center center !important;
            width: 100vh !important;
            height: 100vw !important;
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            margin: -50vw 0 0 -50vh !important;
        }
        
        .plyr--fullscreen #player-container.rotated-270 {
            transform: rotate(270deg) scale(1.8) !important;
            transform-origin: center center !important;
            width: 100vh !important;
            height: 100vw !important;
            position: absolute !important;
            top: 50% !important;
            left: 50% !important;
            margin: -50vw 0 0 -50vh !important;
        }
        
        /* ============================================================
           PLYR স্টাইল (JW স্টাইল)
           ============================================================ */
        .plyr {
            width: 100% !important;
            height: 100% !important;
            max-width: none !important;
            border-radius: 0 !important;
            background: #000 !important;
        }
        
        .plyr__video-wrapper {
            width: 100% !important;
            height: 100% !important;
            background: #000 !important;
        }
        
        .plyr__video-wrapper video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            background: #000 !important;
        }
        
        .plyr--fullscreen .plyr__video-wrapper video {
            object-fit: cover !important;
            width: 100% !important;
            height: 100% !important;
        }
        
        /* বড় কন্ট্রোল (JW স্টাইল) */
        .plyr__controls {
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.85)) !important;
            padding: 25px 20px 20px 20px !important;
            gap: 10px !important;
            border: none !important;
        }
        
        .plyr__controls .plyr__control {
            background: rgba(255, 255, 255, 0.08) !important;
            border-radius: 8px !important;
            padding: 12px 18px !important;
            min-width: 48px !important;
            min-height: 48px !important;
        }
        
        .plyr__controls .plyr__control svg {
            fill: #fff !important;
            width: 22px !important;
            height: 22px !important;
        }
        
        .plyr__control--overlaid {
            background: rgba(0, 195, 255, 0.85) !important;
            border: 3px solid rgba(255, 255, 255, 0.3) !important;
            width: 80px !important;
            height: 80px !important;
            border-radius: 50% !important;
        }
        
        .plyr__control--overlaid svg {
            width: 35px !important;
            height: 35px !important;
        }
        
        .plyr__progress {
            height: 8px !important;
            background: rgba(255, 255, 255, 0.2) !important;
            border-radius: 10px !important;
        }
        
        .plyr__progress__played {
            background: linear-gradient(90deg, #00c3ff, #0099ff) !important;
            border-radius: 10px !important;
        }
        
        .plyr__time {
            color: rgba(255, 255, 255, 0.9) !important;
            font-size: 16px !important;
            font-weight: 500 !important;
        }
        
        /* রোটেশন ইন্ডিকেটর */
        .rotate-indicator {
            position: absolute;
            bottom: 80px;
            right: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 22px;
            cursor: pointer;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        
        .rotate-indicator.active {
            border-color: #00c3ff;
            background: rgba(0, 195, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 195, 255, 0.3);
        }
        
        /* JW লোগো */
        .jw-logo {
            position: absolute;
            top: 20px;
            right: 25px;
            color: rgba(255, 255, 255, 0.15);
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }
        
        /* লোডার */
        #loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99;
            flex-direction: column;
            transition: opacity 0.4s ease;
        }
        
        .loader-container {
            position: relative;
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .loader-brand { text-align: center; z-index: 10; }
        .tv-icon { font-size: 24px; color: #00c3ff; text-shadow: 0 0 10px #00c3ff; }
        .brand-name { font-size: 10px; font-weight: 700; color: #fff; text-transform: uppercase; margin-top: 5px; letter-spacing: 1px; }
        .brand-name span { color: #00c3ff; }
        
        .neon-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid transparent;
            animation: rotate-vortex 1.5s linear infinite;
        }
        .neon-ring:nth-child(1) { border-top: 2px solid #00c3ff; border-right: 2px solid #00c3ff; box-shadow: 0 0 10px #00c3ff; }
        .neon-ring:nth-child(2) { border-bottom: 2px solid #ff007f; border-left: 2px solid #ff007f; animation-direction: reverse; animation-duration: 2s; box-shadow: 0 0 10px #ff007f; }
        @keyframes rotate-vortex { 100% { transform: rotate(360deg); } }
        .loading-text { color: rgba(255, 255, 255, 0.6); font-size: 10px; margin-top: 15px; letter-spacing: 2px; text-transform: uppercase; }
        .hide-now { opacity: 0 !important; visibility: hidden !important; }
        .error-content { text-align: center; color: #fff; z-index: 100; }
        .error-content i { font-size: 40px; color: #ff4d4d; margin-bottom: 15px; }
        
        @media (max-width: 768px) {
            .plyr__controls { padding: 15px 10px 10px 10px !important; gap: 5px !important; }
            .plyr__controls .plyr__control { padding: 8px 10px !important; min-width: 38px !important; min-height: 38px !important; }
            .plyr__controls .plyr__control svg { width: 18px !important; height: 18px !important; }
            .plyr__control--overlaid { width: 60px !important; height: 60px !important; }
            .plyr__control--overlaid svg { width: 28px !important; height: 28px !important; }
            .plyr__time { font-size: 13px !important; }
            .plyr__progress { height: 6px !important; }
            .rotate-indicator { width: 44px; height: 44px; font-size: 18px; bottom: 70px; right: 10px; display: flex !important; }
        }
    </style>
</head>
<body>

<div id="player-wrapper">
    <div class="jw-logo">▶ JW STYLE</div>
    
    <div id="loader">
        <div class="loader-container">
            <div class="neon-ring"></div>
            <div class="neon-ring"></div>
            <div class="loader-brand">
                <i class="fas fa-tv tv-icon"></i>
                <div class="brand-name">RS LIVE <span>TV</span></div>
            </div>
        </div>
        <div class="loading-text">BUFFERING...</div>
    </div>
    
    <div id="player-container">
        <video id="player" playsinline crossorigin>
            <source src="" type="application/vnd.apple.mpegurl" />
        </video>
    </div>
    
    <!-- রোটেশন বাটন (শুধু মোবাইলে দেখাবে) -->
    <button class="rotate-indicator" id="rotateBtn" title="Rotate Video">
        🔄
    </button>
</div>

<!-- Plyr JS -->
<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js"></script>

<script>
    (function() {
        const urlParams = new URLSearchParams(window.location.search);
        const videoSrc = urlParams.get('url');
        
        const video = document.getElementById('player');
        const container = document.getElementById('player-container');
        const loader = document.getElementById('loader');
        const rotateBtn = document.getElementById('rotateBtn');
        
        if (!videoSrc) {
            loader.innerHTML = '<div class="brand-name">No Stream URL Found</div>';
            return;
        }
        
        const source = video.querySelector('source');
        source.src = videoSrc;
        video.load();
        
        // Plyr প্লেয়ার
        const player = new Plyr(video, {
            controls: [
                'play-large', 'play', 'progress', 'current-time', 
                'mute', 'volume', 'captions', 'settings', 'pip', 
                'airplay', 'fullscreen'
            ],
            settings: ['quality', 'speed'],
            speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] },
            autoplay: true,
            muted: false
        });
        
        // HLS
        if (Hls.isSupported()) {
            const hls = new Hls({ enableWorker: true, lowLatencyMode: true, backbufferLength: 30 });
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(function(e) { console.log('Auto-play prevented:', e); });
            });
            
            hls.on(Hls.Events.ERROR, function(event, data) {
                if (data.fatal) {
                    loader.classList.remove('hide-now');
                    loader.innerHTML = `
                        <div class="error-content">
                            <i class="fas fa-exclamation-triangle"></i>
                            <p>Stream Offline!</p>
                            <div class="brand-name">RS LIVE <span>TV</span></div>
                        </div>
                    `;
                }
            });
        }
        
        // ============================================================
        // রোটেশন ফিচার - JW স্টাইল
        // ============================================================
        let isRotated = false;
        
        function toggleRotation() {
            container.classList.remove('rotated-90', 'rotated-180', 'rotated-270');
            
            if (!isRotated) {
                container.classList.add('rotated-90');
                isRotated = true;
                rotateBtn.classList.add('active');
                rotateBtn.textContent = '↺';
            } else {
                isRotated = false;
                rotateBtn.classList.remove('active');
                rotateBtn.textContent = '🔄';
            }
        }
        
        rotateBtn.addEventListener('click', toggleRotation);
        
        // ফুলস্ক্রিনে গেলে রোটেশন অটো অ্যাক্টিভেট
        player.on('fullscreen', function() {
            if (player.fullscreen.active) {
                // মোবাইল চেক
                const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
                if (isMobile && !isRotated) {
                    toggleRotation();
                }
                rotateBtn.style.display = 'flex';
            } else {
                rotateBtn.style.display = 'none';
                if (isRotated) {
                    toggleRotation();
                }
            }
        });
        
        // ভিডিও ইভেন্ট
        video.addEventListener('playing', function() {
            loader.classList.add('hide-now');
        });
        
        video.addEventListener('waiting', function() {
            loader.classList.remove('hide-now');
        });
        
        video.addEventListener('canplay', function() {
            loader.classList.add('hide-now');
        });
        
        video.addEventListener('loadedmetadata', function() {
            video.play().catch(function(e) {
                console.log('Auto-play prevented:', e);
                document.addEventListener('click', function playOnClick() {
                    video.play();
                    document.removeEventListener('click', playOnClick);
                }, { once: true });
            });
        });
        
        // কিবোর্ড
        document.addEventListener('keydown', function(e) {
            if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey) {
                e.preventDefault();
                player.fullscreen.toggle();
            }
            if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                toggleRotation();
            }
            if (e.key === ' ' && e.target === document.body) {
                e.preventDefault();
                player.togglePlay();
            }
        });
        
        console.log('🎬 PWlr প্লেয়ার লোড হয়েছে! (রোটেশন + ফুলস্ক্রিন)');
        console.log('📱 ফিচার: F=ফুলস্ক্রিন, R=রোটেট');
    })();
</script>

</body>
</html>
