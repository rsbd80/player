<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>JW Player - Fullscreen</title>

    <!-- JW Player Library -->
    <script src="https://content.jwplatform.com/libraries/IDzF9Zmk.js"></script>
    <script>
        // JW Player API Key
        jwplayer.key="Khpp2dHxlBJHC8MCmLnBuV2jK/DwDnJMniwF6EO9HC/riJ712ZmbHg==";
    </script>

    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            position: fixed;
        }
        #player-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        #player {
            width: 100% !important;
            height: 100% !important;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* JW Player Fullscreen Default Behavior */
        .jw-skin-glow .jw-display-icon-container {
            background: rgba(255, 255, 255, 0.1) !important;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .jw-skin-glow .jw-button-color { color: #ffffff !important; }
        .jw-skin-glow .jw-controlbar {
            background: transparent !important;
        }

        /* Video Fit - Fullscreen */
        .jw-video.jw-reset {
            object-fit: contain !important;
            width: 100% !important;
            height: 100% !important;
        }

        /* Loader Style */
        #loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99;
            flex-direction: column;
            transition: opacity 0.4s ease;
        }
        .loader-container {
            position: relative;
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .loader-brand { text-align: center; z-index: 10; }
        .tv-icon { font-size: 24px; color: #00c3ff; text-shadow: 0 0 10px #00c3ff; }
        .brand-name { font-size: 10px; font-weight: 700; color: #fff; text-transform: uppercase; margin-top: 5px; letter-spacing: 1px; }
        .brand-name span { color: #00c3ff; }

        .neon-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid transparent;
            animation: rotate-vortex 1.5s linear infinite;
        }
        .neon-ring:nth-child(1) { border-top: 2px solid #00c3ff; border-right: 2px solid #00c3ff; box-shadow: 0 0 10px #00c3ff; }
        .neon-ring:nth-child(2) { border-bottom: 2px solid #ff007f; border-left: 2px solid #ff007f; animation-direction: reverse; animation-duration: 2s; box-shadow: 0 0 10px #ff007f; }
        @keyframes rotate-vortex { 100% { transform: rotate(360deg); } }
        .loading-text { color: rgba(255, 255, 255, 0.6); font-size: 10px; margin-top: 15px; letter-spacing: 2px; text-transform: uppercase; }
        .hide-now { opacity: 0 !important; visibility: hidden !important; }
        .error-content { text-align: center; color: #fff; z-index: 100; }
        .error-content i { font-size: 40px; color: #ff4d4d; margin-bottom: 15px; }
    </style>
</head>
<body>

<div id="player-wrapper">
    <!-- Loader -->
    <div id="loader">
        <div class="loader-container">
            <div class="neon-ring"></div>
            <div class="neon-ring"></div>
            <div class="loader-brand">
                <i class="fas fa-tv tv-icon"></i>
                <div class="brand-name">RS LIVE <span>TV</span></div>
            </div>
        </div>
        <div class="loading-text">BUFFERING...</div>
    </div>
    <!-- JW Player -->
    <div id="player"></div>
</div>

<script>
    (function() {
        const urlParams = new URLSearchParams(window.location.search);
        const streamSource = urlParams.get('url');
        const loader = document.getElementById('loader');

        if (!streamSource) {
            loader.innerHTML = '<div class="brand-name">No Stream URL Found</div>';
            return;
        }

        // JW Player Setup
        const player = jwplayer("player").setup({
            playlist: [{ file: streamSource, type: "hls" }],
            width: "100%",
            height: "100%",
            autostart: true,
            stretching: "exactfit",   // Video will fill the screen
            skin: { name: "glow" },
            displaytitle: false,
            controls: true,
            fullscreen: {
                allow: true,          // Fullscreen button enabled
                on: true              // Start fullscreen if possible
            }
        });

        // Events
        player.on("ready", function() {
            player.setMute(false);
            player.setVolume(100);
        });

        player.on("play", function() {
            loader.classList.add("hide-now");
        });

        player.on("buffer", function() {
            loader.classList.remove("hide-now");
        });

        // Fullscreen event - JW Player handles orientation and UI automatically
        player.on("fullscreen", function(event) {
            console.log("Fullscreen State:", event.fullscreen);
            // JW Player automatically handles:
            // 1. Screen orientation change to landscape
            // 2. System UI hiding (status bar, navigation)
            // 3. Video resizing
        });

        player.on("error", function() {
            loader.classList.remove("hide-now");
            loader.innerHTML = `
                <div class="error-content">
                    <i class="fas fa-exclamation-triangle"></i>
                    <p>Stream Offline!</p>
                    <div class="brand-name">RS LIVE <span>TV</span></div>
                </div>
            `;
        });

        console.log("🎬 JW Player loaded! Fullscreen works as expected.");
    })();
</script>

</body>
</html>
