<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
    <title>RS Player - Fixed</title>

    <!-- HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js"></script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html,body { 
            width:100%; 
            height:100%; 
            background:#000; 
            overflow:hidden; 
            position:fixed;
            font-family: 'Segoe UI', sans-serif;
        }
        
        #player-wrapper {
            width: 100%;
            height: 100%;
            background: #000;
            position: relative;
        }
        
        #player {
            width: 100%;
            height: 100%;
            background: #000;
            display: block;
            object-fit: contain;
        }
        
        /* লোডার */
        #loader {
            position:fixed; 
            top:0; 
            left:0; 
            width:100%; 
            height:100%;
            background:#000; 
            display:flex; 
            justify-content:center; 
            align-items:center;
            z-index:9999; 
            flex-direction:column;
            transition: opacity 0.3s ease;
        }
        #loader.hide { 
            opacity:0; 
            pointer-events:none; 
        }
        .spinner {
            width:50px; 
            height:50px; 
            border:4px solid rgba(255,255,255,.1);
            border-top:4px solid #00c3ff; 
            border-radius:50%;
            animation:spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform:rotate(360deg); } }
        #loader p { 
            margin-top:15px; 
            color:#fff; 
            font-family:sans-serif; 
            font-size:14px; 
        }
        
        /* কাস্টম কন্ট্রোল */
        .custom-controls {
            position: absolute;
            bottom: 20px;
            left: 10px;
            right: 10px;
            padding: 12px 15px;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
            flex-wrap: wrap;
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 10px;
        }
        
        #player-wrapper:hover .custom-controls,
        #player-wrapper.touch .custom-controls {
            opacity: 1;
        }
        
        .custom-controls button {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            transition: all 0.2s ease;
            min-width: 36px;
            min-height: 36px;
        }
        
        .custom-controls button:hover {
            background: rgba(255,255,255,0.2);
        }
        
        .custom-controls input[type="range"] {
            flex: 1;
            min-width: 60px;
            height: 4px;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            outline: none;
        }
        
        .custom-controls input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: #00c3ff;
            border-radius: 50%;
            cursor: pointer;
        }
        
        .time-display {
            color: rgba(255,255,255,0.8);
            font-size: 12px;
            min-width: 90px;
            text-align: center;
        }
        
        .volume-control {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .volume-control input[type="range"] {
            width: 50px;
        }
        
        @media (max-width: 768px) {
            .custom-controls {
                bottom: 10px;
                padding: 8px 10px;
                gap: 6px;
            }
            .custom-controls button {
                font-size: 14px;
                padding: 4px 8px;
                min-width: 30px;
                min-height: 30px;
            }
            .time-display {
                font-size: 10px;
                min-width: 60px;
            }
            .volume-control input[type="range"] {
                width: 35px;
            }
        }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <p id="status-text">Loading Stream...</p>
</div>

<div id="player-wrapper">
    <video id="player" playsinline crossorigin></video>
    
    <!-- কন্ট্রোল -->
    <div class="custom-controls" id="controls">
        <button id="playBtn">▶</button>
        <button id="rewindBtn">⏪</button>
        <button id="forwardBtn">⏩</button>
        <input type="range" id="progressBar" value="0" step="0.01">
        <span class="time-display" id="timeDisplay">00:00 / 00:00</span>
        <div class="volume-control">
            <button id="muteBtn">🔊</button>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.8">
        </div>
        <button id="fullscreenBtn">⛶</button>
    </div>
</div>

<script>
    (function() {
        const urlParams = new URLSearchParams(window.location.search);
        const streamSource = urlParams.get('url');
        
        const video = document.getElementById('player');
        const loader = document.getElementById('loader');
        const statusText = document.getElementById('status-text');
        
        // কন্ট্রোল এলিমেন্ট
        const playBtn = document.getElementById('playBtn');
        const rewindBtn = document.getElementById('rewindBtn');
        const forwardBtn = document.getElementById('forwardBtn');
        const progressBar = document.getElementById('progressBar');
        const timeDisplay = document.getElementById('timeDisplay');
        const muteBtn = document.getElementById('muteBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        
        if (!streamSource) {
            statusText.textContent = 'No URL Provided!';
            loader.classList.add('hide');
            return;
        }

        // ============================================================
        // HLS লোড ফাংশন
        // ============================================================
        let hls = null;
        let isPlaying = false;

        function loadHLS() {
            // আগের HLS ইনস্ট্যান্স ক্লিয়ার
            if (hls) {
                hls.destroy();
                hls = null;
            }

            statusText.textContent = 'Loading Stream...';

            if (Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backbufferLength: 30,
                    xhrSetup: function(xhr, url) {
                        xhr.withCredentials = false;
                    }
                });

                hls.loadSource(streamSource);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    statusText.textContent = 'Playing...';
                    video.play().catch(function(e) {
                        console.log('Play prevented:', e);
                        statusText.textContent = 'Click to play';
                        // ক্লিক করলে প্লে হবে
                        document.addEventListener('click', function playOnClick() {
                            video.play();
                            document.removeEventListener('click', playOnClick);
                        }, { once: true });
                    });
                });

                hls.on(Hls.Events.LEVEL_LOADED, function() {
                    loader.classList.add('hide');
                });

                hls.on(Hls.Events.ERROR, function(event, data) {
                    console.log('HLS Error:', data);
                    
                    if (data.fatal) {
                        statusText.textContent = 'Retrying...';
                        setTimeout(() => {
                            try {
                                if (hls) {
                                    hls.loadSource(streamSource);
                                }
                            } catch(e) {
                                console.log('Reload failed:', e);
                                statusText.textContent = 'Stream Failed!';
                            }
                        }, 2000);
                    }
                });

                // সাফল্যের সাথে লোড হলে লোডার লুকান
                hls.on(Hls.Events.FRAG_LOADED, function() {
                    loader.classList.add('hide');
                });

            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Safari (Mac/iOS)
                video.src = streamSource;
                video.addEventListener('loadedmetadata', function() {
                    loader.classList.add('hide');
                    video.play().catch(function(e) {
                        console.log('Play prevented:', e);
                    });
                });
            } else {
                statusText.textContent = 'HLS not supported!';
            }
        }

        // ============================================================
        // ভিডিও ইভেন্ট
        // ============================================================
        video.addEventListener('play', function() {
            playBtn.textContent = '⏸';
            isPlaying = true;
            loader.classList.add('hide');
        });

        video.addEventListener('pause', function() {
            playBtn.textContent = '▶';
            isPlaying = false;
        });

        video.addEventListener('timeupdate', function() {
            if (video.duration) {
                const percent = (video.currentTime / video.duration) * 100;
                progressBar.value = percent;
                
                const current = formatTime(video.currentTime);
                const duration = formatTime(video.duration);
                timeDisplay.textContent = `${current} / ${duration}`;
            }
        });

        video.addEventListener('loadedmetadata', function() {
            loader.classList.add('hide');
            if (video.duration) {
                timeDisplay.textContent = `00:00 / ${formatTime(video.duration)}`;
            }
        });

        video.addEventListener('waiting', function() {
            statusText.textContent = 'Buffering...';
            loader.classList.remove('hide');
        });

        video.addEventListener('canplay', function() {
            loader.classList.add('hide');
        });

        video.addEventListener('playing', function() {
            loader.classList.add('hide');
        });

        video.addEventListener('error', function(e) {
            console.log('Video Error:', e);
            statusText.textContent = 'Video Error!';
            // রিলোড চেষ্টা
            setTimeout(() => {
                loadHLS();
            }, 3000);
        });

        // ============================================================
        // হেল্পার ফাংশন
        // ============================================================
        function formatTime(seconds) {
            if (isNaN(seconds) || !isFinite(seconds)) return '00:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        // ============================================================
        // কন্ট্রোল ইভেন্ট
        // ============================================================
        function togglePlay() {
            if (video.paused) {
                video.play().catch(function(e) {
                    console.log('Play prevented:', e);
                });
            } else {
                video.pause();
            }
        }

        playBtn.addEventListener('click', togglePlay);
        video.addEventListener('click', togglePlay);

        rewindBtn.addEventListener('click', function() {
            video.currentTime = Math.max(0, (video.currentTime || 0) - 10);
        });

        forwardBtn.addEventListener('click', function() {
            video.currentTime = Math.min(video.duration || 0, (video.currentTime || 0) + 10);
        });

        progressBar.addEventListener('input', function() {
            if (video.duration) {
                video.currentTime = (this.value / 100) * video.duration;
            }
        });

        volumeSlider.addEventListener('input', function() {
            video.volume = parseFloat(this.value);
            video.muted = false;
            muteBtn.textContent = video.volume > 0 ? '🔊' : '🔇';
        });

        muteBtn.addEventListener('click', function() {
            video.muted = !video.muted;
            muteBtn.textContent = video.muted ? '🔇' : '🔊';
            if (!video.muted) {
                volumeSlider.value = video.volume || 0.8;
            } else {
                volumeSlider.value = 0;
            }
        });

        fullscreenBtn.addEventListener('click', function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen?.() || 
                document.documentElement.webkitRequestFullscreen?.();
            } else {
                document.exitFullscreen?.() || 
                document.webkitExitFullscreen?.();
            }
        });

        // ============================================================
        // কিবোর্ড শর্টকাট
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey) {
                e.preventDefault();
                fullscreenBtn.click();
            }
            if (e.key === ' ' && e.target === document.body) {
                e.preventDefault();
                togglePlay();
            }
            if (e.key === 'ArrowRight' && !e.ctrlKey) {
                e.preventDefault();
                video.currentTime = Math.min(video.duration || 0, (video.currentTime || 0) + 10);
            }
            if (e.key === 'ArrowLeft' && !e.ctrlKey) {
                e.preventDefault();
                video.currentTime = Math.max(0, (video.currentTime || 0) - 10);
            }
        });

        // ============================================================
        // টাচ সাপোর্ট - কন্ট্রোল দেখানোর জন্য
        // ============================================================
        document.getElementById('player-wrapper').addEventListener('touchstart', function() {
            this.classList.add('touch');
            setTimeout(() => {
                this.classList.remove('touch');
            }, 3000);
        });

        // ============================================================
        // স্ট্রিম লোড শুরু
        // ============================================================
        loadHLS();

        // ভলিউম ডিফল্ট
        video.volume = 0.8;
        volumeSlider.value = 0.8;

        console.log('RS Player Loaded!');
        console.log('Stream:', streamSource);
        console.log('Controls: Space=Play/Pause, F=Fullscreen, Arrow=Seek');

    })();
</script>

</body>
</html>
