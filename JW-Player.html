<!DOCTYPE html>
<html>
<head>
    <title>Mobile Rotation Player</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.6.2/dist/plyr.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body { 
            background: #000; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden;
            width: 100vw;
        }
        
        #player-container {
            width: 100%;
            max-width: 800px;
            position: relative;
            transition: all 0.3s ease;
            background: #000;
        }
        
        #player { 
            width: 100%; 
            height: auto;
            display: block;
            aspect-ratio: 16/9;
            background: #000;
        }
        
        /* ফুলস্ক্রিন রোটেশন - মোবাইল ফিক্স */
        .fullscreen-rotated {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            z-index: 9999 !important;
            background: #000 !important;
            transform: none !important;
        }
        
        .fullscreen-rotated #player {
            width: 100% !important;
            height: 100% !important;
            aspect-ratio: auto !important;
            object-fit: contain !important;
        }
        
        /* রোটেটেড অবস্থা */
        .rotated-90 {
            transform: rotate(90deg) scale(1.5) !important;
            transform-origin: center center !important;
        }
        
        .rotated-180 {
            transform: rotate(180deg) scale(1.2) !important;
            transform-origin: center center !important;
        }
        
        .rotated-270 {
            transform: rotate(270deg) scale(1.5) !important;
            transform-origin: center center !important;
        }
        
        /* মোবাইল ডিভাইসের জন্য বিশেষ */
        @media (max-width: 768px) {
            #player-container {
                max-width: 100%;
            }
            
            .fullscreen-rotated.rotated-90 {
                transform: rotate(90deg) scale(1.8) !important;
            }
            
            .fullscreen-rotated.rotated-270 {
                transform: rotate(270deg) scale(1.8) !important;
            }
            
            .plyr__controls {
                padding: 10px 5px;
                flex-wrap: wrap;
            }
            .plyr__control {
                padding: 8px;
                min-width: 36px;
            }
            .plyr__progress {
                min-width: 60px;
            }
        }
        
        /* ফুলস্ক্রিন কন্ট্রোল */
        .plyr--fullscreen .plyr__video-wrapper {
            width: 100% !important;
            height: 100% !important;
            background: #000 !important;
        }
        
        .plyr--fullscreen .plyr__video-wrapper video {
            object-fit: contain !important;
            width: 100% !important;
            height: 100% !important;
        }
        
        /* কাস্টম রোটেশন বাটন */
        .plyr__control--rotate {
            position: relative;
            transition: all 0.3s ease;
        }
        .plyr__control--rotate.active {
            color: #00b3ff !important;
            background: rgba(0, 179, 255, 0.2) !important;
            border-radius: 50%;
        }
    </style>
</head>
<body>

<div id="player-container">
    <video id="player" controls crossorigin playsinline autoplay>
        <source type="application/vnd.apple.mpegurl" src="">
    </video>
</div>

<script src="https://cdn.jsdelivr.net/npm/plyr@3.6.12/dist/plyr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.4/dist/hls.min.js"></script>

<script>
    // URL থেকে url প্যারামিটার
    const urlParams = new URLSearchParams(window.location.search);
    const videoSrc = urlParams.get('url');
    
    const video = document.getElementById('player');
    const source = video.querySelector('source');
    const container = document.getElementById('player-container');
    
    if (videoSrc) {
        source.src = videoSrc;
    }

    document.addEventListener("DOMContentLoaded", () => {
        // প্লেয়ার ইনিশিয়ালাইজ
        const player = new Plyr(video, {
            autoplay: true,
            controls: [
                'play-large', 'play', 'progress', 'current-time', 'mute', 
                'volume', 'captions', 'settings', 'pip', 'airplay', 
                'fullscreen'
            ]
        });

        let isRotated = false;
        let isFullscreen = false;

        // HLS সাপোর্ট
        if (Hls.isSupported() && videoSrc) {
            const hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                backbufferLength: 30
            });
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(function(error) {
                    console.log('Auto-play prevented:', error);
                });
            });
        }

        // ফুলস্ক্রিন বাটন কাস্টমাইজ
        const fullscreenBtn = document.querySelector('[data-plyr="fullscreen"]');
        
        if (fullscreenBtn) {
            // ডিফল্ট ফুলস্ক্রিন ইভেন্ট ওভাররাইড
            fullscreenBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                e.preventDefault();
                
                // মোবাইল চেক
                const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
                
                if (isMobile) {
                    // মোবাইলে রোটেশন + ফুলস্ক্রিন
                    toggleMobileFullscreen();
                } else {
                    // ডেস্কটপে নরমাল ফুলস্ক্রিন
                    player.fullscreen.toggle();
                }
            });
        }

        // মোবাইল ফুলস্ক্রিন টগল
        function toggleMobileFullscreen() {
            if (!isFullscreen) {
                // ফুলস্ক্রিনে যাও
                enterMobileFullscreen();
            } else {
                // ফুলস্ক্রিন থেকে বের
                exitMobileFullscreen();
            }
        }

        function enterMobileFullscreen() {
            isFullscreen = true;
            
            // কন্টেইনার ফুলস্ক্রিন করুন
            container.classList.add('fullscreen-rotated');
            
            // রোটেট করুন
            container.classList.add('rotated-90');
            isRotated = true;
            
            // ভিডিও পুরো স্ক্রিন ফিট
            video.style.objectFit = 'contain';
            video.style.width = '100%';
            video.style.height = '100%';
            
            // স্ক্রিন লক (পোর্ট্রেট)
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('portrait').catch(function() {});
            }
            
            // ফুলস্ক্রিন বাটন আপডেট
            fullscreenBtn.classList.add('active');
            fullscreenBtn.innerHTML = '⛶';
            
            // কন্ট্রোল দেখান
            document.querySelector('.plyr__controls').style.opacity = '1';
        }

        function exitMobileFullscreen() {
            isFullscreen = false;
            isRotated = false;
            
            // কন্টেইনার রিসেট
            container.classList.remove('fullscreen-rotated', 'rotated-90', 'rotated-180', 'rotated-270');
            
            // ভিডিও রিসেট
            video.style.objectFit = '';
            video.style.width = '';
            video.style.height = '';
            
            // স্ক্রিন আনলক
            if (screen.orientation && screen.orientation.unlock) {
                screen.orientation.unlock();
            }
            
            // ফুলস্ক্রিন বাটন আপডেট
            fullscreenBtn.classList.remove('active');
            
            // কন্ট্রোল দেখান
            document.querySelector('.plyr__controls').style.opacity = '1';
        }

        // ফুলস্ক্রিন চেঞ্জ ইভেন্ট (ডেস্কটপের জন্য)
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                // ডেস্কটপ ফুলস্ক্রিন থেকে বের হলে
                if (!isFullscreen) {
                    container.classList.remove('fullscreen-rotated', 'rotated-90');
                    video.style.objectFit = '';
                    video.style.width = '';
                    video.style.height = '';
                }
            }
        });

        // ব্যাক বাটন প্রেস করলে ফুলস্ক্রিন থেকে বের
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isFullscreen) {
                exitMobileFullscreen();
            }
        });

        // অটোপ্লে
        video.addEventListener('loadedmetadata', function() {
            video.play().catch(function(error) {
                console.log('Auto-play prevented:', error);
                document.addEventListener('click', function playOnClick() {
                    video.play();
                    document.removeEventListener('click', playOnClick);
                }, { once: true });
            });
        });

        // কিবোর্ড শর্টকাট
        document.addEventListener('keydown', (e) => {
            if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey) {
                e.preventDefault();
                if (fullscreenBtn) {
                    fullscreenBtn.click();
                }
            }
        });

        console.log('🎬 মোবাইল রোটেশন প্লেয়ার লোড হয়েছে!');
    });
</script>

</body>
</html>
