               user-scalable=no, viewport-fit=cover">

<title>RS Player Pro</title>

<style>
:root{
    --bg-1:#0a0a12;
    --bg-2:#14101f;
    --grad-a:#22d3ee;
    --grad-b:#a78bfa;
    --grad-c:#fb923c;
    --warn:#ffb84d;
    --alert:#ff5d5d;
    --text:#eef0f7;
    --text-dim:#7a7a92;
    --font:'Poppins','Segoe UI',sans-serif;
    --mono:'JetBrains Mono','Courier New',monospace;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:var(--font);
}

/* ================= PLAYER ================= */

#player-wrapper{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

/*
   Custom fullscreen mode.
   এটি browser-এর Fullscreen API ব্যবহার করে না।
   তাই Android-এর "To exit full screen..." system message
   ট্রিগার করার সম্ভাবনা থাকে না।
*/
#player-wrapper.custom-fullscreen{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    height:100dvh;
    z-index:999999;
    background:#000;
}

#player{
    position:absolute;
    inset:0;
    width:100% !important;
    height:100% !important;
}

#player video{
    width:100% !important;
    height:100% !important;
    touch-action:manipulation;
    object-fit:contain !important;
}

/* JW native fullscreen button hide */
.jw-icon-fullscreen{
    display:none !important;
}

/* Control bar */
.jw-skin-glow .jw-display-icon-container{
    background:rgba(167,139,250,.10) !important;
    border:1px solid rgba(167,139,250,.4);
    backdrop-filter:none !important;
}

.jw-skin-glow .jw-button-color{
    color:#fff !important;
}

.jw-skin-glow .jw-controlbar{
    background:linear-gradient(
        0deg,
        rgba(0,0,0,.78),
        transparent
    ) !important;
}

.jw-skin-glow .jw-slider-time .jw-progress{
    background:var(--grad-b) !important;
}

.jw-skin-glow .jw-knob{
    background:var(--grad-b) !important;
}

/* ================= CUSTOM FULLSCREEN BUTTON ================= */

#customFullscreenBtn{
    position:absolute;
    right:18px;
    bottom:54px;

    width:42px;
    height:42px;

    border:0;
    border-radius:50%;

    background:rgba(0,0,0,.65);
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:21px;
    z-index:1000;

    cursor:pointer;
    opacity:0;

    transition:
        opacity .25s ease,
        transform .15s ease;
}

#player-wrapper:hover #customFullscreenBtn,
#player-wrapper.controls-visible #customFullscreenBtn{
    opacity:1;
}

#customFullscreenBtn:active{
    transform:scale(.9);
}

#customFullscreenBtn.hidden{
    display:none;
}

/* ================= LOADER ================= */

#loader{
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            80% 60% at 50% 40%,
            var(--bg-2) 0%,
            var(--bg-1) 70%
        );

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    z-index:99;

    transition:
        opacity .5s ease,
        visibility .5s ease;
}

.tuner{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
}

.tv-wrap{
    position:relative;
    width:78px;
    height:78px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.tv-glow{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(167,139,250,.35),
            transparent 70%
        );

    animation:glow-pulse 2.4s ease-in-out infinite;
}

@keyframes glow-pulse{
    0%,100%{
        transform:scale(.85);
        opacity:.5;
    }

    50%{
        transform:scale(1.15);
        opacity:1;
    }
}

.tv-icon{
    position:relative;
    width:60px;
    height:60px;
}

.tv-icon .tv-body{
    fill:none;
    stroke:var(--text);
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.tv-icon .screen-bars rect{
    transform-origin:bottom;
    animation:bar-flicker 1.6s ease-in-out infinite;
}

.tv-icon .screen-bars rect:nth-child(1){
    fill:var(--grad-a);
    animation-delay:-1.2s;
}

.tv-icon .screen-bars rect:nth-child(2){
    fill:var(--grad-b);
    animation-delay:-.9s;
}

.tv-icon .screen-bars rect:nth-child(3){
    fill:var(--grad-c);
    animation-delay:-.6s;
}

.tv-icon .screen-bars rect:nth-child(4){
    fill:var(--grad-b);
    animation-delay:-.3s;
}

.tv-icon .screen-bars rect:nth-child(5){
    fill:var(--grad-a);
    animation-delay:0s;
}

@keyframes bar-flicker{
    0%,100%{
        transform:scaleY(.45);
        opacity:.65;
    }

    50%{
        transform:scaleY(1);
        opacity:1;
    }
}

.brand-name{
    font-size:15px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;

    background:
        linear-gradient(
            90deg,
            var(--grad-a),
            var(--grad-b)
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.brand-name b{
    color:var(--text);
    -webkit-text-fill-color:var(--text);
}

.dots{
    display:flex;
    gap:6px;
}

.dots span{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--grad-b);

    animation:
        dot-pulse 1.2s ease-in-out infinite;
}

.dots span:nth-child(1){
    animation-delay:0s;
}

.dots span:nth-child(2){
    animation-delay:.2s;
}

.dots span:nth-child(3){
    animation-delay:.4s;
}

@keyframes dot-pulse{
    0%,80%,100%{
        transform:scale(.6);
        opacity:.35;
    }

    40%{
        transform:scale(1);
        opacity:1;
    }
}

.status-line{
    font-family:var(--mono);
    font-size:9.5px;
    letter-spacing:2.5px;
    color:var(--text-dim);
    text-transform:uppercase;
}

.hide-now{
    opacity:0 !important;
    visibility:hidden !important;
}

/* ================= ERROR ================= */

.state-content{
    text-align:center;
    color:var(--text);
    z-index:100;
    padding:0 24px;
}

.state-content .glyph{
    font-size:34px;
    color:var(--alert);
    margin-bottom:14px;
}

.state-content .glyph.warn{
    color:var(--warn);
}

.state-content p.title{
    font-size:13px;
    letter-spacing:1px;
    font-weight:600;
}

.state-content p.sub{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--text-dim);
    margin-top:8px;
    letter-spacing:.5px;
    max-width:280px;
}

.state-content .brand-name{
    display:block;
    margin-top:18px;
}

.retry-btn{
    margin-top:16px;
    padding:8px 20px;

    font-family:var(--font);
    font-weight:600;
    font-size:11px;
    letter-spacing:.5px;

    color:#0a0a12;

    background:
        linear-gradient(
            90deg,
            var(--grad-a),
            var(--grad-b)
        );

    border:none;
    border-radius:18px;

    cursor:pointer;
}

.retry-btn:active{
    transform:scale(.96);
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    #customFullscreenBtn{
        right:12px;
        bottom:48px;
        width:40px;
        height:40px;
    }
}

/* ================= TV / REMOTE ================= */

@media(min-width:1000px){

    #customFullscreenBtn{
        width:46px;
        height:46px;
        font-size:23px;
        right:20px;
        bottom:60px;
    }
}
</style>
</head>

<body>

<div id="player-wrapper">

    <div id="loader">

        <div class="tuner">

            <div class="tv-wrap">

                <div class="tv-glow"></div>

                <svg
                    class="tv-icon"
                    viewBox="0 0 64 64"
                    xmlns="http://www.w3.org/2000/svg">

                    <path
                        class="tv-body"
                        d="M22 12 32 20 42 12"/>

                    <clipPath id="screenClip">
                        <rect
                            x="12"
                            y="20"
                            width="40"
                            height="26"
                            rx="4"/>
                    </clipPath>

                    <g
                        class="screen-bars"
                        clip-path="url(#screenClip)">

                        <rect x="12" y="20" width="8" height="26"/>
                        <rect x="20" y="20" width="8" height="26"/>
                        <rect x="28" y="20" width="8" height="26"/>
                        <rect x="36" y="20" width="8" height="26"/>
                        <rect x="44" y="20" width="8" height="26"/>

                    </g>

                    <rect
                        class="tv-body"
                        x="12"
                        y="20"
                        width="40"
                        height="26"
                        rx="4"/>

                    <line
                        class="tv-body"
                        x1="24"
                        y1="46"
                        x2="24"
                        y2="50"/>

                    <line
                        class="tv-body"
                        x1="40"
                        y1="46"
                        x2="40"
                        y2="50"/>

                    <line
                        class="tv-body"
                        x1="20"
                        y1="50"
                        x2="44"
                        y2="50"/>

                </svg>

            </div>

            <div class="brand-name">
                <b>RS LIVE</b> TV
            </div>

            <div class="dots">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <div
                class="status-line"
                id="status-line">
                LOADING
            </div>

        </div>

    </div>

    <div id="player"></div>

    <!-- Custom fullscreen -->
    <button
        id="customFullscreenBtn"
        type="button"
        aria-label="Fullscreen">
        ⛶
    </button>

</div>


<script>

const urlParams =
    new URLSearchParams(window.location.search);

const streamSource =
    urlParams.get('url');

const forcedType =
    (urlParams.get('type') || '').toLowerCase();

const startMuted =
    urlParams.get('mute') === '1';


const loaderEl =
    document.getElementById('loader');

const statusEl =
    document.getElementById('status-line');

const wrapper =
    document.getElementById('player-wrapper');

const fullscreenBtn =
    document.getElementById('customFullscreenBtn');


/* ================= LOADER ================= */

const statusMessages = [
    'LOADING',
    'BUFFERING',
    'CONNECTING'
];

let statusIdx = 0;

let statusTimer =
    setInterval(() => {

        statusIdx =
            (statusIdx + 1) %
            statusMessages.length;

        statusEl.textContent =
            statusMessages[statusIdx];

    },1800);


function showLoader(){

    loaderEl.classList.remove(
        'hide-now'
    );

}


function hideLoader(){

    loaderEl.classList.add(
        'hide-now'
    );

}


function showState(html){

    clearInterval(statusTimer);

    showLoader();

    loaderEl.innerHTML = html;

}


function brandBlock(){

    return `
        <div class="brand-name">
            <b>RS LIVE</b> TV
        </div>
    `;

}


/* ================= STREAM TYPE ================= */

function detectType(raw){

    if(forcedType)
        return forcedType;

    const clean =
        raw
        .split('?')[0]
        .split('#')[0]
        .toLowerCase();

    if(clean.endsWith('.m3u8'))
        return 'hls';

    if(clean.endsWith('.mpd'))
        return 'dash';

    if(clean.endsWith('.mp4'))
        return 'mp4';

    if(clean.endsWith('.webm'))
        return 'webm';

    if(clean.endsWith('.mov'))
        return 'mp4';

    if(
        clean.endsWith('.ogg') ||
        clean.endsWith('.ogv')
    )
        return 'ogg';

    if(raw.includes('.m3u8'))
        return 'hls';

    if(raw.includes('.mpd'))
        return 'dash';

    return null;
}


/* ================= CUSTOM FULLSCREEN ================= */

/*
  এখানে Fullscreen API ব্যবহার করা হচ্ছে না।

  তাই:
  document.documentElement.requestFullscreen()
  অথবা
  wrapper.requestFullscreen()

  কোনোটাই ব্যবহার করা হয়নি।

  এর ফলে Android-এর native fullscreen
  instruction toast আসবে না।
*/

let customFullscreen = false;


function enterCustomFullscreen(){

    customFullscreen = true;

    wrapper.classList.add(
        'custom-fullscreen'
    );

    fullscreenBtn.textContent = '⛶';

    /*
      Android ফোন হলে landscape করার চেষ্টা।
      সব browser এই permission দেয় না,
      তাই fail হলেও player চলবে।
    */

    try{

        if(
            screen.orientation &&
            screen.orientation.lock
        ){

            screen.orientation
                .lock('landscape')
                .catch(()=>{});

        }

    }catch(e){}

}


function exitCustomFullscreen(){

    customFullscreen = false;

    wrapper.classList.remove(
        'custom-fullscreen'
    );

    fullscreenBtn.textContent = '⛶';

    try{

        if(
            screen.orientation &&
            screen.orientation.unlock
        ){

            screen.orientation.unlock();

        }

    }catch(e){}

}


function toggleCustomFullscreen(){

    if(customFullscreen){

        exitCustomFullscreen();

    }else{

        enterCustomFullscreen();

    }

}


fullscreenBtn.addEventListener(
    'click',
    toggleCustomFullscreen
);


/* ================= ANDROID BACK ================= */

/*
  Custom fullscreen থাকলে Android Back চাপলে
  আগে fullscreen থেকে বের হবে।
*/

window.addEventListener(
    'popstate',
    () => {

        if(customFullscreen){

            exitCustomFullscreen();

        }

    }
);


/*
  কিছু Android browser-এ Back event সরাসরি
  ধরা যায় না। তাই fullscreen চালু হলে history
  state তৈরি করা হচ্ছে।
*/

function addFullscreenHistory(){

    if(
        !history.state ||
        !history.state.rsFullscreen
    ){

        history.pushState(
            {rsFullscreen:true},
            ''
        );

    }

}


function enterCustomFullscreen(){

    customFullscreen = true;

    wrapper.classList.add(
        'custom-fullscreen'
    );

    fullscreenBtn.textContent = '⛶';

    addFullscreenHistory();

    try{

        if(
            screen.orientation &&
            screen.orientation.lock
        ){

            screen.orientation
                .lock('landscape')
                .catch(()=>{});

        }

    }catch(e){}

}


/* ================= NO URL ================= */

if(!streamSource){

    showState(

        '<div class="state-content">' +

            '<div class="glyph warn">' +
                '<i>&#9888;</i>' +
            '</div>' +

            '<p class="title">' +
                'No stream URL supplied' +
            '</p>' +

            '<p class="sub">' +
                'Add ?url=YOUR_STREAM_LINK to this page address.' +
            '</p>' +

            brandBlock() +

        '</div>'

    );

}else{

    const streamType =
        detectType(streamSource);

    const playlistItem = {
        file:streamSource
    };

    if(streamType){

        playlistItem.type =
            streamType;

    }


    /* ================= JW PLAYER ================= */

    const player =
        jwplayer('player').setup({

            playlist:[
                playlistItem
            ],

            width:'100%',
            height:'100%',

            autostart:true,

            mute:startMuted,

            preload:'auto',

            stretching:'uniform',

            liveTimeout:0,

            skin:{
                name:'glow'
            },

            displaytitle:false,

            /*
              Native fullscreen বন্ধ।
              Custom fullscreen ব্যবহার হবে।
            */
            fullscreen:false

        });


    let retryCount = 0;

    const maxRetries = 6;

    let retryTimer = null;

    let everPlayed = false;

    const NO_STREAM_TIMEOUT = 10000;

    let noStreamTimer =
        setTimeout(() => {

            if(!everPlayed){

                showNoStreamState();

            }

        },NO_STREAM_TIMEOUT);


    player.on(
        'ready',
        () => {

            console.log(
                'RS Player ready:',
                streamType || 'auto'
            );

            const videoEl =
                document.querySelector(
                    '#player video'
                );

            if(videoEl){

                videoEl.addEventListener(
                    'dblclick',
                    function(e){

                        e.preventDefault();
                        e.stopPropagation();

                    },
                    true
                );

            }

        }
    );


    player.on(
        'firstFrame',
        () => {

            clearInterval(statusTimer);

            clearTimeout(
                noStreamTimer
            );

            hideLoader();

            everPlayed = true;

            retryCount = 0;

        }
    );


    player.on(
        'play',
        () => {

            clearTimeout(
                noStreamTimer
            );

            everPlayed = true;

            hideLoader();

        }
    );


    /* ================= BUFFER ================= */

    const BUFFER_SHOW_DELAY = 400;

    let bufferShowTimer = null;


    player.on(
        'buffer',
        () => {

            clearTimeout(
                bufferShowTimer
            );

            bufferShowTimer =
                setTimeout(
                    showLoader,
                    BUFFER_SHOW_DELAY
                );

        }
    );


    player.on(
        'play',
        () => {

            clearTimeout(
                bufferShowTimer
            );

        }
    );


    player.on(
        'firstFrame',
        () => {

            clearTimeout(
                bufferShowTimer
            );

        }
    );


    /* ================= ERROR / RECONNECT ================= */

    player.on(
        'error',
        handleFault
    );

    player.on(
        'setupError',
        handleFault
    );


    function handleFault(err){

        console.error(
            'Player error:',
            err
        );


        /* প্রথমবার চালু না হলে */

        if(!everPlayed){

            clearTimeout(
                retryTimer
            );

            retryTimer =
                setTimeout(
                    () => {

                        try{

                            player.load([
                                playlistItem
                            ]);

                            player.play(true);

                        }catch(e){

                            console.error(e);

                        }

                    },
                    900
                );

            return;

        }


        /* চলার সময় stream drop */

        if(retryCount < maxRetries){

            retryCount++;

            statusEl.textContent =
                'RECONNECTING (' +
                retryCount +
                '/' +
                maxRetries +
                ')';

            showLoader();

            clearTimeout(
                retryTimer
            );

            retryTimer =
                setTimeout(
                    () => {

                        try{

                            player.load([
                                playlistItem
                            ]);

                            player.play(true);

                        }catch(e){

                            console.error(e);

                        }

                    },
                    Math.min(
                        1000 * retryCount,
                        4000
                    )
                );

            return;

        }


        showNoStreamState(err);

    }


    /* ================= ERROR SCREEN ================= */

    function showNoStreamState(err){

        clearTimeout(
            retryTimer
        );

        clearTimeout(
            noStreamTimer
        );

        showState(

            '<div class="state-content">' +

                '<div class="glyph">' +
                    '<i>&#10060;</i>' +
                '</div>' +

                '<p class="title">' +
                    'No streaming — this link won\'t play' +
                '</p>' +

                '<p class="sub">' +
                    (
                        err &&
                        err.message
                    )
                    ?
                    err.message
                    :
                    'The source could not be reached.'
                +
                '</p>' +

                '<button ' +
                    'class="retry-btn" ' +
                    'onclick="location.reload()">' +
                    'Retry' +
                '</button>' +

                brandBlock() +

            '</div>'

        );

    }

}


/* ================= KEYBOARD / TV REMOTE ================= */

document.addEventListener(
    'keydown',
    function(e){

        /*
          Escape
        */

        if(
            e.key === 'Escape' &&
            customFullscreen
        ){

            e.preventDefault();

            exitCustomFullscreen();

            return;

        }

        /*
          F11
        */

        if(e.key === 'F11'){

            e.preventDefault();

            toggleCustomFullscreen();

        }

    }
);


/* ================= TOUCH ================= */

let touchStartX = 0;
let touchStartY = 0;


wrapper.addEventListener(
    'touchstart',
    function(e){

        if(!e.touches.length)
            return;

        touchStartX =
            e.touches[0].clientX;

        touchStartY =
            e.touches[0].clientY;

    },
    {passive:true}
);


wrapper.addEventListener(
    'touchend',
    function(e){

        if(!e.changedTouches.length)
            return;

        const x =
            e.changedTouches[0].clientX;

        const y =
            e.changedTouches[0].clientY;

        const dx =
            x - touchStartX;

        const dy =
            y - touchStartY;

        /*
          নিচ থেকে swipe করলে fullscreen থেকে বের
        */

        if(
            customFullscreen &&
            dy > 100 &&
            Math.abs(dy) > Math.abs(dx)
        ){

            exitCustomFullscreen();

        }

    },
    {passive:true}
);

</script>

</body>
