<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<meta name="referrer" content="no-referrer">

<title>Shaka Player</title>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">


<style>

/* =========================
   RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;

  font-family:
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

  -webkit-user-select:none;
  user-select:none;

  -webkit-touch-callout:none;
}


/* =========================
   PLAYER
========================= */

#player{
  position:fixed;
  inset:0;

  width:100%;
  height:100%;

  background:#000;

  touch-action:manipulation;
}


video{
  width:100%;
  height:100%;

  object-fit:fill; /* Default fill for full screen like */

  background:#000;

  will-change:transform;
}


/* Fit */

video.mode-fit{
  object-fit:contain;
}


/* Fill */

video.mode-fill{
  object-fit:fill;
}


/* Zoom */

video.mode-zoom{
  object-fit:cover;
}


/* =========================
   LOADING - CLEAN VERSION
========================= */

#loading{
  position:fixed;
  inset:0;

  z-index:9999;

  display:flex;

  align-items:center;
  justify-content:center;

  flex-direction:column;

  gap:12px;

  background:#000;
}

/* Simple dot loader */
.dot-loader {
  display: flex;
  gap: 8px;
  align-items: center;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #ef4444;
  animation: dot-bounce 1.4s infinite ease-in-out both;
}

.dot:nth-child(1) {
  animation-delay: -0.32s;
}

.dot:nth-child(2) {
  animation-delay: -0.16s;
}

@keyframes dot-bounce {
  0%, 80%, 100% { 
    transform: scale(0);
    opacity: 0.3;
  }
  40% { 
    transform: scale(1);
    opacity: 1;
  }
}

#loadingText {
  color: #999;
  font-size: 13px;
  letter-spacing: 0.5px;
  font-weight: 300;
}


/* =========================
   ERROR
========================= */

#error{

  position:fixed;

  inset:0;

  z-index:10000;

  display:none;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  gap:12px;

  padding:25px;

  background:#080808;

  color:#fff;

  text-align:center;

}


#error h2{

  font-size:18px;

  font-weight:600;

}


#error p{

  max-width:600px;

  color:#999;

  font-size:13px;

  line-height:1.6;

  word-break:break-word;

}


#retry{

  margin-top:8px;

  padding:10px 22px;

  border:0;

  border-radius:7px;

  background:#ef4444;

  color:#fff;

  font-size:13px;

  cursor:pointer;

}


/* =========================
   CUSTOM FIT BUTTON
========================= */

.sp-fit-btn{

  background:transparent!important;

  border:none!important;

  color:#fff!important;

  cursor:pointer!important;

  padding:0 7px!important;

  margin:0!important;

  height:100%;

  min-width:48px;

  display:flex;

  align-items:center;

  justify-content:center;

  gap:4px;

  opacity:.85;

  transition:
    opacity .15s,
    transform .15s;

  -webkit-tap-highlight-color:
    transparent;

}


.sp-fit-btn:hover{

  opacity:1;

}


.sp-fit-btn:active{

  opacity:1;

  transform:scale(.92);

}


.sp-fit-btn:focus-visible{

  outline:
    2px solid #ef4444;

  outline-offset:2px;

  border-radius:5px;

}


.fit-icon{

  width:18px;
  height:18px;

  display:flex;

  align-items:center;
  justify-content:center;

}


.fit-icon svg{

  width:18px;
  height:18px;

  display:block;

}


.fit-ratio{

  color:#fff;

  font-size:10px;

  font-weight:600;

  line-height:1;

  white-space:nowrap;

}


/* =========================
   CUSTOM PIP BUTTON - REMOVED
========================= */

/* PiP button completely removed */
.sp-pip-btn {
  display: none !important;
}


/* =========================
   SHAKA
========================= */

.shaka-controls-container
.shaka-controls-button-panel
button{

  color:#fff!important;

}


.shaka-controls-container
.shaka-play-button{

  color:#ef4444!important;

}


.shaka-controls-container
.shaka-mute-button{

  color:#ef4444!important;

}


.shaka-controls-container
.shaka-fullscreen-button{

  color:#fff!important;

}


.shaka-controls-container
.shaka-overflow-menu-button{

  color:#fff!important;

}


.shaka-controls-container
.shaka-seek-bar
.shaka-seek-bar-played{

  background:#ef4444!important;

}


.shaka-controls-container
.shaka-seek-bar
.shaka-seek-bar-buffered{

  background:#7f1d1d!important;

}


.shaka-video-container{

  background:#000!important;

}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

  .fit-ratio{

    font-size:9px;

  }

  .sp-fit-btn{

    padding:
      0 5px!important;

    min-width:42px;

  }

}


/* Hide Shaka loading spinner */
.shaka-loading-spinner {
  display: none !important;
}

/* Hide Shaka controls initially */
.shaka-controls-container {
  opacity: 0 !important;
  transition: opacity 0.3s ease;
}

.shaka-controls-container.visible {
  opacity: 1 !important;
}

/* Hide overflow menu buttons we don't want */
.shaka-overflow-menu button[data-shaka-item="quality"],
.shaka-overflow-menu button[data-shaka-item="picture_in_picture"] {
  display: none !important;
}

/* Also hide PiP from main controls */
.shaka-pip-button {
  display: none !important;
}

/* Hide quality button from main controls */
.shaka-quality-button {
  display: none !important;
}

</style>

</head>


<body>


<!-- =========================
     LOADING - CLEAN
========================= -->

<div id="loading">

  <div class="dot-loader">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <div id="loadingText">
    Loading...
  </div>

</div>


<!-- =========================
     ERROR
========================= -->

<div id="error">

  <h2>
    Unable to play stream
  </h2>

  <p id="errorText"></p>

  <button id="retry">
    Retry
  </button>

</div>


<!-- =========================
     PLAYER
========================= -->

<div id="player">

  <video
    id="video"
    playsinline
    webkit-playsinline
    preload="auto"
    autoplay>
  </video>

</div>


<!-- =========================
     SHAKA
========================= -->

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.compiled.js">
</script>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js">
</script>


<script>

(function(){

"use strict";


/* =========================
   ELEMENTS
========================= */

const video =
  document.getElementById("video");

const playerContainer =
  document.getElementById("player");

const loading =
  document.getElementById("loading");

const loadingText =
  document.getElementById("loadingText");

const errorBox =
  document.getElementById("error");

const errorText =
  document.getElementById("errorText");

const retryButton =
  document.getElementById("retry");


let player = null;

let streamURL = null;

let fitIndex = 1; // Start with Fill mode (full screen like)

let reconnectTimer = null;

let controlsVisible = false;


/* =========================
   GET URL
========================= */

function getStreamURL(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  let url =
    params.get("url");

  if(!url){
    return null;
  }

  try{

    return decodeURIComponent(url);

  }catch(e){

    return url;

  }

}


/* =========================
   UI
========================= */

function showLoading(text){

  loadingText.textContent =
    text || "Loading...";

  loading.style.display =
    "flex";

  errorBox.style.display =
    "none";

  // Hide controls when loading
  const controls = document.querySelector('.shaka-controls-container');
  if (controls) {
    controls.classList.remove('visible');
  }

}


function hideLoading(){

  loading.style.display =
    "none";

  // Show controls after loading with slight delay
  setTimeout(() => {
    const controls = document.querySelector('.shaka-controls-container');
    if (controls) {
      controls.classList.add('visible');
    }
  }, 100);

}


function showError(message){

  hideLoading();

  errorText.textContent =
    message;

  errorBox.style.display =
    "flex";

}


function hideError(){

  errorBox.style.display =
    "none";

}


/* =========================
   STREAM TYPE
========================= */

function isM3U8(url){

  return /\.m3u8($|[?#])/i
    .test(url);

}


function isMPD(url){

  return /\.mpd($|[?#])/i
    .test(url);

}


/* =========================
   RATIO
========================= */

function getRatio(){

  const width =
    video.videoWidth;

  const height =
    video.videoHeight;

  if(!width || !height){

    return "";

  }


  const ratio =
    width / height;


  if(
    Math.abs(
      ratio - (16/9)
    ) < .03
  ){

    return "16:9";

  }


  if(
    Math.abs(
      ratio - (4/3)
    ) < .03
  ){

    return "4:3";

  }


  if(
    Math.abs(
      ratio - (21/9)
    ) < .04
  ){

    return "21:9";

  }


  if(
    Math.abs(
      ratio - 1
    ) < .03
  ){

    return "1:1";

  }


  return ratio.toFixed(2)+":1";

}


/* =========================
   FIT ICONS
========================= */

const FIT_ICONS = {

  fit:`

  <svg
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round">

    <rect
      x="2"
      y="3"
      width="20"
      height="14"
      rx="2"/>

    <line
      x1="2"
      y1="21"
      x2="22"
      y2="21"/>

  </svg>

  `,


  fill:`

  <svg
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round">

    <rect
      x="3"
      y="3"
      width="18"
      height="18"
      rx="2"/>

    <path d="M3 9h18"/>
    <path d="M3 15h18"/>
    <path d="M9 3v18"/>
    <path d="M15 3v18"/>

  </svg>

  `,


  zoom:`

  <svg
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round">

    <rect
      x="2"
      y="3"
      width="20"
      height="14"
      rx="2"/>

    <path d="M6 7l3 3"/>
    <path d="M9 10H7"/>
    <path d="M9 10V8"/>

    <path d="M18 7l-3 3"/>
    <path d="M15 10h2"/>
    <path d="M15 10V8"/>

    <path d="M6 13l3-3"/>
    <path d="M9 10H7"/>
    <path d="M9 10v2"/>

    <path d="M18 13l-3-3"/>
    <path d="M15 10h2"/>
    <path d="M15 10v2"/>

  </svg>

  `

};


/* =========================
   FIT MODES
========================= */

const FIT_MODES = [

  {
    name:"Fit",
    css:"mode-fit",
    icon:FIT_ICONS.fit
  },

  {
    name:"Fill",
    css:"mode-fill",
    icon:FIT_ICONS.fill
  },

  {
    name:"Zoom",
    css:"mode-zoom",
    icon:FIT_ICONS.zoom
  }

];


/* =========================
   ADD FIT BUTTON
========================= */

function addFitButton(){

  const panel =
    playerContainer.querySelector(
      ".shaka-controls-button-panel"
    );


  if(!panel){

    console.warn(
      "Shaka control panel not found"
    );

    return;

  }


  if(
    panel.querySelector(
      ".sp-fit-btn"
    )
  ){

    return;

  }


  const fullscreen =
    panel.querySelector(
      ".shaka-fullscreen-button"
    );


  const button =
    document.createElement(
      "button"
    );


  button.className =
    "sp-fit-btn";


  button.type =
    "button";


  button.title =
    "Video Fit: Fill";


  button.innerHTML = `

    <span class="fit-icon">
      ${FIT_ICONS.fill}
    </span>

    <span class="fit-ratio">
      --
    </span>

  `;


  if(fullscreen){

    panel.insertBefore(
      button,
      fullscreen
    );

  }else{

    panel.appendChild(
      button
    );

  }


  function applyFit(){

    const mode =
      FIT_MODES[fitIndex];


    video.classList.remove(
      "mode-fit",
      "mode-fill",
      "mode-zoom"
    );


    video.classList.add(
      mode.css
    );


    const icon =
      button.querySelector(
        ".fit-icon"
      );


    const ratio =
      button.querySelector(
        ".fit-ratio"
      );


    if(icon){

      icon.innerHTML =
        mode.icon;

    }


    if(ratio){

      const r =
        getRatio();

      ratio.textContent =
        r || "--";

    }


    button.title =
      "Video Fit: " +
      mode.name;

  }


  button.addEventListener(
    "click",
    function(event){

      event.preventDefault();

      event.stopPropagation();


      fitIndex++;

      if(
        fitIndex >=
        FIT_MODES.length
      ){

        fitIndex = 0;

      }


      applyFit();

    }
  );


  function updateRatio(){

    const ratio =
      button.querySelector(
        ".fit-ratio"
      );


    if(ratio){

      ratio.textContent =
        getRatio() || "--";

    }

  }


  video.addEventListener(
    "loadedmetadata",
    updateRatio
  );


  video.addEventListener(
    "resize",
    updateRatio
  );


  // Apply initial fill mode
  applyFit();

}


/* =========================
   SHAKA PLAYER
========================= */

async function startShaka(url){

  showLoading(
    "Loading..."
  );


  shaka.polyfill.installAll();


  if(
    !shaka.Player.isBrowserSupported()
  ){

    throw new Error(
      "Shaka Player is not supported by this browser."
    );

  }


  player =
    new shaka.Player();


  await player.attach(
    video
  );


  /* -------------------------
     UI
  ------------------------- */

  // Create overlay but keep controls hidden initially
  const overlay = new shaka.ui.Overlay(
    player,
    playerContainer,
    video
  );

  overlay.configure({

    controlPanelElements:[

      "play_pause",

      "mute",

      "volume",

      "time_and_duration",

      "spacer",

      "fullscreen",

      "overflow_menu"

    ],


    overflowMenuButtons:[

      "loop",

      "playback_rate"

    ],


    seekBarColors:{

      base:"#777",

      buffered:"#7f1d1d",

      played:"#ef4444"

    }

  });

  // Hide controls initially
  const controls = document.querySelector('.shaka-controls-container');
  if (controls) {
    controls.classList.remove('visible');
  }


  /*
   * Wait for Shaka controls
   */

  setTimeout(
    function(){

      addFitButton();

    },
    500
  );


  /* -------------------------
     Config
  ------------------------- */

  player.configure({

    streaming:{

      lowLatencyMode:false,

      bufferingGoal:10,

      rebufferingGoal:2,

      bufferBehind:30,

      safeSeekOffset:4,

      stallEnabled:true,

      stallThreshold:2,

      retryParameters:{

        maxAttempts:5,

        baseDelay:500,

        backoffFactor:2,

        fuzzFactor:.5,

        timeout:30000

      }

    },


    manifest:{

      ignoreTextStreamFailures:true,

      retryParameters:{

        maxAttempts:5,

        baseDelay:500,

        backoffFactor:2,

        fuzzFactor:.5,

        timeout:30000

      }

    },


    abr:{

      enabled:true,

      defaultBandwidthEstimate:2000000,

      switchInterval:4

    }

  });


  /* -------------------------
     Shaka Errors
  ------------------------- */

  player.addEventListener(
    "error",
    function(event){

      console.error(
        "Shaka error:",
        event.detail
      );

    }
  );


  /* -------------------------
     LOAD
  ------------------------- */

  await player.load(
    url
  );


  // Hide loading and show video
  hideLoading();


  // Force autoplay after load
  try {
    await video.play();
  } catch (e) {
    console.warn("Autoplay blocked, waiting for user interaction");
  }

  // Show controls after video starts playing
  video.addEventListener('playing', function onPlaying() {
    const controls = document.querySelector('.shaka-controls-container');
    if (controls) {
      controls.classList.add('visible');
    }
    video.removeEventListener('playing', onPlaying);
  });

}


/* =========================
   NATIVE HLS
========================= */

async function startNativeHLS(url){

  showLoading(
    "Loading..."
  );


  video.controls =
    true;


  video.src =
    url;


  return new Promise(
    function(resolve,reject){

      function success(){

        hideLoading();

        video.play().catch(
          function(){}
        );

        resolve();

      }


      function failed(){

        reject(
          new Error(
            "Native HLS playback failed."
          )
        );

      }


      video.addEventListener(
        "loadedmetadata",
        success,
        {once:true}
      );


      video.addEventListener(
        "error",
        failed,
        {once:true}
      );

    }
  );

}


/* =========================
   DESTROY
========================= */

async function destroyPlayer(){

  if(player){

    try{

      await player.destroy();

    }catch(error){

      console.warn(
        error
      );

    }

    player =
      null;

  }


  video.pause();

  video.removeAttribute(
    "src"
  );


  try{

    video.load();

  }catch(error){}

  // Reset controls visibility
  const controls = document.querySelector('.shaka-controls-container');
  if (controls) {
    controls.classList.remove('visible');
  }

}


/* =========================
   START PLAYER
========================= */

async function startPlayer(){

  hideError();

  showLoading(
    "Loading..."
  );


  const url =
    getStreamURL();


  if(!url){

    showError(
      "No stream URL was provided.\n\n" +
      "Example:\n" +
      "?url=https://example.com/live/index.m3u8"
    );

    return;

  }


  streamURL =
    url;


  console.log(
    "Stream:",
    streamURL
  );


  await destroyPlayer();


  /*
   * M3U8
   */

  if(isM3U8(url)){

    try{

      /*
       * First Shaka
       */

      await startShaka(
        url
      );

      return;

    }catch(error){

      console.warn(
        "Shaka HLS failed:",
        error
      );


      await destroyPlayer();


      /*
       * Native HLS fallback
       */

      if(
        video.canPlayType(
          "application/vnd.apple.mpegurl"
        )
      ){

        try{

          await startNativeHLS(
            url
          );

          return;

        }catch(nativeError){

          console.warn(
            nativeError
          );

        }

      }


      showError(
        "M3U8 stream could not be played.\n\n" +
        "Possible reasons:\n" +
        "• CORS restriction\n" +
        "• Stream is offline\n" +
        "• Authentication/token required\n" +
        "• Playlist or segments unavailable"
      );


      return;

    }

  }


  /*
   * MPD
   */

  if(isMPD(url)){

    try{

      await startShaka(
        url
      );

      return;

    }catch(error){

      console.error(
        error
      );


      showError(
        "MPD/DASH playback failed.\n\n" +
        (
          error.message
          ||
          "Unknown error"
        )
      );


      return;

    }

  }


  /*
   * Unknown format
   */

  try{

    await startShaka(
      url
    );

  }catch(error){

    console.error(
      error
    );


    showError(
      "Unable to play this stream.\n\n" +
      (
        error.message
        ||
        "Unknown error"
      )
    );

  }

}


/* =========================
   RETRY
========================= */

retryButton.addEventListener(
  "click",
  function(){

    startPlayer();

  }
);


/* =========================
   BUFFER RECOVERY
========================= */

video.addEventListener(
  "waiting",
  function(){

    console.log(
      "Buffering..."
    );

    // Show loading indicator while buffering
    showLoading("Buffering...");

  }
);


video.addEventListener(
  "playing",
  function(){

    hideLoading();

  }
);


/* =========================
   VISIBILITY
========================= */

document.addEventListener(
  "visibilitychange",
  function(){

    if(!document.hidden){

      setTimeout(
        function(){

          if(
            video.paused &&
            streamURL
          ){

            video.play().catch(
              function(){}
            );

          }

        },
        500
      );

    }

  }
);


/* =========================
   START
========================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    startPlayer();

  }
);


})();

</script>

</body>
</html>
