<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Player with Mobile Rotation</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.6.2/dist/plyr.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body { 
            background: #000; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden;
            width: 100vw;
        }
        
        #player-container {
            width: 100%;
            max-width: 800px;
            position: relative;
            transition: all 0.3s ease;
        }
        
        #player { 
            width: 100%; 
            height: auto;
            display: block;
        }
        
        /* সম্পূর্ণ প্লেয়ার রোটেশন - মোবাইলের জন্য */
        .rotated-90 {
            transform: rotate(90deg) scale(1.2);
            transform-origin: center center;
        }
        
        .rotated-180 {
            transform: rotate(180deg);
            transform-origin: center center;
        }
        
        .rotated-270 {
            transform: rotate(270deg) scale(1.2);
            transform-origin: center center;
        }
        
        /* ফুলস্ক্রিনে পুরো প্লেয়ার রোটেশন - মোবাইল ফিক্স */
        .plyr--fullscreen #player-container.rotated-90 {
            transform: rotate(90deg) scale(1.5) !important;
            transform-origin: center center !important;
            width: 100vh !important;
            height: 100vw !important;
            max-width: none !important;
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) rotate(90deg) scale(1.5) !important;
        }
        
        .plyr--fullscreen #player-container.rotated-270 {
            transform: rotate(270deg) scale(1.5) !important;
            transform-origin: center center !important;
            width: 100vh !important;
            height: 100vw !important;
            max-width: none !important;
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) rotate(270deg) scale(1.5) !important;
        }
        
        .plyr--fullscreen #player-container.rotated-180 {
            transform: rotate(180deg) scale(1.2);
            transform-origin: center center;
        }
        
        /* ফুলস্ক্রিনে ভিডিও পুরো স্ক্রিন ফিট */
        .plyr--fullscreen .plyr__video-wrapper {
            width: 100% !important;
            height: 100% !important;
            background: #000 !important;
        }
        
        .plyr--fullscreen .plyr__video-wrapper video {
            object-fit: cover !important;
            width: 100% !important;
            height: 100% !important;
        }
        
        /* কন্ট্রোল বাটন রোটেশন ইন্ডিকেটর */
        .plyr__control--rotate-indicator {
            position: relative;
            transition: all 0.3s ease;
        }
        .plyr__control--rotate-indicator.active {
            color: #00b3ff !important;
            background: rgba(0, 179, 255, 0.2) !important;
            border-radius: 50%;
        }
        .plyr__control--rotate-indicator.active::after {
            content: '↻';
            position: absolute;
            top: -5px;
            right: -5px;
            font-size: 12px;
            color: #00b3ff;
            animation: spin 2s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* মোবাইল ফ্রেন্ডলি */
        @media (max-width: 768px) {
            #player-container { max-width: 100%; }
            .plyr__controls { padding: 10px 5px; flex-wrap: wrap; }
            .plyr__control { padding: 8px; min-width: 36px; }
            .plyr__progress { min-width: 60px; }
            
            /* মোবাইলে ফুলস্ক্রিন রোটেশন ফিক্স */
            .plyr--fullscreen #player-container.rotated-90 {
                transform: rotate(90deg) scale(1.8) !important;
                width: 100vh !important;
                height: 100vw !important;
            }
            
            .plyr--fullscreen #player-container.rotated-270 {
                transform: rotate(270deg) scale(1.8) !important;
                width: 100vh !important;
                height: 100vw !important;
            }
        }
        
        /* পোর্ট্রেট মোডে অ্যাডজাস্ট */
        @media (orientation: portrait) and (max-width: 768px) {
            .plyr--fullscreen #player-container.rotated-90,
            .plyr--fullscreen #player-container.rotated-270 {
                transform: rotate(90deg) scale(2) !important;
            }
        }
        
        /* ল্যান্ডস্কেপ মোডে অ্যাডজাস্ট */
        @media (orientation: landscape) and (max-width: 768px) {
            .plyr--fullscreen #player-container.rotated-90,
            .plyr--fullscreen #player-container.rotated-270 {
                transform: rotate(90deg) scale(1.5) !important;
            }
        }
    </style>
</head>
<body>

<div id="player-container">
    <video id="player" controls crossorigin playsinline autoplay>
        <source type="application/vnd.apple.mpegurl" src="">
    </video>
</div>

<script src="https://cdn.jsdelivr.net/npm/plyr@3.6.12/dist/plyr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.4/dist/hls.min.js"></script>

<script>
    // URL থেকে url প্যারামিটারটি নেওয়া
    const urlParams = new URLSearchParams(window.location.search);
    const videoSrc = urlParams.get('url');
    
    const video = document.getElementById('player');
    const source = video.querySelector('source');
    const container = document.getElementById('player-container');
    
    if (videoSrc) {
        source.src = videoSrc;
    }

    document.addEventListener("DOMContentLoaded", () => {
        // Plyr প্লেয়ার ইনিশিয়ালাইজ
        const player = new Plyr(video, {
            autoplay: true,
            controls: [
                'play-large', 'play', 'progress', 'current-time', 'mute', 
                'volume', 'captions', 'settings', 'pip', 'airplay', 
                'fullscreen'
            ]
        });

        let isRotated = false;
        let rotationAngle = 0;

        // HLS সাপোর্ট
        if (Hls.isSupported() && videoSrc) {
            const hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                backbufferLength: 30
            });
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(function(error) {
                    console.log('Auto-play was prevented:', error);
                });
            });
        }

        // ফুলস্ক্রিন বাটন খুঁজে বের করা
        const fullscreenBtn = document.querySelector('[data-plyr="fullscreen"]');
        
        if (fullscreenBtn) {
            // ফুলস্ক্রিন বাটনে ক্লিক ইভেন্ট - মোবাইলের জন্য ফিক্স
            fullscreenBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                e.preventDefault();
                
                // মোবাইল ডিভাইস চেক
                const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
                
                if (isMobile) {
                    // মোবাইলে রোটেশন টগল
                    toggleRotation();
                }
                
                // ফুলস্ক্রিন টগল
                player.fullscreen.toggle();
                
                // অটোপ্লে নিশ্চিত
                setTimeout(() => {
                    if (video.paused) {
                        video.play().catch(function(error) {
                            console.log('Play prevented:', error);
                        });
                    }
                }, 100);
            });
        }

        // রোটেশন টগল ফাংশন - পুরো কন্টেইনার রোটেট হবে
        function toggleRotation() {
            // পুরানো রোটেশন ক্লাস সরান
            container.classList.remove('rotated-90', 'rotated-180', 'rotated-270');
            
            if (!isRotated) {
                // ৯০ ডিগ্রি রোটেট
                container.classList.add('rotated-90');
                rotationAngle = 90;
                isRotated = true;
                
                // ফুলস্ক্রিনে থাকলে পুরো স্ক্রিন কভার
                if (document.fullscreenElement) {
                    document.documentElement.style.overflow = 'hidden';
                    video.style.objectFit = 'cover';
                    video.style.width = '100%';
                    video.style.height = '100%';
                }
            } else {
                // নরমালে ফিরে যান
                isRotated = false;
                rotationAngle = 0;
                
                // রিসেট
                document.documentElement.style.overflow = '';
                video.style.objectFit = '';
                video.style.width = '';
                video.style.height = '';
            }
            
            // ফুলস্ক্রিন বাটনে ইন্ডিকেটর
            if (isRotated) {
                fullscreenBtn.classList.add('active');
            } else {
                fullscreenBtn.classList.remove('active');
            }
        }

        // ফুলস্ক্রিন চেঞ্জ ইভেন্ট - মোবাইলের জন্য ফিক্স
        document.addEventListener('fullscreenchange', () => {
            const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
            
            if (!document.fullscreenElement) {
                // ফুলস্ক্রিন থেকে বের হলে রিসেট
                document.documentElement.style.overflow = '';
                video.style.objectFit = '';
                video.style.width = '';
                video.style.height = '';
                
                // রোটেশন অ্যাক্টিভ থাকলে সেটা রাখুন
                if (isRotated) {
                    container.classList.add('rotated-90');
                }
            } else if (isRotated) {
                // ফুলস্ক্রিনে রোটেটেড থাকলে পুরো স্ক্রিন কভার
                document.documentElement.style.overflow = 'hidden';
                video.style.objectFit = 'cover';
                video.style.width = '100%';
                video.style.height = '100%';
                
                // মোবাইলে ভিউপোর্ট অ্যাডজাস্ট
                if (isMobile) {
                    document.documentElement.style.width = '100vh';
                    document.documentElement.style.height = '100vw';
                    document.documentElement.style.transform = 'rotate(90deg)';
                    document.documentElement.style.transformOrigin = 'center center';
                }
            }
        });

        // অটোপ্লে
        video.addEventListener('loadedmetadata', function() {
            video.play().catch(function(error) {
                console.log('Auto-play was prevented:', error);
                document.addEventListener('click', function playOnClick() {
                    video.play();
                    document.removeEventListener('click', playOnClick);
                }, { once: true });
            });
        });

        // কিবোর্ড শর্টকাট: F
        document.addEventListener('keydown', (e) => {
            if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey) {
                e.preventDefault();
                if (fullscreenBtn) {
                    fullscreenBtn.click();
                }
            }
        });

        // উইন্ডো রিসাইজে অ্যাডজাস্ট
        window.addEventListener('resize', () => {
            if (document.fullscreenElement && isRotated) {
                video.style.objectFit = 'cover';
                video.style.width = '100%';
                video.style.height = '100%';
            }
        });

        console.log('🎬 প্লেয়ার লোড হয়েছে! মোবাইলে ফুলস্ক্রিনে ক্লিক করলে ভিডিও রোটেট হবে।');
    });
</script>

</body>
</html>
