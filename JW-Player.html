<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>EM Player</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #videoFrame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
      z-index: 10;
    }

    /* Loading Screen */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid rgba(255,255,255,.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #error {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    #error h2 {
      margin-bottom: 8px;
    }

    #error button {
      margin-top: 18px;
      padding: 10px 20px;
      border: 0;
      border-radius: 6px;
      background: #fff;
      color: #000;
      cursor: pointer;
    }

    /* Refresh Button */
    .player-tools {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 50;
    }

    .refresh-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(0,0,0,.55);
      color: #fff;
      text-decoration: none;
      font-size: 23px;
      font-family: Arial, sans-serif;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .refresh-btn:active {
      transform: scale(.92);
    }

    /* Hide unnecessary elements */
    pre,
    code,
    footer {
      display: none !important;
    }
  </style>
</head>

<body>

  <!-- Loading -->
  <div id="loading">
    <div class="spinner"></div>
    <div>Loading Player...</div>
  </div>

  <!-- Error -->
  <div id="error">
    <h2>Unable to Load Player</h2>
    <p id="errorText">Invalid video URL.</p>
    <button onclick="location.reload()">Retry</button>
  </div>

  <!-- Player -->
  <iframe
    id="videoFrame"
    allow="autoplay; fullscreen; picture-in-picture"
    allowfullscreen
    referrerpolicy="no-referrer">
  </iframe>

  <!-- Tools -->
  <div class="player-tools">
    <a
      href="javascript:location.reload();"
      class="refresh-btn"
      title="Refresh Player">
      ↻
    </a>
  </div>

  <script>
    /*
     * Allowed Embed Domain
     * আপনার Blogger domain এখানে রাখুন
     */
    const allowedDomain = "itbdtv.blogspot.com";

    /*
     * Domain Check
     */
    function isAllowedEmbed() {

      // Direct access হলে parent আলাদা হবে না
      if (window.top === window.self) {
        return false;
      }

      const referrer = document.referrer;

      if (!referrer) {
        return false;
      }

      try {
        const referrerURL = new URL(referrer);

        return referrerURL.hostname === allowedDomain ||
               referrerURL.hostname.endsWith("." + allowedDomain);

      } catch (e) {
        return false;
      }
    }

    /*
     * Forbidden Page
     */
    function showForbidden() {

      document.body.innerHTML = `
        <div style="
          width:100%;
          height:100vh;
          display:flex;
          align-items:center;
          justify-content:center;
          flex-direction:column;
          background:#fff;
          color:#111;
          font-family:Arial,sans-serif;
          text-align:center;
          padding:20px;
        ">
          <h1>Forbidden</h1>
          <p>This player cannot be accessed directly.</p>
        </div>
      `;
    }

    /*
     * Get Video URL
     */
    const params = new URLSearchParams(window.location.search);
    const videoUrl = params.get("url");

    const iframe = document.getElementById("videoFrame");
    const loading = document.getElementById("loading");
    const errorBox = document.getElementById("error");
    const errorText = document.getElementById("errorText");

    /*
     * Check Access
     */
    if (!isAllowedEmbed()) {

      showForbidden();

    } else if (!videoUrl) {

      loading.style.display = "none";
      errorBox.style.display = "flex";
      errorText.textContent = "No video URL was provided.";

    } else {

      try {

        const decodedURL = decodeURIComponent(videoUrl);

        /*
         * Basic URL validation
         */
        const targetURL = new URL(decodedURL);

        if (
          targetURL.protocol !== "http:" &&
          targetURL.protocol !== "https:"
        ) {
          throw new Error("Invalid protocol");
        }

        /*
         * Load Player
         */
        iframe.src = targetURL.href;

        /*
         * Remove URL parameter from address bar
         */
        history.replaceState(
          null,
          document.title,
          window.location.pathname
        );

      } catch (error) {

        loading.style.display = "none";
        errorBox.style.display = "flex";
        errorText.textContent = "Invalid video URL.";

      }
    }

    /*
     * Hide loading after iframe loads
     */
    iframe.addEventListener("load", function () {

      setTimeout(function () {
        loading.style.display = "none";
      }, 500);

    });

    /*
     * Fullscreen Support
     */
    document.addEventListener("dblclick", function () {

      if (!document.fullscreenElement) {

        document.documentElement.requestFullscreen?.();

      } else {

        document.exitFullscreen?.();

      }

    });
  </script>

</body>
    </html>
