<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
    <title>RS Player - Full Screen</title>

    <script src="https://content.jwplatform.com/libraries/IDzF9Zmk.js"></script>
    <script>
        jwplayer.key="Khpp2dHxlBJHC8MCmLnBuV2jK/DwDnJMniwF6EO9HC/riJ712ZmbHg==";
    </script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html,body { width:100%; height:100%; background:#000; overflow:hidden; position:fixed; }
        #player { width:100%; height:100%; position:absolute; top:0; left:0; }
        
        .jw-video.jw-reset {
            width: 100% !important;
            height: 100% !important;
        }
        
        .jw-media, .jw-media video, .jw-preview {
            width: 100% !important;
            height: 100% !important;
        }
        
        .jwplayer.jw-flag-fullscreen {
            width: 100vw !important;
            height: 100vh !important;
        }
        
        .jwplayer.jw-flag-fullscreen .jw-media video {
            width: 100% !important;
            height: 100% !important;
        }
        
        @supports (padding: env(safe-area-inset-top)) {
            .jwplayer.jw-flag-fullscreen {
                padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left) !important;
            }
        }
        
        #loader {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:#000; display:flex; justify-content:center; align-items:center;
            z-index:9999; flex-direction:column; transition: opacity 0.3s ease;
        }
        #loader.hide { opacity:0; pointer-events:none; }
        .spinner {
            width:50px; height:50px; border:4px solid rgba(255,255,255,.1);
            border-top:4px solid #00c3ff; border-radius:50%;
            animation:spin 1s linear infinite;
        }
        @keyframes spin { 100% { transform:rotate(360deg); } }
        #loader p { margin-top:15px; color:#fff; font-family:sans-serif; font-size:14px; }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner"></div>
    <p id="status-text">Loading...</p>
</div>

<div id="player"></div>

<!-- HLS.js for Desktop -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js"></script>

<script>
    function getStreamUrl() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('url');
    }

    const streamSource = getStreamUrl();

    if (streamSource) {
        // ============================================================
        // ডেস্কটপ ডিটেক্ট
        // ============================================================
        const isMobile = /Android|iPhone|iPad|iPod|Mobile|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const isDesktop = !isMobile;
        
        console.log('Device:', isMobile ? 'Mobile' : 'Desktop');

        // ============================================================
        // JW Player Setup
        // ============================================================
        const player = jwplayer("player");

        player.setup({
            playlist: [{ file: streamSource, type: "hls" }],
            width: "100%",
            height: "100%",
            autostart: true,
            mute: false,
            stretching: "exactfit",
            controls: true,
            preload: "auto",
            playbackRateControls: [0.5, 0.75, 1, 1.25, 1.5, 2],
            defaultPlaybackRate: 1,
            fullscreen: { allow: true, on: false, orientation: "auto" },
            displaytitle: false,
            displaydescription: false,
            // ডেস্কটপে HLS ফallback
            primary: isDesktop ? "html5" : "html5",
            hlshtml: true
        });

        // ============================================================
        // ডেস্কটপে HLS.js দিয়ে ভিডিও লোড (Error 232403 সলভ)
        // ============================================================
        if (isDesktop && Hls.isSupported()) {
            let hlsInstance = null;
            let videoElement = null;

            // JW Player রেডি হলে ভিডিও এলিমেন্ট খুঁজে HLS.js অ্যাটাচ
            player.on("ready", function() {
                setTimeout(() => {
                    videoElement = document.querySelector('.jw-video');
                    if (videoElement) {
                        // HLS.js ইনিশিয়ালাইজ
                        hlsInstance = new Hls({
                            enableWorker: true,
                            lowLatencyMode: true,
                            backbufferLength: 30,
                            xhrSetup: function(xhr, url) {
                                // CORS ইস্যু ফিক্স
                                xhr.withCredentials = false;
                            }
                        });

                        hlsInstance.loadSource(streamSource);
                        hlsInstance.attachMedia(videoElement);

                        hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                            videoElement.play().catch(function(e) {
                                console.log('HLS Play prevented:', e);
                            });
                        });

                        hlsInstance.on(Hls.Events.ERROR, function(event, data) {
                            if (data.fatal) {
                                console.log('HLS Fatal Error - trying reload');
                                // রিলোড চেষ্টা
                                try {
                                    hlsInstance.loadSource(streamSource);
                                } catch(e) {
                                    console.log('HLS reload failed:', e);
                                }
                            }
                        });
                    }
                }, 500);
            });
        }

        // ============================================================
        // JW Player ইভেন্ট
        // ============================================================
        let loaderHidden = false;
        
        function hideLoader() {
            if (!loaderHidden) {
                document.getElementById('loader').classList.add('hide');
                loaderHidden = true;
                setTimeout(() => {
                    document.getElementById('loader').style.display = 'none';
                }, 400);
            }
        }

        player.on("ready", function() {
            hideLoader();
            player.setMute(false);
            player.setVolume(100);
        });

        player.on("play", function() {
            hideLoader();
            if(player.getMute()) {
                player.setMute(false);
            }
        });

        player.on("error", function(error) {
            console.log("JW Player Error:", error);
            
            // ডেস্কটপে Error 232403 হলে HLS.js রিলোড
            if (isDesktop && error.message && error.message.includes('232403')) {
                document.getElementById("status-text").innerText = "Retrying with HLS.js...";
                
                setTimeout(() => {
                    const videoElement = document.querySelector('.jw-video');
                    if (videoElement && Hls.isSupported()) {
                        const hlsReload = new Hls({
                            enableWorker: true,
                            lowLatencyMode: true,
                            xhrSetup: function(xhr, url) {
                                xhr.withCredentials = false;
                            }
                        });
                        hlsReload.loadSource(streamSource);
                        hlsReload.attachMedia(videoElement);
                    }
                }, 1000);
            } else {
                document.getElementById("status-text").innerText = "Stream Failed!";
            }
        });

        // ============================================================
        // কিবোর্ড শর্টকাট
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if ((e.key === 'f' || e.key === 'F') && !e.ctrlKey && !e.metaKey) {
                e.preventDefault();
                player.setFullscreen(true);
            }
            if (e.key === ' ' && e.target === document.body) {
                e.preventDefault();
                if (player.getState() === 'playing') {
                    player.pause();
                } else {
                    player.play();
                }
            }
        });

        console.log('RS Player Loaded! (Desktop HLS.js fallback added)');

    } else {
        document.getElementById("status-text").innerText = "No URL Provided!";
    }
</script>

</body>
</html>
