
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="referrer" content="no-referrer">

<title>RS Player Pro</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080808;
  font-family:Arial,Helvetica,sans-serif;
}

#player-container{
  position:fixed;
  inset:0;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
}

video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

video.fit-fill{
  object-fit:fill;
}

video.fit-zoom{
  object-fit:cover;
}

/* Status */

#status{
  position:fixed;
  top:max(15px,env(safe-area-inset-top));
  right:15px;
  z-index:9999;

  display:flex;
  align-items:center;
  gap:8px;

  padding:8px 13px;
  border-radius:30px;

  background:rgba(15,15,15,.85);
  border:1px solid rgba(255,255,255,.10);

  color:#ddd;
  font-size:12px;
  font-weight:600;

  opacity:0;
  transform:translateY(-8px);
  transition:.25s;
  pointer-events:none;

  backdrop-filter:blur(12px);
}

#status.show{
  opacity:1;
  transform:translateY(0);
}

.dot{
  width:7px;
  height:7px;
  background:#38bdf8;
  border-radius:50%;
}

#status.live .dot{
  background:#22c55e;
  animation:pulse 1.5s infinite;
}

#status.loading .dot{
  background:#fbbf24;
  animation:pulse 1s infinite;
}

#status.error .dot{
  background:#ef4444;
}

@keyframes pulse{
  50%{opacity:.35;transform:scale(.65)}
}

/* Fit button */

.fit-btn{
  border:0!important;
  background:transparent!important;
  color:white!important;
  min-width:45px!important;
  padding:0 7px!important;
  cursor:pointer!important;
  display:flex!important;
  justify-content:center!important;
  align-items:center!important;
}

.fit-label{
  border:1px solid #555;
  border-radius:5px;
  padding:4px 7px;
  font-size:10px;
  font-weight:800;
  color:#ddd;
}

.fit-btn.fill .fit-label{
  border-color:#38bdf8;
  color:#38bdf8;
}

.fit-btn.zoom .fit-label{
  border-color:#a78bfa;
  color:#a78bfa;
}

/* Shaka */

.shaka-video-container{
  background:#000!important;
}

.shaka-controls-container button{
  color:#fff!important;
}

.shaka-spinner-container{
  background:transparent!important;
}

.shaka-controls-container{
  z-index:10;
}

@media(max-width:480px){
  #status{
    top:10px;
    right:10px;
    font-size:11px;
    padding:7px 10px;
  }

  .fit-label{
    font-size:9px;
    padding:3px 5px;
  }
}
</style>
</head>

<body>

<div id="player-container">

  <video
    id="video"
    autoplay
    muted
    playsinline
    preload="metadata">
  </video>

</div>

<div id="status">
  <span class="dot"></span>
  <span id="statusText">Ready</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>

<script>
(function(){

"use strict";

const video = document.getElementById("video");
const container = document.getElementById("player-container");
const status = document.getElementById("status");
const statusText = document.getElementById("statusText");

let player;
let statusTimer;
let fitIndex = 0;

const FIT_MODES = ["contain","fill","cover"];
const FIT_LABELS = ["FIT","FILL","ZOOM"];

function setStatus(text,type="loading",duration=4000){

  statusText.textContent=text;

  status.className="show "+type;

  clearTimeout(statusTimer);

  if(duration>0){

    statusTimer=setTimeout(()=>{
      status.classList.remove("show");
    },duration);

  }

}

/* Fit Button */

function addFitButton(){

  const panel=document.querySelector(
    ".shaka-controls-button-panel"
  );

  if(!panel || panel.querySelector(".rs-fit-btn")){
    return;
  }

  const fullscreenButton=panel.querySelector(
    ".shaka-fullscreen-button"
  );

  const button=document.createElement("button");

  button.className="fit-btn rs-fit-btn";
  button.title="Video Fit Mode";
  button.innerHTML='<span class="fit-label">FIT</span>';

  if(fullscreenButton){
    panel.insertBefore(button,fullscreenButton);
  }else{
    panel.appendChild(button);
  }

  function applyFit(){

    const mode=FIT_MODES[fitIndex];

    video.classList.remove("fit-fill","fit-zoom");

    button.classList.remove("fill","zoom");

    if(mode==="fill"){
      video.classList.add("fit-fill");
      button.classList.add("fill");
    }

    if(mode==="cover"){
      video.classList.add("fit-zoom");
      button.classList.add("zoom");
    }

    button.querySelector(".fit-label").textContent=
      FIT_LABELS[fitIndex];

    button.title="Video Mode: "+FIT_LABELS[fitIndex];

  }

  button.addEventListener("click",function(e){

    e.stopPropagation();

    fitIndex=(fitIndex+1)%FIT_MODES.length;

    applyFit();

  });

  applyFit();

}

/* Player Init */

async function init(){

  shaka.polyfill.installAll();

  if(!shaka.Player.isBrowserSupported()){

    setStatus("Browser Not Supported","error",0);

    return;

  }

  player=new shaka.Player();

  await player.attach(video);

  const ui=new shaka.ui.Overlay(
    player,
    container,
    video
  );

  ui.configure({

    addBigPlayButton:true,

    controlPanelElements:[
      "play_pause",
      "mute",
      "volume",
      "time_and_duration",
      "spacer",
      "quality",
      "picture_in_picture",
      "fullscreen"
    ],

    seekBarColors:{
      base:"#555",
      buffered:"#777",
      played:"#ff3030"
    }

  });

  let tries=0;

  const fitInterval=setInterval(()=>{

    addFitButton();

    tries++;

    if(document.querySelector(".rs-fit-btn") || tries>30){
      clearInterval(fitInterval);
    }

  },200);

  player.addEventListener("error",function(event){

    const error=event.detail;

    setStatus(
      "Stream Error "+(error.code||""),
      "error",
      6000
    );

  });

  video.addEventListener("playing",function(){

    setStatus("LIVE","live",4000);

  });

  video.addEventListener("waiting",function(){

    setStatus("Buffering...","loading",0);

  });

  video.addEventListener("pause",function(){

    if(!video.ended){
      setStatus("Paused","loading",2500);
    }

  });

  video.addEventListener("play",function(){

    video.muted=false;

  });

  /* URL Parameter */

  const params=new URLSearchParams(window.location.search);

  const streamUrl=params.get("url");

  if(!streamUrl){

    setStatus("Ready - No Stream URL","loading",5000);

    return;

  }

  await loadStream(streamUrl);

}

/* Load Stream */

async function loadStream(url){

  try{

    setStatus("Connecting...","loading",0);

    await player.load(url);

    setStatus("LIVE","live",4000);

    video.play().catch(()=>{

      video.muted=true;

      video.play().catch(()=>{});

    });

  }catch(error){

    console.error("Player Error:",error);

    setStatus(
      "Playback Failed",
      "error",
      0
    );

  }

}

/* Start */

document.addEventListener(
  "DOMContentLoaded",
  init
);

})();
</script>

</body>
</html>
