<style>
:root{
    --bg-1:#0a0a12;
    --bg-2:#14101f;
    --grad-a:#22d3ee;
    --grad-b:#a78bfa;
    --grad-c:#fb923c;
    --warn:#ffb84d;
    --alert:#ff5d5d;
    --text:#eef0f7;
    --text-dim:#7a7a92;
    --font:'Poppins','Segoe UI',sans-serif;
    --mono:'JetBrains Mono','Courier New',monospace;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:var(--font);
    position:fixed;
    inset:0;
    overscroll-behavior:none;
}

body{
    touch-action:pan-x pan-y;
}

#player-wrapper{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    contain:layout paint;
}

#player{
    position:absolute;
    inset:0;
    width:100%!important;
    height:100%!important;
    touch-action:manipulation;
}

/* VIDEO */
#player video,
.jw-video{
    width:100%!important;
    height:100%!important;
    object-fit:fill!important;
    touch-action:manipulation!important;
    -webkit-user-select:none;
    user-select:none;
}

video::-webkit-media-controls{
    display:none!important;
}

/* JW SKIN */
.jw-skin-glow .jw-display-icon-container{
    background:rgba(167,139,250,.10)!important;
    border:1px solid rgba(167,139,250,.4);
    backdrop-filter:none!important;
    -webkit-backdrop-filter:none!important;
}

.jw-skin-glow .jw-button-color{
    color:#fff!important;
}

.jw-skin-glow .jw-controlbar{
    background:linear-gradient(0deg, rgba(0,0,0,.75), transparent)!important;
    backdrop-filter:none!important;
    -webkit-backdrop-filter:none!important;
}

.jw-skin-glow .jw-slider-time .jw-progress{
    background:var(--grad-b)!important;
}

.jw-skin-glow .jw-knob{
    background:var(--grad-b)!important;
}

.jw-video.jw-reset{
    object-fit:fill!important;
}

/* NEW: LIVE BADGE */
.live-badge{
    position:absolute;
    top:15px;
    left:15px;
    background:rgba(255, 0, 85, 0.9);
    color:#fff;
    font-size:10px;
    font-weight:800;
    padding:4px 10px;
    border-radius:20px;
    display:flex;
    align-items:center;
    gap:6px;
    z-index:10;
    font-family:var(--mono);
    letter-spacing:1px;
    box-shadow:0 4px 10px rgba(255,0,85,.3);
    display:none; /* Default hidden, JS will show for live streams */
}

.live-badge::before{
    content:'';
    width:6px;
    height:6px;
    background:#fff;
    border-radius:50%;
    animation:pulse-dot 1.5s infinite;
}

@keyframes pulse-dot{
    0%{opacity:1; transform:scale(1);}
    50%{opacity:.4; transform:scale(.8);}
    100%{opacity:1; transform:scale(1);}
}

/* LOADER */
#loader{
    position:absolute;
    inset:0;
    background:radial-gradient(80% 60% at 50% 40%, var(--bg-2) 0%, var(--bg-1) 70%);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:99;
    transition:opacity .1s ease,visibility .1s ease;
    pointer-events:none;
}

#loader.hide-now{
    opacity:0!important;
    visibility:hidden!important;
    pointer-events:none!important;
}

.tuner{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
}

.tv-wrap{
    position:relative;
    width:78px;
    height:78px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.tv-glow{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:radial-gradient(circle, rgba(167,139,250,.35), transparent 70%);
    animation:glow-pulse 2.4s ease-in-out infinite;
}

@keyframes glow-pulse{
    0%,100%{transform:scale(.85);opacity:.5}
    50%{transform:scale(1.15);opacity:1}
}

.tv-icon{
    position:relative;
    width:60px;
    height:60px;
}

.tv-icon .tv-body{
    fill:none;
    stroke:var(--text);
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.tv-icon .screen-bars rect{
    transform-origin:bottom;
    animation:bar-flicker 1.6s ease-in-out infinite;
}

.tv-icon .screen-bars rect:nth-child(1){fill:var(--grad-a);animation-delay:-1.2s}
.tv-icon .screen-bars rect:nth-child(2){fill:var(--grad-b);animation-delay:-.9s}
.tv-icon .screen-bars rect:nth-child(3){fill:var(--grad-c);animation-delay:-.6s}
.tv-icon .screen-bars rect:nth-child(4){fill:var(--grad-b);animation-delay:-.3s}
.tv-icon .screen-bars rect:nth-child(5){fill:var(--grad-a);animation-delay:0s}

@keyframes bar-flicker{
    0%,100%{transform:scaleY(.45);opacity:.65}
    50%{transform:scaleY(1);opacity:1}
}

.brand-name{
    font-size:15px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    background:linear-gradient(90deg,var(--grad-a),var(--grad-b));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.brand-name b{
    color:var(--text);
    -webkit-text-fill-color:var(--text);
}

.dots{
    display:flex;
    gap:6px;
}

.dots span{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--grad-b);
    animation:dot-pulse 1.2s ease-in-out infinite;
}

.dots span:nth-child(1){animation-delay:0s}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}

@keyframes dot-pulse{
    0%,80%,100%{transform:scale(.6);opacity:.35}
    40%{transform:scale(1);opacity:1}
}

.status-line{
    font-family:var(--mono);
    font-size:9.5px;
    letter-spacing:2.5px;
    color:var(--text-dim);
    text-transform:uppercase;
}

/* ERROR */
.state-content{
    text-align:center;
    color:var(--text);
    z-index:100;
    padding:0 24px;
    font-family:var(--font);
    pointer-events:auto;
}

.state-content .glyph{
    font-size:34px;
    color:var(--alert);
    margin-bottom:14px;
    line-height:1;
}

.state-content .glyph.warn{
    color:var(--warn);
}

.state-content p.title{
    font-size:13px;
    letter-spacing:1px;
    font-weight:600;
}

.state-content p.sub{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--text-dim);
    margin-top:8px;
    letter-spacing:.5px;
    max-width:280px;
    overflow-wrap:anywhere;
}

.state-content .brand-name{
    display:block;
    margin-top:18px;
}

.retry-btn{
    margin-top:16px;
    padding:8px 20px;
    font-family:var(--font);
    font-weight:600;
    font-size:11px;
    letter-spacing:.5px;
    color:#0a0a12;
    background:linear-gradient(90deg,var(--grad-a),var(--grad-b));
    border:none;
    border-radius:18px;
    cursor:pointer;
    touch-action:manipulation;
}

.retry-btn:active{
    transform:scale(.96);
}

/* FULLSCREEN */
.jwplayer.jw-flag-fullscreen,
.jwplayer.jw-flag-fullscreen .jw-media,
.jwplayer.jw-flag-fullscreen video{
    width:100%!important;
    height:100%!important;
}

.jwplayer.jw-flag-fullscreen video{
    object-fit:fill!important;
}

.jwplayer,
.jw-media,
.jw-video{
    transform:none!important;
    filter:none!important;
    will-change:auto!important;
}

/* LANDSCAPE FULLSCREEN */
#player-wrapper:fullscreen{
    width:100vw;
    height:100vh;
    background:#000;
}

#player-wrapper:-webkit-full-screen{
    width:100vw;
    height:100vh;
    background:#000;
}

#player-wrapper:fullscreen #player,
#player-wrapper:-webkit-full-screen #player{
    width:100%!important;
    height:100%!important;
}

/* NEW: TOUCH OVERLAY FOR DOUBLE TAP */
#touch-overlay{
    position:absolute;
    inset:0;
    z-index:5;
    display:flex;
}

.touch-zone{
    flex:1;
    height:100%;
}

/* NEW: TOAST MESSAGE (For volume, speed, etc.) */
#toast{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    background:rgba(0,0,0,0.8);
    color:#fff;
    padding:12px 24px;
    border-radius:12px;
    font-size:14px;
    font-weight:600;
    font-family:var(--font);
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.3s ease;
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,0.15);
}

#toast.show{
    opacity:1;
}

</style>
</head>

<body>

<div id="player-wrapper">

    <!-- NEW: LIVE BADGE -->
    <div id="live-badge" class="live-badge">LIVE</div>

    <!-- NEW: TOUCH OVERLAY -->
    <div id="touch-overlay">
        <div class="touch-zone" id="zone-left"></div>
        <div class="touch-zone" id="zone-right"></div>
    </div>

    <!-- NEW: TOAST -->
    <div id="toast"></div>

    <div id="loader">
        <div class="tuner">
            <div class="tv-wrap">
                <div class="tv-glow"></div>
                <svg class="tv-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                    <path class="tv-body" d="M22 12 32 20 42 12"/>
                    <clipPath id="screenClip">
                        <rect x="12" y="20" width="40" height="26" rx="4"/>
                    </clipPath>
                    <g class="screen-bars" clip-path="url(#screenClip)">
                        <rect x="12" y="20" width="8" height="26"/>
                        <rect x="20" y="20" width="8" height="26"/>
                        <rect x="28" y="20" width="8" height="26"/>
                        <rect x="36" y="20" width="8" height="26"/>
                        <rect x="44" y="20" width="8" height="26"/>
                    </g>
                    <rect class="tv-body" x="12" y="20" width="40" height="26" rx="4"/>
                    <line class="tv-body" x1="24" y1="46" x2="24" y2="50"/>
                    <line class="tv-body" x1="40" y1="46" x2="40" y2="50"/>
                    <line class="tv-body" x1="20" y1="50" x2="44" y2="50"/>
                </svg>
            </div>
            <div class="brand-name"><b>RS LIVE</b> TV</div>
            <div class="dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="status-line" id="status-line">LOADING</div>
        </div>
    </div>

    <div id="player"></div>

</div>

<script>
/* URL SETTINGS */
const urlParams = new URLSearchParams(window.location.search);
const streamSource = urlParams.get('url');
const forcedType = (urlParams.get('type') || '').toLowerCase();
const startMuted = urlParams.get('mute') === '1';

const loaderEl = document.getElementById('loader');
const statusEl = document.getElementById('status-line');
const wrapper = document.getElementById('player-wrapper');
const liveBadge = document.getElementById('live-badge');
const toastEl = document.getElementById('toast');

/* LOADER STATUS */
const statusMessages = ['LOADING', 'CONNECTING', 'BUFFERING'];
let statusIdx = 0;
let statusTimer = setInterval(() => {
    if(loaderEl.classList.contains('hide-now')) return;
    statusIdx = (statusIdx + 1) % statusMessages.length;
    statusEl.textContent = statusMessages[statusIdx];
}, 1800);

function showLoader(){ loaderEl.classList.remove('hide-now'); }
function hideLoader(){ loaderEl.classList.add('hide-now'); }

function showState(html){
    clearInterval(statusTimer);
    loaderEl.innerHTML = html;
    showLoader();
}

function brandBlock(){
    return `<div class="brand-name"><b>RS LIVE</b> TV</div>`;
}

/* TOAST HELPER */
let toastTimeout;
function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
        toastEl.classList.remove('show');
    }, 1200);
}

/* WAKE LOCK */
let wakeLock = null;
let wakeLockWanted = false;

async function requestWakeLock(){
    wakeLockWanted = true;
    if(!('wakeLock' in navigator)) return;
    if(wakeLock) return;
    if(document.visibilityState !== 'visible') return;
    try{
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release',() => { wakeLock = null; });
    }catch(e){ wakeLock = null; }
}

async function releaseWakeLock(){
    wakeLockWanted = false;
    if(wakeLock){
        try{ await wakeLock.release(); }catch(e){}
        wakeLock = null;
    }
}

document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible' && wakeLockWanted){
        requestWakeLock();
    }
});

/* STREAM TYPE */
function detectType(raw){
    if(forcedType) return forcedType;
    const clean = raw.split('?')[0].split('#')[0].toLowerCase();
    if(clean.endsWith('.m3u8')) return 'hls';
    if(clean.endsWith('.mpd')) return 'dash';
    if(clean.endsWith('.mp4')) return 'mp4';
    if(clean.endsWith('.webm')) return 'webm';
    if(clean.endsWith('.mov')) return 'mp4';
    if(clean.endsWith('.ogg') || clean.endsWith('.ogv')) return 'ogg';
    if(raw.includes('.m3u8')) return 'hls';
    if(raw.includes('.mpd')) return 'dash';
    return null;
}

/* NO URL */
if(!streamSource){
    showState(`
        <div class="state-content">
            <div class="glyph warn"><i>&#9888;</i></div>
            <p class="title">No stream URL supplied</p>
            <p class="sub">Add ?url=YOUR_STREAM_LINK to this page's address.</p>
            ${brandBlock()}
        </div>
    `);
}else{
    const streamType = detectType(streamSource);
    const playlistItem = { file: streamSource };
    if(streamType) playlistItem.type = streamType;

    /* JW PLAYER SETUP - Added extra UI options */
    const player = jwplayer('player').setup({
        playlist: [playlistItem],
        width: '100%',
        height: '100%',
        autostart: true,
        mute: startMuted,
        preload: 'auto',
        stretching: 'uniform',
        liveTimeout: 0,
        skin: { name: 'glow' },
        displaytitle: false,
        displaydescription: false,
        controls: true,
        repeat: false,
        
        /* NEW FEATURES */
        playbackRateControls: [0.5, 1, 1.25, 1.5, 2],
        playbackRates: [0.5, 1, 1.25, 1.5, 2],
        pictureInPicture: true,
        volumeControl: true
    });

    /* RETRY */
    let retryCount = 0;
    const maxRetries = 6;
    let retryTimer = null;
    let everPlayed = false;
    let userPaused = false;
    const NO_STREAM_TIMEOUT = 12000;

    let noStreamTimer = setTimeout(() => {
        if(!everPlayed){ showNoStreamState(); }
    }, NO_STREAM_TIMEOUT);

    /* VIDEO STYLE */
    function applyVideoStyle(){
        const video = document.querySelector('#player video');
        if(video){
            video.style.width = '100%';
            video.style.height = '100%';
            video.style.objectFit = 'fill';
            video.style.touchAction = 'manipulation';
            video.setAttribute('playsinline','');
        }
    }

    /* READY */
    player.on('ready',() => {
        console.log('RS Player ready:', streamType || 'auto');
        applyVideoStyle();
        
        /* Show LIVE badge if HLS stream */
        if(streamType === 'hls' || streamSource.includes('.m3u8')) {
            liveBadge.style.display = 'flex';
        }
    });

    /* FIRST FRAME */
    player.on('firstFrame',() => {
        clearInterval(statusTimer);
        clearTimeout(noStreamTimer);
        hideLoader();
        everPlayed = true;
        retryCount = 0;
    });

    /* PLAY */
    player.on('play',() => {
        clearTimeout(noStreamTimer);
        everPlayed = true;
        hideLoader();
        retryCount = 0;
        requestWakeLock();
    });

    /* PAUSE */
    player.on('pause',() => {
        userPaused = true;
        releaseWakeLock();
    });

    /* COMPLETE */
    player.on('complete',() => {
        releaseWakeLock();
    });

    /* BUFFER & IDLE */
    player.on('buffer',() => { console.log('[RS Player] buffer'); });
    player.on('idle',() => { console.log('[RS Player] idle'); });

    /* FULLSCREEN + LANDSCAPE ORIENTATION */
    let landscapeLocked = false;

    async function lockLandscape(){
        try{
            if(screen.orientation && typeof screen.orientation.lock === 'function'){
                await screen.orientation.lock('landscape');
                landscapeLocked = true;
                console.log('[RS Player] Landscape locked');
            }
        }catch(error){
            landscapeLocked = false;
        }
    }

    function unlockLandscape(){
        try{
            if(screen.orientation && typeof screen.orientation.unlock === 'function'){
                screen.orientation.unlock();
            }
        }catch(error){}
        landscapeLocked = false;
    }

    player.on('fullscreen',(evt) => {
        const isFullscreen = evt && evt.fullscreen;
        if(isFullscreen){ lockLandscape(); }else{ unlockLandscape(); }
        requestAnimationFrame(() => { applyVideoStyle(); });
    });

    document.addEventListener('fullscreenchange',() => {
        if(document.fullscreenElement){ lockLandscape(); }else if(!player.getFullscreen()){ unlockLandscape(); }
        requestAnimationFrame(() => { applyVideoStyle(); });
    });

    document.addEventListener('webkitfullscreenchange',() => {
        if(document.webkitFullscreenElement){ lockLandscape(); }else{ unlockLandscape(); }
        requestAnimationFrame(() => { applyVideoStyle(); });
    });

    if(screen.orientation){
        screen.orientation.addEventListener('change',() => {
            if(player.getFullscreen() || document.fullscreenElement){
                requestAnimationFrame(() => { applyVideoStyle(); });
            }
        });
    }

    /* ERROR + AUTO RECONNECT */
    player.on('error', handleFault);
    player.on('setupError', handleFault);

    function handleFault(err){
        console.error('[RS Player] error:',err);
        if(userPaused) return;

        if(!everPlayed){
            clearTimeout(retryTimer);
            retryTimer = setTimeout(() => {
                try{ player.load([playlistItem]); player.play(true); }catch(e){}
            }, 900);
            return;
        }

        if(retryCount < maxRetries){
            retryCount++;
            statusEl.textContent = 'RECONNECTING (' + retryCount + '/' + maxRetries + ')';
            showLoader();
            clearTimeout(retryTimer);
            retryTimer = setTimeout(() => {
                try{ player.load([playlistItem]); player.play(true); }catch(e){}
            }, Math.min(1000 * retryCount, 4000));
            return;
        }

        showNoStreamState(err);
    }

    function showNoStreamState(err){
        clearTimeout(retryTimer);
        clearTimeout(noStreamTimer);
        releaseWakeLock();
        showState(`
            <div class="state-content">
                <div class="glyph"><i>&#10060;</i></div>
                <p class="title">No streaming — this link won't play</p>
                <p class="sub">${err && err.message ? err.message : 'The source could not be reached.'}</p>
                <button class="retry-btn" onclick="location.reload()">Retry</button>
                ${brandBlock()}
            </div>
        `);
    }

    /* TOUCH SAFETY */
    const playerBox = document.getElementById('player');
    if(playerBox){
        playerBox.addEventListener('contextmenu', e => { e.preventDefault(); }, {passive:false});
    }

    /* VIDEO COMPOSITING */
    const observer = new MutationObserver(() => { applyVideoStyle(); });
    observer.observe(document.getElementById('player'), { childList:true, subtree:true });

    /* =========================================================
       NEW: DOUBLE TAP TO SEEK (10s Forward / 10s Backward)
    ========================================================= */
    const zoneLeft = document.getElementById('zone-left');
    const zoneRight = document.getElementById('zone-right');
    let lastTapLeft = 0;
    let lastTapRight = 0;
    const doubleTapDelay = 300;

    function seekForward(){
        if(!player) return;
        const current = player.getPosition() || 0;
        player.seek(current + 10);
        showToast("⏩ +10s");
    }

    function seekBackward(){
        if(!player) return;
        const current = player.getPosition() || 0;
        player.seek(Math.max(0, current - 10));
        showToast("⏪ -10s");
    }

    if(zoneLeft) {
        zoneLeft.addEventListener('click', function(e){
            const now = Date.now();
            if(now - lastTapLeft < doubleTapDelay){
                seekBackward();
                lastTapLeft = 0;
            } else {
                lastTapLeft = now;
            }
        });
    }

    if(zoneRight) {
        zoneRight.addEventListener('click', function(e){
            const now = Date.now();
            if(now - lastTapRight < doubleTapDelay){
                seekForward();
                lastTapRight = 0;
            } else {
                lastTapRight = now;
            }
        });
    }

    /* =========================================================
       NEW: KEYBOARD SHORTCUTS (Desktop)
    ========================================================= */
    document.addEventListener('keydown', function(e){
        if(!player) return;
        
        // Ignore if user typing in an input
        if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        switch(e.key) {
            case 'ArrowRight':
                seekForward();
                break;
            case 'ArrowLeft':
                seekBackward();
                break;
            case ' ':
            case 'k':
                e.preventDefault();
                if(player.getState() === 'playing') player.pause();
                else player.play();
                break;
            case 'f':
                player.setFullscreen(!player.getFullscreen());
                break;
            case 'm':
                player.setMute(!player.getMute());
                if(!player.getMute()) showToast("🔊 Unmuted");
                else showToast("🔇 Muted");
                break;
            case 'p':
                // Native PiP if available
                const videoEl = document.querySelector('#player video');
                if(videoEl && document.pictureInPictureEnabled && !videoEl.disablePictureInPicture) {
                    if(document.pictureInPictureElement) document.exitPictureInPicture();
                    else videoEl.requestPictureInPicture().catch(()=>{});
                }
                break;
        }
    });

}
</script>
