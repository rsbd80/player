<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>RS Player Pro</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.0/shaka-player.compiled.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Poppins',sans-serif;position:fixed;inset:0}
#player-wrapper{position:fixed;inset:0;background:#000}
#player{position:absolute;inset:0;width:100%!important;height:100%!important}
#player video{width:100%!important;height:100%!important;object-fit:fill!important}
#loader{position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 40%,#14101f 0%,#0a0a12 70%);display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:99;transition:opacity .2s;pointer-events:none}
#loader.hide-now{opacity:0!important;visibility:hidden!important}
.brand-name{font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:linear-gradient(90deg,#22d3ee,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:18px}
.brand-name b{color:#fff;-webkit-text-fill-color:#fff}
.dots{display:flex;gap:6px;margin-top:18px}.dots span{width:6px;height:6px;border-radius:50%;background:#a78bfa;animation:p 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes p{0%,80%,100%{transform:scale(.6);opacity:.35}40%{transform:scale(1);opacity:1}}
.status-line{font-family:monospace;font-size:10px;letter-spacing:2.5px;color:#7a7a92;margin-top:12px}
.state-content{text-align:center;color:#eef0f7;padding:0 24px}
.state-content .glyph{font-size:34px;color:#ff5d5d;margin-bottom:14px}
.state-content p.title{font-size:13px;font-weight:600}
.state-content p.sub{font-family:monospace;font-size:11px;color:#7a7a92;margin-top:8px;max-width:320px;overflow-wrap:anywhere}
.retry-btn{margin-top:16px;padding:8px 20px;font-weight:600;font-size:11px;color:#0a0a12;background:linear-gradient(90deg,#22d3ee,#a78bfa);border:none;border-radius:18px;cursor:pointer}
#controls{position:absolute;bottom:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:10px;padding:14px;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);opacity:0;transition:opacity .3s}
#player-wrapper.show-controls #controls{opacity:1}
#controls button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;width:42px;height:42px;border-radius:50%;font-size:16px;cursor:pointer}
#seek{flex:1;-webkit-appearance:none;height:4px;background:rgba(255,255,255,.3);border-radius:4px}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#a78bfa}
#time-label{font-family:monospace;font-size:11px;color:#fff}
</style>
</head>
<body>
<div id="player-wrapper">
<div id="loader"><div style="font-size:50px">📺</div><div class="brand-name"><b>RS LIVE</b> TV</div><div class="dots"><span></span><span></span><span></span></div><div class="status-line" id="status-line">LOADING</div></div>
<div id="player"></div>
<div id="controls"><button id="playBtn">▶</button><input type="range" id="seek" value="0" min="0" max="100"><span id="time-label">LIVE</span><button id="fsBtn">⛶</button></div>
</div>
<script>
const urlParams = new URLSearchParams(window.location.search);
let streamSource = urlParams.get('url') || '';
let keyParam = urlParams.get('key') || urlParams.get('license_key') || urlParams.get('clearkey') || '';
const loaderEl = document.getElementById('loader');
const statusEl = document.getElementById('status-line');
const wrapper = document.getElementById('player-wrapper');
const playBtn = document.getElementById('playBtn');
const fsBtn = document.getElementById('fsBtn');
function hideLoader(){ loaderEl.classList.add('hide-now'); }
function showLoader(){ loaderEl.classList.remove('hide-now'); }
function showState(html){ loaderEl.innerHTML = html; showLoader(); }
function brandBlock(){ return `<div class="brand-name"><b>RS LIVE</b> TV</div>`; }
let hideCtrlTimer=null;
function showControls(){ wrapper.classList.add('show-controls'); clearTimeout(hideCtrlTimer); hideCtrlTimer=setTimeout(()=>wrapper.classList.remove('show-controls'),3000); }
wrapper.addEventListener('click',showControls); wrapper.addEventListener('touchstart',showControls,{passive:true}); wrapper.addEventListener('mousemove',showControls);

if(!streamSource){
  showState(`<div class="state-content"><p class="title">No stream URL</p><p class="sub">Add ?url=...</p>${brandBlock()}</div>`);
} else {
  const video = document.createElement('video');
  video.setAttribute('playsinline',''); video.muted=false; video.autoplay=true; video.controls=false;
  video.style.cssText='width:100%;height:100%;object-fit:fill;background:#000';
  document.getElementById('player').appendChild(video);
  let hls=null, shakaPlayer=null, everPlayed=false, triedProxy=false;

  function parseClearKey(k){
    if(!k) return null; k=k.trim();
    if(k.includes('{')){ try{ const o=JSON.parse(k); const kid=Object.keys(o)[0]; return {[kid]:o[kid]}; }catch(e){} }
    if(k.includes(':')){ const i=k.indexOf(':'); return {[k.slice(0,i).trim()]: k.slice(i+1).trim()}; }
    return null;
  }

  // ✅ MPD এর সব রিকোয়েস্ট Proxy দিয়ে যাবে
  function shouldProxy(u){
    return u.includes('otte.cache') || u.includes('aiv-cdn') || u.includes('otte') || u.includes('.mpd');
  }
  function toProxyUrl(u){
    if(u.startsWith('/proxy')) return u;
    return '/proxy?url=' + encodeURIComponent(u);
  }

  function loadMPD(url){
    if(hls){ try{hls.destroy();}catch(e){} hls=null; }
    if(shakaPlayer){ try{shakaPlayer.destroy();}catch(e){} shakaPlayer=null; }
    shaka.polyfill.installAll();
    shakaPlayer = new shaka.Player(video);

    // 🔥 সব Request Proxy দিয়ে পাঠাও
    const net = shakaPlayer.getNetworkingEngine();
    net.registerRequestFilter((type, request) => {
      if(shouldProxy(request.uris[0])){
        request.uris[0] = toProxyUrl(request.uris[0]);
      }
    });

    const clearKeys = parseClearKey(keyParam);
    if(clearKeys){
      shakaPlayer.configure({ drm:{ clearKeys: clearKeys } });
    } else if(url.includes('cenc') || url.includes('otte')){
      showState(`<div class="state-content"><div class="glyph">🔑</div><p class="title">Clearkey পাওয়া যায় নাই</p><p class="sub">index.html থেকে &key=KID:KEY পাঠাতে হবে</p><button class="retry-btn" onclick="location.reload()">Retry</button>${brandBlock()}</div>`);
      return;
    }
    shakaPlayer.configure({ streaming:{ retryParameters:{ maxAttempts:3 } } });
    shakaPlayer.addEventListener('error', (e)=>{
      const err = e.detail;
      // Proxy ছাড়া ফেইল করলে ১ বার Proxy দিয়ে চেষ্টা
      if(!triedProxy && (err.code===1001 || err.code===1002 || err.code===4001 || err.code===1003)){
        triedProxy = true;
        statusEl.textContent = 'PROXY দিয়ে চেষ্টা করছি...';
        setTimeout(()=> loadMPD(toProxyUrl(url)), 800);
        return;
      }
      showState(`<div class="state-content"><div class="glyph">❌</div><p class="title">No streaming</p><p class="sub">Error ${err.code}: ${err.message || 'Source blocked'}</p><button class="retry-btn" onclick="location.reload()">Retry</button>${brandBlock()}</div>`);
    });
    // প্রথম লোড Proxy দিয়ে করো যদি otte হয়
    const firstUrl = shouldProxy(url) && !url.startsWith('/proxy') ? toProxyUrl(url) : url;
    shakaPlayer.load(firstUrl).then(()=>{ hideLoader(); everPlayed=true; video.play().catch(()=>{}); }).catch((err)=>{
      showState(`<div class="state-content"><div class="glyph">❌</div><p class="title">Load Fail ${err.code}</p><p class="sub">${err.message}</p><button class="retry-btn" onclick="location.reload()">Retry</button>${brandBlock()}</div>`);
    });
  }

  function loadHLS(url){
    if(shakaPlayer){ try{shakaPlayer.destroy();}catch(e){} shakaPlayer=null; }
    if(hls){ try{hls.destroy();}catch(e){} hls=null; }
    video.removeAttribute('src'); video.load();
    // ✅ HLS ও Proxy দিয়ে যাবে যদি otte হয়
    let finalUrl = url;
    if(shouldProxy(url) && url.includes('.m3u8')) finalUrl = toProxyUrl(url);
    if(window.Hls && Hls.isSupported()){
      hls = new Hls({ maxBufferLength:30, enableWorker:true, lowLatencyMode:true });
      hls.loadSource(finalUrl); hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, ()=>{ video.play().catch(()=>{}); });
      hls.on(Hls.Events.ERROR, (e,data)=>{ if(data.fatal) showState(`<div class="state-content"><div class="glyph">❌</div><p class="title">HLS Error</p><p class="sub">${data.details}</p>${brandBlock()}</div>`); });
    } else if(video.canPlayType('application/vnd.apple.mpegurl')){ video.src=finalUrl; video.play().catch(()=>{}); }
  }

  video.addEventListener('playing',()=>{ hideLoader(); everPlayed=true; });
  video.addEventListener('pause',()=>{ playBtn.textContent='▶'; });
  video.addEventListener('play',()=>{ playBtn.textContent='❚❚'; });
  playBtn.addEventListener('click',(e)=>{ e.stopPropagation(); if(video.paused) video.play(); else video.pause(); showControls(); });
  fsBtn.addEventListener('click',(e)=>{ e.stopPropagation(); if(document.fullscreenElement) document.exitFullscreen(); else wrapper.requestFullscreen().catch(()=>{}); showControls(); });

  if(streamSource.includes('.mpd')) loadMPD(streamSource);
  else loadHLS(streamSource);
}
</script>
</body>
</html>
