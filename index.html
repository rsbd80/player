<link rel="preconnect" href="https://content.jwplatform.com">

<style>
:root{
    --bg-1:#0a0a12;
    --bg-2:#14101f;
    --grad-a:#22d3ee;
    --grad-b:#a78bfa;
    --grad-c:#fb923c;
    --warn:#ffb84d;
    --alert:#ff5d5d;
    --text:#eef0f7;
    --text-dim:#7a7a92;
    --font:'Poppins','Segoe UI',sans-serif;
    --mono:'JetBrains Mono','Courier New',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:var(--font);position:fixed;inset:0;overscroll-behavior:none;}
body{touch-action:pan-x pan-y;-webkit-user-select:none;user-select:none;}
#player-wrapper{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;background:#000;contain:layout paint;}
#player{position:absolute;inset:0;width:100%!important;height:100%!important;touch-action:manipulation;}
#player video,.jw-video{width:100%!important;height:100%!important;object-fit:fill!important;touch-action:manipulation!important;-webkit-user-select:none;user-select:none;}
video::-webkit-media-controls{display:none!important;}
.jw-skin-glow .jw-display-icon-container{background:rgba(167,139,250,.10)!important;border:1px solid rgba(167,139,250,.4);backdrop-filter:none!important;-webkit-backdrop-filter:none!important;}
.jw-skin-glow .jw-button-color{color:#fff!important;}
.jw-skin-glow .jw-controlbar{background:linear-gradient(0deg,rgba(0,0,0,.75),transparent)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;}
.jw-skin-glow .jw-slider-time .jw-progress{background:var(--grad-b)!important;}
.jw-skin-glow .jw-knob{background:var(--grad-b)!important;}
.jw-video.jw-reset{object-fit:fill!important;}
#loader{position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 40%,var(--bg-2) 0%,var(--bg-1) 70%);display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:99;transition:opacity .1s ease,visibility .1s ease;pointer-events:none;}
#loader.hide-now{opacity:0!important;visibility:hidden!important;pointer-events:none!important;}
.tuner{display:flex;flex-direction:column;align-items:center;gap:20px;}
.tv-wrap{position:relative;width:78px;height:78px;display:flex;align-items:center;justify-content:center;}
.tv-glow{position:absolute;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,.35),transparent 70%);animation:glow-pulse 2.4s ease-in-out infinite;}
@keyframes glow-pulse{0%,100%{transform:scale(.85);opacity:.5}50%{transform:scale(1.15);opacity:1}}
.tv-icon{position:relative;width:60px;height:60px;}
.tv-icon .tv-body{fill:none;stroke:var(--text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.tv-icon .screen-bars rect{transform-origin:bottom;animation:bar-flicker 1.6s ease-in-out infinite;}
.tv-icon .screen-bars rect:nth-child(1){fill:var(--grad-a);animation-delay:-1.2s}
.tv-icon .screen-bars rect:nth-child(2){fill:var(--grad-b);animation-delay:-.9s}
.tv-icon .screen-bars rect:nth-child(3){fill:var(--grad-c);animation-delay:-.6s}
.tv-icon .screen-bars rect:nth-child(4){fill:var(--grad-b);animation-delay:-.3s}
.tv-icon .screen-bars rect:nth-child(5){fill:var(--grad-a);animation-delay:0s}
@keyframes bar-flicker{0%,100%{transform:scaleY(.45);opacity:.65}50%{transform:scaleY(1);opacity:1}}
.brand-name{font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:linear-gradient(90deg,var(--grad-a),var(--grad-b));-webkit-background-clip:text;background-clip:text;color:transparent;}
.brand-name b{color:var(--text);-webkit-text-fill-color:var(--text);}
.dots{display:flex;gap:6px;}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--grad-b);animation:dot-pulse 1.2s ease-in-out infinite;}
.dots span:nth-child(1){animation-delay:0s}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes dot-pulse{0%,80%,100%{transform:scale(.6);opacity:.35}40%{transform:scale(1);opacity:1}}
.status-line{font-family:var(--mono);font-size:9.5px;letter-spacing:2.5px;color:var(--text-dim);text-transform:uppercase;}
.state-content{text-align:center;color:var(--text);z-index:100;padding:0 24px;font-family:var(--font);pointer-events:auto;}
.state-content .glyph{font-size:34px;color:var(--alert);margin-bottom:14px;line-height:1;}
.state-content .glyph.warn{color:var(--warn);}
.state-content p.title{font-size:13px;letter-spacing:1px;font-weight:600;}
.state-content p.sub{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);margin-top:8px;letter-spacing:.5px;max-width:280px;overflow-wrap:anywhere;}
.state-content .brand-name{display:block;margin-top:18px;}
.retry-btn{margin-top:16px;padding:8px 20px;font-family:var(--font);font-weight:600;font-size:11px;letter-spacing:.5px;color:#0a0a12;background:linear-gradient(90deg,var(--grad-a),var(--grad-b));border:none;border-radius:18px;cursor:pointer;touch-action:manipulation;}
.retry-btn:active{transform:scale(.96);}
.jwplayer.jw-flag-fullscreen,.jwplayer.jw-flag-fullscreen .jw-media,.jwplayer.jw-flag-fullscreen video{width:100%!important;height:100%!important;}
.jwplayer.jw-flag-fullscreen video{object-fit:fill!important;}
.jwplayer,.jw-media,.jw-video{transform:none!important;filter:none!important;will-change:auto!important;}
#player-wrapper:fullscreen{width:100vw;height:100vh;background:#000;}
#player-wrapper:-webkit-full-screen{width:100vw;height:100vh;background:#000;}
#player-wrapper:fullscreen #player,#player-wrapper:-webkit-full-screen #player{width:100%!important;height:100%!important;}
#hardBlockScreen{display:none;position:fixed;inset:0;background:#06060c;z-index:99999999;align-items:center;justify-content:center;text-align:center;padding:30px;}
</style>
</head>
<body>

<div id="hardBlockScreen"><div><div style="font-size:60px">🔒</div><h2 style="color:#fff;margin:14px 0 8px;font-size:22px;font-weight:900">Security Alert</h2><p style="color:#999;font-size:14px;line-height:1.6">DevTools / Inspect বন্ধ করে<br>আবার ঢুকো<br>RS Live TV Protected</p><button onclick="location.reload()" style="margin-top:18px;padding:12px 28px;border:none;border-radius:12px;background:linear-gradient(135deg,#22d3ee,#a78bfa);font-weight:800;cursor:pointer">🔄 Reload</button></div></div>

<div id="player-wrapper">
<div id="loader">
    <div class="tuner">
        <div class="tv-wrap">
            <div class="tv-glow"></div>
            <svg class="tv-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <path class="tv-body" d="M22 12 32 20 42 12"/>
                <clipPath id="screenClip"><rect x="12" y="20" width="40" height="26" rx="4"/></clipPath>
                <g class="screen-bars" clip-path="url(#screenClip)">
                    <rect x="12" y="20" width="8" height="26"/>
                    <rect x="20" y="20" width="8" height="26"/>
                    <rect x="28" y="20" width="8" height="26"/>
                    <rect x="36" y="20" width="8" height="26"/>
                    <rect x="44" y="20" width="8" height="26"/>
                </g>
                <rect class="tv-body" x="12" y="20" width="40" height="26" rx="4"/>
                <line class="tv-body" x1="24" y1="46" x2="24" y2="50"/>
                <line class="tv-body" x1="40" y1="46" x2="40" y2="50"/>
                <line class="tv-body" x1="20" y1="50" x2="44" y2="50"/>
            </svg>
        </div>
        <div class="brand-name"><b>RS LIVE</b> TV</div>
        <div class="dots"><span></span><span></span><span></span></div>
        <div class="status-line" id="status-line">LOADING</div>
    </div>
</div>
<div id="player"></div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const streamSource = urlParams.get('url');
const forcedType = (urlParams.get('type') || '').toLowerCase();
const startMuted = urlParams.get('mute') === '1';
const loaderEl = document.getElementById('loader');
const statusEl = document.getElementById('status-line');
const wrapper = document.getElementById('player-wrapper');
const statusMessages = ['LOADING','CONNECTING','BUFFERING'];
let statusIdx = 0;
let statusTimer = setInterval(() => {
    if(loaderEl.classList.contains('hide-now')) return;
    statusIdx = (statusIdx + 1) % statusMessages.length;
    statusEl.textContent = statusMessages[statusIdx];
},1800);
function showLoader(){ loaderEl.classList.remove('hide-now'); }
function hideLoader(){ loaderEl.classList.add('hide-now'); }
function showState(html){ clearInterval(statusTimer); loaderEl.innerHTML = html; showLoader(); }
function brandBlock(){ return `<div class="brand-name"><b>RS LIVE</b> TV</div>`; }
let wakeLock = null;
let wakeLockWanted = false;
async function requestWakeLock(){
    wakeLockWanted = true;
    if(!('wakeLock' in navigator)) return;
    if(wakeLock) return;
    if(document.visibilityState !== 'visible') return;
    try{ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release',() => { wakeLock = null; }); }catch(e){ wakeLock = null; }
}
async function releaseWakeLock(){
    wakeLockWanted = false;
    if(wakeLock){ try{ await wakeLock.release(); }catch(e){} wakeLock = null; }
}
document.addEventListener('visibilitychange',() => {
    if(document.visibilityState === 'visible' && wakeLockWanted){ requestWakeLock(); }
});
function detectType(raw){
    if(forcedType) return forcedType;
    const clean = raw.split('?')[0].split('#')[0].toLowerCase();
    if(clean.endsWith('.m3u8')) return 'hls';
    if(clean.endsWith('.mpd')) return 'dash';
    if(clean.endsWith('.mp4')) return 'mp4';
    if(clean.endsWith('.webm')) return 'webm';
    if(clean.endsWith('.mov')) return 'mp4';
    if(clean.endsWith('.ogg') || clean.endsWith('.ogv')) return 'ogg';
    if(raw.includes('.m3u8')) return 'hls';
    if(raw.includes('.mpd')) return 'dash';
    return null;
}
if(!streamSource){
    showState(`<div class="state-content"><div class="glyph warn"><i>&#9888;</i></div><p class="title">No stream URL supplied</p><p class="sub">Add ?url=YOUR_STREAM_LINK to this page's address.</p>${brandBlock()}</div>`);
}else{
    const streamType = detectType(streamSource);
    const playlistItem = { file:streamSource };
    if(streamType){ playlistItem.type = streamType; }
    const player = jwplayer('player').setup({
        playlist:[playlistItem],
        width:'100%', height:'100%',
        autostart:true, mute:startMuted, preload:'auto',
        stretching:'uniform', liveTimeout:0,
        skin:{ name:'glow' },
        displaytitle:false, displaydescription:false,
        controls:true, repeat:false
    });
    let retryCount = 0;
    const maxRetries = 6;
    let retryTimer = null;
    let everPlayed = false;
    let userPaused = false;
    const NO_STREAM_TIMEOUT = 12000;
    let noStreamTimer = setTimeout(() => { if(!everPlayed){ showNoStreamState(); } },NO_STREAM_TIMEOUT);
    function applyVideoStyle(){
        const video = document.querySelector('#player video');
        if(video){ video.style.width = '100%'; video.style.height = '100%'; video.style.objectFit = 'fill'; video.style.touchAction = 'manipulation'; video.setAttribute('playsinline',''); }
    }
    player.on('ready',() => { applyVideoStyle(); });
    player.on('firstFrame',() => { clearInterval(statusTimer); clearTimeout(noStreamTimer); hideLoader(); everPlayed = true; retryCount = 0; });
    player.on('play',() => { clearTimeout(noStreamTimer); everPlayed = true; hideLoader(); retryCount = 0; requestWakeLock(); });
    player.on('pause',() => { userPaused = true; releaseWakeLock(); });
    player.on('complete',() => { releaseWakeLock(); });
    player.on('buffer',() => {});
    player.on('idle',() => {});
    let landscapeLocked = false;
    async function lockLandscape(){
        try{ if(screen.orientation && typeof screen.orientation.lock === 'function'){ await screen.orientation.lock('landscape'); landscapeLocked = true; } }catch(error){ landscapeLocked = false; }
    }
    function unlockLandscape(){
        try{ if(screen.orientation && typeof screen.orientation.unlock === 'function'){ screen.orientation.unlock(); } }catch(error){}
        landscapeLocked = false;
    }
    player.on('fullscreen',(evt) => {
        const isFullscreen = evt && evt.fullscreen;
        if(isFullscreen){ lockLandscape(); }else{ unlockLandscape(); }
        requestAnimationFrame(() => { applyVideoStyle(); });
    });
    document.addEventListener('fullscreenchange',() => {
        if(document.fullscreenElement){ lockLandscape(); }else if(!player.getFullscreen()){ unlockLandscape(); }
        requestAnimationFrame(() => { applyVideoStyle(); });
    });
    document.addEventListener('webkitfullscreenchange',() => {
        if(document.webkitFullscreenElement){ lockLandscape(); }else{ unlockLandscape(); }
        requestAnimationFrame(() => { applyVideoStyle(); });
    });
    if(screen.orientation){
        screen.orientation.addEventListener('change',() => {
            if(player.getFullscreen() || document.fullscreenElement){ requestAnimationFrame(() => { applyVideoStyle(); }); }
        });
    }
    player.on('error',handleFault);
    player.on('setupError',handleFault);
    function handleFault(err){
        if(userPaused) return;
        if(!everPlayed){
            clearTimeout(retryTimer);
            retryTimer = setTimeout(() => { try{ player.load([playlistItem]); player.play(true); }catch(e){} },900);
            return;
        }
        if(retryCount < maxRetries){
            retryCount++;
            statusEl.textContent = 'RECONNECTING (' + retryCount + '/' + maxRetries + ')';
            showLoader();
            clearTimeout(retryTimer);
            retryTimer = setTimeout(() => { try{ player.load([playlistItem]); player.play(true); }catch(e){} }, Math.min(1000 * retryCount,4000));
            return;
        }
        showNoStreamState(err);
    }
    function showNoStreamState(err){
        clearTimeout(retryTimer); clearTimeout(noStreamTimer); releaseWakeLock();
        showState(`<div class="state-content"><div class="glyph"><i>&#10060;</i></div><p class="title">No streaming — this link won't play</p><p class="sub">${err && err.message ? err.message : 'The source could not be reached.'}</p><button class="retry-btn" onclick="location.reload()">Retry</button>${brandBlock()}</div>`);
    }
    const playerBox = document.getElementById('player');
    if(playerBox){ playerBox.addEventListener('contextmenu', e => { e.preventDefault(); }, {passive:false}); }
    const observer = new MutationObserver(() => { applyVideoStyle(); });
    observer.observe(document.getElementById('player'), { childList:true, subtree:true });
}
</script>

<!-- ===== HARD SECURITY - RS PLAYER ===== -->
<script>
(function(){
"use strict";
if(window.top !== window.self){
  try{ if(window.top.location.hostname !== window.self.location.hostname){ document.documentElement.innerHTML=''; return; } }catch(e){}
}
var blocked = false;
function hardBlock(){
  if(blocked) return; blocked = true;
  var b = document.getElementById('hardBlockScreen');
  if(b){ b.style.display='flex'; }
  try{ if(window.jwplayer){ var p = jwplayer('player'); if(p && p.stop) p.stop(); } }catch(e){}
  try{ var v = document.querySelector('#player video'); if(v){ v.pause(); v.removeAttribute('src'); v.load(); } }catch(e){}
}
document.addEventListener('contextmenu', function(e){ e.preventDefault(); return false; }, true);
document.addEventListener('copy', function(e){ e.preventDefault(); return false; }, true);
document.addEventListener('cut', function(e){ e.preventDefault(); return false; }, true);
document.addEventListener('dragstart', function(e){ e.preventDefault(); return false; }, true);
document.addEventListener('selectstart', function(e){ e.preventDefault(); return false; }, true);
document.addEventListener('keydown', function(e){
  var k = (e.key||'').toUpperCase();
  var code = e.keyCode || e.which;
  if(code===123 || k==='F12'){ e.preventDefault(); e.stopPropagation(); hardBlock(); return false; }
  if((e.ctrlKey||e.metaKey) && ['U','S','P','C','A','F'].indexOf(k)!==-1){ e.preventDefault(); e.stopPropagation(); return false; }
  if((e.ctrlKey||e.metaKey) && e.shiftKey && ['I','J','C','K'].indexOf(k)!==-1){ e.preventDefault(); e.stopPropagation(); hardBlock(); return false; }
  if(e.metaKey && ['U','S','I'].indexOf(k)!==-1){ e.preventDefault(); e.stopPropagation(); return false; }
}, true);
document.addEventListener('keyup', function(e){ if(e.keyCode===123){ hardBlock(); } }, true);
setInterval(function(){
  try{
    var w = window.outerWidth - window.innerWidth > 160;
    var h = window.outerHeight - window.innerHeight > 160;
    if(w || h) hardBlock();
  }catch(e){}
}, 800);
setInterval(function(){
  try{
    var start = Date.now();
    (function(){ return false; })['constructor']('debugger')['call']();
    if(Date.now() - start > 100) hardBlock();
  }catch(e){ hardBlock(); }
}, 1500);
try{ console.clear(); setInterval(function(){ try{ console.clear(); }catch(e){} }, 2000); console.log('%cSTOP! %cRS Live TV Protected', 'color:red;font-size:28px;font-weight:bold', 'color:#fff;font-size:14px'); }catch(e){}
document.addEventListener('touchstart', function(e){ if(e.touches && e.touches.length>1){ e.preventDefault(); } }, {passive:false});
})();
</script>

</body>
