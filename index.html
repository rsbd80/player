<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>RS Player Pro</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.0/shaka-player.compiled.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Poppins','Segoe UI',sans-serif;position:fixed;inset:0}
#player-wrapper{position:fixed;inset:0;width:100%;height:100%;background:#000}
#player{position:absolute;inset:0;width:100%!important;height:100%!important}
#player video{width:100%!important;height:100%!important;object-fit:fill!important}
#loader{position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 40%,#14101f 0%,#0a0a12 70%);display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:99;transition:opacity .2s;pointer-events:none}
#loader.hide-now{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
.brand-name{font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:linear-gradient(90deg,#22d3ee,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-name b{color:#fff;-webkit-text-fill-color:#fff}
.dots{display:flex;gap:6px;margin-top:18px}.dots span{width:6px;height:6px;border-radius:50%;background:#a78bfa;animation:p 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes p{0%,80%,100%{transform:scale(.6);opacity:.35}40%{transform:scale(1);opacity:1}}
.status-line{font-family:monospace;font-size:10px;letter-spacing:2.5px;color:#7a7a92;margin-top:12px;text-transform:uppercase}
.state-content{text-align:center;color:#eef0f7;padding:0 24px;pointer-events:auto}
.state-content .glyph{font-size:34px;margin-bottom:14px}
.state-content .glyph.red{color:#ff5d5d}.state-content .glyph.warn{color:#ffb84d}
.state-content p.title{font-size:13px;font-weight:600;letter-spacing:1px}
.state-content p.sub{font-family:monospace;font-size:11px;color:#7a7a92;margin-top:8px;max-width:320px;overflow-wrap:anywhere;line-height:1.5}
.state-content .brand-name{display:block;margin-top:18px}
.retry-btn{margin-top:16px;padding:8px 20px;font-weight:600;font-size:11px;color:#0a0a12;background:linear-gradient(90deg,#22d3ee,#a78bfa);border:none;border-radius:18px;cursor:pointer}
#controls{position:absolute;bottom:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:10px;padding:14px;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);opacity:0;transition:opacity .3s}
#player-wrapper.show-controls #controls{opacity:1}
#controls button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);color:#fff;width:42px;height:42px;border-radius:50%;font-size:16px;cursor:pointer}
#seek{flex:1;-webkit-appearance:none;height:4px;background:rgba(255,255,255,.3);border-radius:4px;outline:none}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#a78bfa}
#time-label{font-family:monospace;font-size:11px;color:#fff;white-space:nowrap}
#debug{position:absolute;top:8px;left:8px;z-index:60;background:rgba(0,0,0,.7);color:#7CFC00;font-family:monospace;font-size:10px;padding:6px 8px;border-radius:6px;max-width:92%;display:none;line-height:1.5}
</style>
</head>
<body>
<div id="player-wrapper">
<div id="debug"></div>
<div id="loader"><div style="font-size:48px">📺</div><div class="brand-name" style="margin-top:16px"><b>RS LIVE</b> TV</div><div class="dots"><span></span><span></span><span></span></div><div class="status-line" id="status-line">LOADING</div></div>
<div id="player"></div>
<div id="controls"><button id="playBtn">▶</button><input type="range" id="seek" value="0" min="0" max="100"><span id="time-label">LIVE</span><button id="fsBtn">⛶</button></div>
</div>
<script>
// ✅ URLSearchParams নিজেই decode করে, তাই আবার decode করা যাবে না
const urlParams = new URLSearchParams(window.location.search);
let streamSource = (urlParams.get('url') || '').trim();
let keyParam = (urlParams.get('key') || urlParams.get('license_key') || urlParams.get('clearkey') || urlParams.get('license') || '').trim();
const debugMode = urlParams.get('debug') === '1';
const loaderEl = document.getElementById('loader');
const statusEl = document.getElementById('status-line');
const wrapper = document.getElementById('player-wrapper');
const playBtn = document.getElementById('playBtn');
const fsBtn = document.getElementById('fsBtn');
const debugEl = document.getElementById('debug');
function dbg(m){ if(debugMode){ debugEl.style.display='block'; debugEl.innerHTML += m + '<br>'; } console.log('[RS]', m); }
function hideLoader(){ loaderEl.classList.add('hide-now'); }
function showLoader(){ loaderEl.classList.remove('hide-now'); }
function showState(html){ loaderEl.innerHTML = html; showLoader(); }
function brandBlock(){ return `<div class="brand-name"><b>RS LIVE</b> TV</div>`; }
let hideCtrlTimer=null;
function showControls(){ wrapper.classList.add('show-controls'); clearTimeout(hideCtrlTimer); hideCtrlTimer=setTimeout(()=>wrapper.classList.remove('show-controls'),3000); }
wrapper.addEventListener('click',showControls); wrapper.addEventListener('touchstart',showControls,{passive:true}); wrapper.addEventListener('mousemove',showControls);

dbg('URL: ' + streamSource.slice(0,90));
dbg('KEY: ' + (keyParam ? 'YES len='+keyParam.length : 'NO'));

if(!streamSource){
  showState(`<div class="state-content"><div class="glyph warn">⚠️</div><p class="title">No stream URL</p><p class="sub">Add ?url=YOUR_LINK to address</p>${brandBlock()}</div>`);
} else {
  const video = document.createElement('video');
  video.setAttribute('playsinline',''); video.setAttribute('webkit-playsinline','');
  video.muted=false; video.autoplay=true; video.controls=false;
  video.style.cssText='width:100%;height:100%;object-fit:fill;background:#000';
  document.getElementById('player').appendChild(video);
  let hls=null, shakaPlayer=null, everPlayed=false;

  function parseClearKey(k){
    if(!k) return null; k=k.trim();
    // {"kid":"key"} ফরম্যাট
    if(k.startsWith('{')){ try{ const o=JSON.parse(k); const kid=Object.keys(o)[0]; return {[kid]:o[kid]}; }catch(e){} }
    // kid:key ফরম্যাট - প্রথম : থেকে ভাগ করো
    if(k.includes(':')){ const i=k.indexOf(':'); const kid=k.slice(0,i).trim(); const key=k.slice(i+1).trim(); if(kid.length>=16 && key.length>=16) return {[kid]:key}; }
    return null;
  }

  // ✅ FIX: .mpd না থাকলেও cenc / otte / dash থাকলে MPD ধরো
  function isMPD(u){
    const low = u.toLowerCase();
    return low.includes('.mpd') || low.includes('cenc') || low.includes('otte') || low.includes('/dash') || low.includes('mpd');
  }
  // ✅ FIX: Proxy শুধু MPD এর জন্য, HLS এর জন্য কখনোই না
  function shouldProxy(u){
    if(u.toLowerCase().includes('.m3u8')) return false;
    if(u.startsWith('/proxy')) return false;
    return isMPD(u) && (u.includes('otte') || u.includes('aiv-cdn') || u.includes('cenc') || u.includes('.mpd'));
  }
  function toProxyUrl(u){ return '/proxy?url=' + encodeURIComponent(u); }

  function showError(title, sub){
    showState(`<div class="state-content"><div class="glyph red">❌</div><p class="title">${title}</p><p class="sub">${sub}</p><button class="retry-btn" onclick="location.reload()">Retry</button>${brandBlock()}</div>`);
  }

  function loadMPD(url){
    dbg('TYPE: MPD / Shaka');
    if(hls){ try{hls.destroy();}catch(e){} hls=null; }
    if(shakaPlayer){ try{shakaPlayer.destroy();}catch(e){} shakaPlayer=null; }
    if(!window.shaka){ showError('Shaka Load হয় নাই','নেট চেক করো'); return; }
    shaka.polyfill.installAll();
    if(!shaka.Player.isBrowserSupported()){ showError('Browser DASH সাপোর্ট করে না','Chrome দিয়ে খুলো'); return; }
    shakaPlayer = new shaka.Player(video);
    // ✅ MPD এর ভিতরের MPD + Segment সব Proxy দিয়ে যাবে
    const net = shakaPlayer.getNetworkingEngine();
    net.registerRequestFilter((type, request) => {
      if(shouldProxy(request.uris[0])){
        request.uris[0] = toProxyUrl(request.uris[0]);
      }
    });
    const clearKeys = parseClearKey(keyParam);
    if(clearKeys){
      shakaPlayer.configure({ drm:{ clearKeys: clearKeys } });
      dbg('Clearkey OK');
    } else {
      // MPD কিন্তু চাবি নাই - সাথে সাথে জানাও, ৩০ সেকেন্ড LOADING দেখাইও না
      if(isMPD(url)){
        dbg('NO KEY - MPD চাবি ছাড়া চলবে না');
        showError('Clearkey পাওয়া যায় নাই','index.html থেকে &key=KID:KEY পাঠাতে হবে। M3U তে license_key= আছে কিনা চেক করো।');
        return;
      }
    }
    shakaPlayer.configure({ streaming:{ retryParameters:{ maxAttempts:2, baseDelay:1000 } } });
    shakaPlayer.addEventListener('error', (e)=>{
      const err = e.detail;
      dbg('SHAKA ERR: ' + err.code + ' ' + (err.message||''));
      if(!everPlayed) showError('Shaka Error ' + err.code, err.message || 'Source blocked / Key ভুল');
    });
    const firstUrl = shouldProxy(url) ? toProxyUrl(url) : url;
    dbg('Loading MPD via: ' + (firstUrl.startsWith('/proxy') ? 'PROXY' : 'DIRECT'));
    shakaPlayer.load(firstUrl).then(()=>{
      hideLoader(); everPlayed=true; video.play().catch(()=>{});
    }).catch((err)=>{
      dbg('LOAD FAIL: ' + err.code + ' ' + err.message);
      if(!everPlayed) showError('Load Fail ' + err.code, err.message);
    });
  }

  function loadHLS(url){
    dbg('TYPE: HLS');
    if(shakaPlayer){ try{shakaPlayer.destroy();}catch(e){} shakaPlayer=null; }
    if(hls){ try{hls.destroy();}catch(e){} hls=null; }
    video.removeAttribute('src'); video.load();
    // ✅ HLS সরাসরি যাবে, Proxy দিয়ে না - Proxy দিলেই manifestLoadError আসে
    const finalUrl = url;
    dbg('Loading HLS DIRECT');
    if(window.Hls && Hls.isSupported()){
      hls = new Hls({ maxBufferLength:30, maxMaxBufferLength:60, enableWorker:true, lowLatencyMode:true });
      hls.loadSource(finalUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, ()=>{ video.play().catch(()=>{}); });
      hls.on(Hls.Events.ERROR, (e,data)=>{
        dbg('HLS ERR: ' + data.details);
        if(!data.fatal) return;
        if(data.type===Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
        else if(data.type===Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
        else if(!everPlayed) showError('HLS Error', data.details + '<br>লিংকটা মারা গেছে বা সার্ভার ব্লক করছে।');
      });
    } else if(video.canPlayType('application/vnd.apple.mpegurl')){
      video.src = finalUrl; video.play().catch(()=>{});
    } else {
      showError('Browser HLS সাপোর্ট করে না','Chrome দিয়ে খুলো');
    }
  }

  video.addEventListener('playing',()=>{ hideLoader(); everPlayed=true; });
  video.addEventListener('pause',()=>{ playBtn.textContent='▶'; });
  video.addEventListener('play',()=>{ playBtn.textContent='❚❚'; });
  playBtn.addEventListener('click',(e)=>{ e.stopPropagation(); if(video.paused) video.play(); else video.pause(); showControls(); });
  fsBtn.addEventListener('click',(e)=>{ e.stopPropagation(); if(document.fullscreenElement) document.exitFullscreen(); else wrapper.requestFullscreen().catch(()=>{}); showControls(); });
  async function lockLandscape(){ try{ if(screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); }catch(e){} }
  function unlockLandscape(){ try{ if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }catch(e){} }
  document.addEventListener('fullscreenchange',()=>{ if(document.fullscreenElement) lockLandscape(); else unlockLandscape(); });

  // ✅ আসল ফিক্স: .mpd না থাকলেও MPD চিনবে
  if(isMPD(streamSource)) loadMPD(streamSource);
  else loadHLS(streamSource);
}
</script>
</body>
</html>
