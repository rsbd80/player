
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="referrer" content="no-referrer">

<title>RS Player Pro</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080808;
  font-family:Arial,Helvetica,sans-serif;
}

#player-container{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  background:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

video.fit-fill{
  object-fit:fill!important;
}

video.fit-zoom{
  object-fit:cover!important;
}

/* =================================
   SMALL LOADER INSIDE VIDEO
================================= */

#rs-loader{
  position:absolute;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  pointer-events:none;
  opacity:1;
  visibility:visible;
  transition:opacity .25s,visibility .25s;
}

#rs-loader.hide{
  opacity:0;
  visibility:hidden;
}

.loader-content{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.72);
  padding:13px 20px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.08);
}

.loader-logo{
  width:34px;
  height:34px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.15);
  border-top-color:#ff3030;
  border-right-color:#ff3030;
  animation:spin .8s linear infinite;
}

.logo-text,
.loader-subtitle,
.loader-footer,
.loader-bars{
  display:none!important;
}

.loader-title{
  margin-top:9px;
  font-size:13px;
  font-weight:900;
  letter-spacing:1px;
  color:#fff;
  white-space:nowrap;
}

.loader-title span{
  color:#ff3030;
}

#loader-message{
  margin-top:5px;
  color:#bbb;
  font-size:10px;
  white-space:nowrap;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* =================================
   STATUS
================================= */

#status{
  position:fixed;
  top:max(12px,env(safe-area-inset-top));
  right:12px;
  z-index:9999;

  display:flex;
  align-items:center;
  gap:7px;

  padding:7px 11px;
  border-radius:30px;

  background:rgba(15,15,15,.85);
  border:1px solid rgba(255,255,255,.10);

  color:#ddd;
  font-size:11px;
  font-weight:600;

  opacity:0;
  transform:translateY(-8px);
  transition:.25s;
  pointer-events:none;

  backdrop-filter:blur(12px);
}

#status.show{
  opacity:1;
  transform:translateY(0);
}

.dot{
  width:7px;
  height:7px;
  background:#38bdf8;
  border-radius:50%;
  flex-shrink:0;
}

#status.live .dot{
  background:#22c55e;
  animation:pulse 1.5s infinite;
}

#status.loading .dot{
  background:#fbbf24;
  animation:pulse 1s infinite;
}

#status.error .dot{
  background:#ef4444;
}

@keyframes pulse{
  50%{
    opacity:.35;
    transform:scale(.65);
  }
}

/* =================================
   FIT BUTTON
================================= */

.fit-btn{
  border:0!important;
  background:transparent!important;
  color:white!important;
  min-width:42px!important;
  width:auto!important;
  height:40px!important;
  padding:0 5px!important;
  cursor:pointer!important;
  display:flex!important;
  justify-content:center!important;
  align-items:center!important;
  flex-shrink:0!important;
}

.fit-label{
  border:1px solid #555;
  border-radius:5px;
  padding:4px 6px;
  font-size:10px;
  font-weight:800;
  color:#ddd;
  white-space:nowrap;
}

.fit-btn.fill .fit-label{
  border-color:#38bdf8;
  color:#38bdf8;
}

.fit-btn.zoom .fit-label{
  border-color:#a78bfa;
  color:#a78bfa;
}

/* =================================
   SHAKA CONTROLS
================================= */

.shaka-video-container{
  background:#000!important;
  width:100%!important;
  height:100%!important;
}

.shaka-controls-container{
  z-index:10!important;
}

.shaka-controls-container button{
  color:#fff!important;
}

.shaka-controls-button-panel{
  display:flex!important;
  flex-direction:row!important;
  align-items:center!important;
  flex-wrap:nowrap!important;
  width:100%!important;
  overflow:visible!important;
}

.shaka-controls-button-panel>button{
  flex:0 0 auto!important;
  position:relative!important;
  margin:0!important;
}

/* Play/Pause fixed position */

.shaka-play-pause-button{
  flex:0 0 40px!important;
  width:40px!important;
  min-width:40px!important;
  max-width:40px!important;
  position:relative!important;
  transform:none!important;
}

/* Volume */

.shaka-mute-button{
  flex-shrink:0!important;
}

.shaka-volume-bar-container{
  flex-shrink:0!important;
}

/* Spacer */

.shaka-spacer{
  flex:1 1 auto!important;
  min-width:0!important;
}

.shaka-spinner-container{
  background:transparent!important;
}

/* Big play button */

.shaka-play-button-container{
  z-index:20!important;
}

/* =================================
   FULLSCREEN
================================= */

#player-container:fullscreen,
#player-container:-webkit-full-screen{
  width:100vw!important;
  height:100vh!important;
  background:#000!important;
  overflow:hidden!important;
}

#player-container:fullscreen video,
#player-container:-webkit-full-screen video{
  width:100%!important;
  height:100%!important;
}

/* Mobile */

@media(max-width:480px){

  #status{
    top:10px;
    right:10px;
    font-size:10px;
    padding:6px 9px;
  }

  .fit-label{
    font-size:9px;
    padding:3px 5px;
  }

  .shaka-play-pause-button{
    flex:0 0 36px!important;
    width:36px!important;
    min-width:36px!important;
    max-width:36px!important;
  }

  .loader-content{
    padding:11px 16px;
  }

  .loader-logo{
    width:29px;
    height:29px;
  }

  .loader-title{
    font-size:12px;
  }

  #loader-message{
    font-size:9px;
  }

}
</style>
</head>

<body>

<div id="player-container">

  <video
    id="video"
    autoplay
    muted
    playsinline
    preload="metadata">
  </video>

  <!-- SMALL RS LOADER -->

  <div id="rs-loader">

    <div class="loader-content">

      <div class="loader-logo"></div>

      <div class="loader-title">
        RS <span>LIVE TV</span>
      </div>

      <div id="loader-message">
        Connecting...
      </div>

    </div>

  </div>

</div>

<div id="status">
  <span class="dot"></span>
  <span id="statusText">Ready</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>

<script>
(function(){

"use strict";

const video = document.getElementById("video");
const container = document.getElementById("player-container");
const status = document.getElementById("status");
const statusText = document.getElementById("statusText");
const loader = document.getElementById("rs-loader");
const loaderMessage = document.getElementById("loader-message");

let player;
let statusTimer;
let fitIndex = 0;
let previousFitIndex = 0;
let isFullscreen = false;
let fitButton = null;

const FIT_MODES = ["contain","fill","cover"];
const FIT_LABELS = ["FIT","FILL","ZOOM"];

/* STATUS */

function setStatus(text,type="loading",duration=4000){

  statusText.textContent=text;
  status.className="show "+type;

  clearTimeout(statusTimer);

  if(duration>0){

    statusTimer=setTimeout(()=>{
      status.classList.remove("show");
    },duration);

  }

}

/* LOADER */

function showLoader(message="Connecting..."){

  loaderMessage.textContent=message;
  loader.classList.remove("hide");

}

function hideLoader(){

  loader.classList.add("hide");

}

/* FIT */

function applyFit(){

  const mode=FIT_MODES[fitIndex];

  video.classList.remove("fit-fill","fit-zoom");

  if(fitButton){
    fitButton.classList.remove("fill","zoom");
  }

  if(mode==="fill"){

    video.classList.add("fit-fill");

    if(fitButton){
      fitButton.classList.add("fill");
    }

  }

  if(mode==="cover"){

    video.classList.add("fit-zoom");

    if(fitButton){
      fitButton.classList.add("zoom");
    }

  }

  if(fitButton){

    const label=fitButton.querySelector(".fit-label");

    if(label){
      label.textContent=FIT_LABELS[fitIndex];
    }

    fitButton.title="Video Mode: "+FIT_LABELS[fitIndex];

  }

}

/* FIT BUTTON */

function addFitButton(){

  const panel=document.querySelector(
    ".shaka-controls-button-panel"
  );

  if(!panel)return;

  if(panel.querySelector(".rs-fit-btn"))return;

  const fullscreenButton=panel.querySelector(
    ".shaka-fullscreen-button"
  );

  fitButton=document.createElement("button");

  fitButton.className="fit-btn rs-fit-btn";
  fitButton.title="Video Fit Mode";

  fitButton.innerHTML=
    '<span class="fit-label">FIT</span>';

  if(fullscreenButton){

    panel.insertBefore(
      fitButton,
      fullscreenButton
    );

  }else{

    panel.appendChild(fitButton);

  }

  fitButton.addEventListener("click",function(e){

    e.preventDefault();
    e.stopPropagation();

    fitIndex=(fitIndex+1)%FIT_MODES.length;

    applyFit();

  });

  applyFit();

}

/* FULLSCREEN DETECTION */

function checkFullscreen(){

  const nowFullscreen=
    !!document.fullscreenElement ||
    !!document.webkitFullscreenElement ||
    !!video.webkitDisplayingFullscreen;

  if(nowFullscreen && !isFullscreen){

    previousFitIndex=fitIndex;
    fitIndex=1;
    isFullscreen=true;

    applyFit();

  }

  else if(!nowFullscreen && isFullscreen){

    fitIndex=previousFitIndex;
    isFullscreen=false;

    applyFit();

  }

}

document.addEventListener(
  "fullscreenchange",
  checkFullscreen
);

document.addEventListener(
  "webkitfullscreenchange",
  checkFullscreen
);

/* iPhone fullscreen events */

video.addEventListener(
  "webkitbeginfullscreen",
  function(){

    if(!isFullscreen){

      previousFitIndex=fitIndex;
      fitIndex=1;
      isFullscreen=true;

      applyFit();

    }

  }
);

video.addEventListener(
  "webkitendfullscreen",
  function(){

    fitIndex=previousFitIndex;
    isFullscreen=false;

    applyFit();

  }
);

/* FULLSCREEN BUTTON FIX */

function fixFullscreenButton(){

  const btn=document.querySelector(
    ".shaka-fullscreen-button"
  );

  if(!btn || btn.dataset.rsFixed)return;

  btn.dataset.rsFixed="true";

  btn.addEventListener("click",async function(e){

    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();

    try{

      const currentlyFullscreen=
        !!document.fullscreenElement ||
        !!document.webkitFullscreenElement;

      if(currentlyFullscreen){

        if(document.exitFullscreen){

          await document.exitFullscreen();

        }else if(document.webkitExitFullscreen){

          document.webkitExitFullscreen();

        }

      }else{

        if(container.requestFullscreen){

          await container.requestFullscreen();

        }else if(container.webkitRequestFullscreen){

          container.webkitRequestFullscreen();

        }else if(video.webkitEnterFullscreen){

          video.webkitEnterFullscreen();

        }else{

          setStatus(
            "Fullscreen Not Supported",
            "error",
            3000
          );

        }

      }

    }catch(error){

      console.error("Fullscreen error:",error);

      setStatus(
        "Fullscreen Failed",
        "error",
        3000
      );

    }

  },true);

}

/* PLAYER INIT */

async function init(){

  showLoader("Initializing player...");

  shaka.polyfill.installAll();

  if(!shaka.Player.isBrowserSupported()){

    showLoader("Browser not supported");

    setStatus(
      "Browser Not Supported",
      "error",
      0
    );

    return;

  }

  try{

    player=new shaka.Player();

    await player.attach(video);

    const ui=new shaka.ui.Overlay(
      player,
      container,
      video
    );

    ui.configure({

      addBigPlayButton:true,

      controlPanelElements:[
        "play_pause",
        "mute",
        "volume",
        "time_and_duration",
        "spacer",
        "quality",
        "picture_in_picture",
        "fullscreen"
      ],

      seekBarColors:{
        base:"#555",
        buffered:"#777",
        played:"#ff3030"
      }

    });

    /* Add buttons */

    let tries=0;

    const buttonInterval=setInterval(()=>{

      addFitButton();
      fixFullscreenButton();

      tries++;

      if(
        document.querySelector(".rs-fit-btn") &&
        document.querySelector(".shaka-fullscreen-button")?.dataset.rsFixed
      ){

        clearInterval(buttonInterval);

      }

      if(tries>50){

        clearInterval(buttonInterval);

      }

    },200);

    /* Player Error */

    player.addEventListener("error",function(event){

      const error=event.detail;

      showLoader("Stream error...");

      setStatus(
        "Stream Error "+(error.code||""),
        "error",
        6000
      );

    });

    /* Playing */

    video.addEventListener("playing",function(){

      hideLoader();

      setStatus(
        "LIVE",
        "live",
        4000
      );

    });

    /* Buffering */

    video.addEventListener("waiting",function(){

      showLoader("Buffering...");

      setStatus(
        "Buffering...",
        "loading",
        0
      );

    });

    video.addEventListener("stalled",function(){

      showLoader("Reconnecting...");

    });

    /* Pause */

    video.addEventListener("pause",function(){

      if(!video.ended){

        hideLoader();

        setStatus(
          "Paused",
          "loading",
          2500
        );

      }

    });

    /* Play */

    video.addEventListener("play",function(){

      video.muted=false;

    });

    /* URL */

    const params=new URLSearchParams(
      window.location.search
    );

    const streamUrl=params.get("url");

    if(!streamUrl){

      hideLoader();

      setStatus(
        "Ready - No Stream URL",
        "loading",
        5000
      );

      return;

    }

    await loadStream(streamUrl);

  }catch(error){

    console.error(error);

    showLoader("Player initialization failed");

    setStatus(
      "Initialization Failed",
      "error",
      0
    );

  }

}

/* LOAD STREAM */

async function loadStream(url){

  try{

    showLoader("Connecting...");

    setStatus(
      "Connecting...",
      "loading",
      0
    );

    await player.load(url);

    showLoader("Starting video...");

    video.play().catch(()=>{

      video.muted=true;

      video.play().catch(()=>{

        showLoader("Tap Play to start");

      });

    });

  }catch(error){

    console.error("Player Error:",error);

    showLoader("Playback failed");

    setStatus(
      "Playback Failed",
      "error",
      0
    );

  }

}

/* START */

document.addEventListener(
  "DOMContentLoaded",
  init
);

})();
</script>

</body>
</html>
