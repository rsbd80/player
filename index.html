
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>RS Player Pro</title>

<!-- Shaka Player 4.16.2 -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.js"></script>

<style>
:root{
    --bg-1:#0a0a12;
    --bg-2:#14101f;
    --grad-a:#22d3ee;
    --grad-b:#a78bfa;
    --grad-c:#fb923c;
    --warn:#ffb84d;
    --alert:#ff5d5d;
    --text:#eef0f7;
    --text-dim:#7a7a92;
    --font:'Poppins','Segoe UI',sans-serif;
    --mono:'JetBrains Mono','Courier New',monospace;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:var(--font);
    position:fixed;
    inset:0;
    overscroll-behavior:none;
}

body{
    touch-action:pan-x pan-y;
}

#player-wrapper{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    contain:layout paint;
}

#video-container{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#video{
    width:100%!important;
    height:100%!important;
    object-fit:fill!important;
    background:#000;
    touch-action:manipulation;
    -webkit-user-select:none;
    user-select:none;
}

video::-webkit-media-controls{
    /* Native controls are retained for direct-file fallback */
}

.jwplayer{
    display:none!important;
}

/* SHAKA CONTROLS */

.shaka-video-container{
    width:100%!important;
    height:100%!important;
}

.shaka-controls-container{
    z-index:20!important;
}

.shaka-controls-container button{
    touch-action:manipulation;
}

.shaka-range-container input{
    accent-color:var(--grad-b);
}

.shaka-bottom-controls{
    padding-bottom:5px!important;
}

/* NATIVE VIDEO MODE */

#player-wrapper.native-mode video{
    object-fit:fill!important;
}

#player-wrapper.native-mode .shaka-controls-container{
    display:none!important;
}

#player-wrapper.native-mode video{
    touch-action:manipulation;
}

/* LOADER */

#loader{
    position:absolute;
    inset:0;
    background:radial-gradient(
        80% 60% at 50% 40%,
        var(--bg-2) 0%,
        var(--bg-1) 70%
    );
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:99;
    transition:opacity .1s ease,visibility .1s ease;
    pointer-events:none;
}

#loader.hide-now{
    opacity:0!important;
    visibility:hidden!important;
    pointer-events:none!important;
}

.tuner{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
}

.tv-wrap{
    position:relative;
    width:78px;
    height:78px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.tv-glow{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:radial-gradient(
        circle,
        rgba(167,139,250,.35),
        transparent 70%
    );
    animation:glow-pulse 2.4s ease-in-out infinite;
}

@keyframes glow-pulse{
    0%,100%{transform:scale(.85);opacity:.5}
    50%{transform:scale(1.15);opacity:1}
}

.tv-icon{
    position:relative;
    width:60px;
    height:60px;
}

.tv-icon .tv-body{
    fill:none;
    stroke:var(--text);
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.tv-icon .screen-bars rect{
    transform-origin:bottom;
    animation:bar-flicker 1.6s ease-in-out infinite;
}

.tv-icon .screen-bars rect:nth-child(1){fill:var(--grad-a);animation-delay:-1.2s}
.tv-icon .screen-bars rect:nth-child(2){fill:var(--grad-b);animation-delay:-.9s}
.tv-icon .screen-bars rect:nth-child(3){fill:var(--grad-c);animation-delay:-.6s}
.tv-icon .screen-bars rect:nth-child(4){fill:var(--grad-b);animation-delay:-.3s}
.tv-icon .screen-bars rect:nth-child(5){fill:var(--grad-a);animation-delay:0s}

@keyframes bar-flicker{
    0%,100%{transform:scaleY(.45);opacity:.65}
    50%{transform:scaleY(1);opacity:1}
}

.brand-name{
    font-size:15px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    background:linear-gradient(90deg,var(--grad-a),var(--grad-b));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.brand-name b{
    color:var(--text);
    -webkit-text-fill-color:var(--text);
}

.dots{
    display:flex;
    gap:6px;
}

.dots span{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--grad-b);
    animation:dot-pulse 1.2s ease-in-out infinite;
}

.dots span:nth-child(1){animation-delay:0s}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}

@keyframes dot-pulse{
    0%,80%,100%{transform:scale(.6);opacity:.35}
    40%{transform:scale(1);opacity:1}
}

.status-line{
    font-family:var(--mono);
    font-size:9.5px;
    letter-spacing:2.5px;
    color:var(--text-dim);
    text-transform:uppercase;
}

/* ERROR */

.state-content{
    text-align:center;
    color:var(--text);
    z-index:100;
    padding:0 24px;
    font-family:var(--font);
    pointer-events:auto;
}

.state-content .glyph{
    font-size:34px;
    color:var(--alert);
    margin-bottom:14px;
    line-height:1;
}

.state-content .glyph.warn{
    color:var(--warn);
}

.state-content p.title{
    font-size:13px;
    letter-spacing:1px;
    font-weight:600;
}

.state-content p.sub{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--text-dim);
    margin-top:8px;
    letter-spacing:.5px;
    max-width:280px;
    overflow-wrap:anywhere;
}

.state-content .brand-name{
    display:block;
    margin-top:18px;
}

.retry-btn{
    margin-top:16px;
    padding:8px 20px;
    font-family:var(--font);
    font-weight:600;
    font-size:11px;
    letter-spacing:.5px;
    color:#0a0a12;
    background:linear-gradient(90deg,var(--grad-a),var(--grad-b));
    border:none;
    border-radius:18px;
    cursor:pointer;
    touch-action:manipulation;
}

.retry-btn:active{
    transform:scale(.96);
}

/* DIRECT OVERLAY AD */

#ad-overlay{
    position:absolute;
    z-index:40;
    left:10px;
    right:10px;
    bottom:76px;
    max-width:540px;
    margin:auto;
    display:none;
    opacity:0;
    transform:translateY(10px);
    transition:opacity .25s ease,transform .25s ease;
    pointer-events:none;
}

#ad-overlay.ad-visible{
    display:block;
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
}

.ad-card{
    position:relative;
    display:flex;
    align-items:center;
    gap:10px;
    min-height:68px;
    padding:9px 38px 9px 10px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:11px;
    background:rgba(12,13,22,.94);
    box-shadow:0 5px 25px rgba(0,0,0,.45);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
}

.ad-link{
    display:flex;
    align-items:center;
    gap:10px;
    flex:1;
    min-width:0;
    color:#fff;
    text-decoration:none;
}

.ad-image{
    display:none;
    width:75px;
    height:50px;
    flex-shrink:0;
    object-fit:cover;
    border-radius:6px;
    background:#252536;
}

.ad-info{
    min-width:0;
    flex:1;
}

.ad-label{
    display:inline-block;
    font-size:8px;
    font-weight:700;
    letter-spacing:1px;
    color:#a78bfa;
    margin-bottom:3px;
}

.ad-title{
    color:#fff;
    font-size:11px;
    font-weight:700;
    line-height:1.4;
    overflow:hidden;
    text-overflow:ellipsis;
}

.ad-description{
    color:#b5b5c5;
    font-size:9px;
    margin-top:3px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.ad-cta{
    font-size:9px;
    color:#22d3ee;
    font-weight:700;
    white-space:nowrap;
    margin-left:5px;
}

.ad-close{
    position:absolute;
    top:5px;
    right:6px;
    width:25px;
    height:25px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.13);
    color:#fff;
    font-size:17px;
    line-height:25px;
    cursor:pointer;
    touch-action:manipulation;
}

.ad-close:active{
    transform:scale(.9);
}

.ad-timer{
    position:absolute;
    left:10px;
    bottom:-14px;
    font-size:8px;
    color:#ddd;
    font-family:var(--mono);
}

@media(max-width:420px){
    #ad-overlay{
        left:7px;
        right:7px;
        bottom:72px;
    }

    .ad-card{
        min-height:60px;
        padding:7px 34px 7px 8px;
    }

    .ad-image{
        width:62px;
        height:44px;
    }

    .ad-title{
        font-size:10px;
    }
}

/* FULLSCREEN */

#player-wrapper:fullscreen,
#player-wrapper:-webkit-full-screen{
    width:100vw;
    height:100vh;
    background:#000;
}

#player-wrapper:fullscreen #video-container,
#player-wrapper:-webkit-full-screen #video-container{
    width:100%;
    height:100%;
}

#player-wrapper:fullscreen #video,
#player-wrapper:-webkit-full-screen #video{
    width:100%!important;
    height:100%!important;
    object-fit:fill!important;
}

#player-wrapper:fullscreen #ad-overlay,
#player-wrapper:-webkit-full-screen #ad-overlay{
    bottom:85px;
}

/* TOUCH */

#video-container,
#video{
    -webkit-user-select:none;
    user-select:none;
}

</style>
</head>

<script>

/* =====================================
   RS LIVE TV PLAYER CONFIGURATION
===================================== */

/* STREAM URL SETTINGS */

const urlParams = new URLSearchParams(
    window.location.search
);

const streamSource = urlParams.get('url');

const forcedType = (
    urlParams.get('type') || ''
).toLowerCase();

const startMuted = urlParams.get('mute') === '1';


/* =====================================
   DIRECT AD CONFIGURATION
===================================== */

/*
   নিজের বিজ্ঞাপনের তথ্য এখানে বসাবে।

   imageUrl = বিজ্ঞাপনের ছবির লিংক
   clickUrl = বিজ্ঞাপনে ক্লিক করলে যে ওয়েবসাইট খুলবে
   enabled = true করলে বিজ্ঞাপন চালু হবে

   প্রথমে নিজের তথ্য বসিয়ে তারপর enabled true করবে।
*/

const AD_CONFIG = {

    enabled: false,

    imageUrl: "",

    clickUrl: "",

    title: "আপনার বিজ্ঞাপন এখানে",

    description: "বিস্তারিত জানতে ভিজিট করুন",

    ctaText: "VISIT →",

    showAfterMs: 5000,

    durationMs: 10000,

    oncePerSession: true

};


/* ELEMENTS */

const wrapper = document.getElementById(
    'player-wrapper'
);

const videoContainer = document.getElementById(
    'video-container'
);

const video = document.getElementById(
    'video'
);

const loaderEl = document.getElementById(
    'loader'
);

const statusEl = document.getElementById(
    'status-line'
);

const adOverlay = document.getElementById(
    'ad-overlay'
);


/* =====================================
   LOADER
===================================== */

const statusMessages = [
    'LOADING',
    'CONNECTING',
    'BUFFERING'
];

let statusIdx = 0;

let statusTimer = setInterval(() => {

    if(loaderEl.classList.contains('hide-now')){
        return;
    }

    statusIdx = (
        statusIdx + 1
    ) % statusMessages.length;

    statusEl.textContent =
        statusMessages[statusIdx];

},1800);


function showLoader(){

    loaderEl.classList.remove(
        'hide-now'
    );

}


function hideLoader(){

    loaderEl.classList.add(
        'hide-now'
    );

}


function showState(html){

    clearInterval(statusTimer);

    loaderEl.innerHTML = html;

    showLoader();

}


function brandBlock(){

    return `
        <div class="brand-name">
            <b>RS LIVE</b> TV
        </div>
    `;

}


/* =====================================
   WAKE LOCK
===================================== */

let wakeLock = null;

let wakeLockWanted = false;


async function requestWakeLock(){

    wakeLockWanted = true;

    if(!('wakeLock' in navigator)){
        return;
    }

    if(wakeLock){
        return;
    }

    if(document.visibilityState !== 'visible'){
        return;
    }

    try{

        wakeLock = await navigator.wakeLock.request(
            'screen'
        );

        wakeLock.addEventListener(
            'release',
            () => {
                wakeLock = null;
            }
        );

    }catch(e){

        wakeLock = null;

    }

}


async function releaseWakeLock(){

    wakeLockWanted = false;

    if(wakeLock){

        try{
            await wakeLock.release();
        }catch(e){}

        wakeLock = null;

    }

}


document.addEventListener(
    'visibilitychange',
    () => {

        if(
            document.visibilityState === 'visible' &&
            wakeLockWanted
        ){

            requestWakeLock();

        }

    }
);


/* =====================================
   STREAM TYPE DETECTION
===================================== */

function detectType(raw){

    if(forcedType){
        return forcedType;
    }

    const clean = raw
        .split('?')[0]
        .split('#')[0]
        .toLowerCase();

    if(clean.endsWith('.m3u8')){
        return 'hls';
    }

    if(clean.endsWith('.mpd')){
        return 'dash';
    }

    if(
        clean.endsWith('.mp4') ||
        clean.endsWith('.mov')
    ){
        return 'mp4';
    }

    if(clean.endsWith('.webm')){
        return 'webm';
    }

    if(
        clean.endsWith('.ogg') ||
        clean.endsWith('.ogv')
    ){
        return 'ogg';
    }

    if(raw.toLowerCase().includes('.m3u8')){
        return 'hls';
    }

    if(raw.toLowerCase().includes('.mpd')){
        return 'dash';
    }

    return null;

}


function isDirectFile(type){

    return [
        'mp4',
        'webm',
        'ogg'
    ].includes(type);

}


/* =====================================
   DIRECT OVERLAY AD SYSTEM
===================================== */

let adTimer = null;

let adCloseTimer = null;

let adCountdownTimer = null;

let adShown = false;

let adRemaining = 10;


function wasAdShown(){

    if(!AD_CONFIG.oncePerSession){
        return false;
    }

    try{

        return sessionStorage.getItem(
            'rs_direct_ad_shown'
        ) === '1';

    }catch(e){

        return false;

    }

}


function markAdShown(){

    try{

        sessionStorage.setItem(
            'rs_direct_ad_shown',
            '1'
        );

    }catch(e){}

}


function closeAd(){

    clearTimeout(adCloseTimer);

    clearInterval(adCountdownTimer);

    adOverlay.classList.remove(
        'ad-visible'
    );

    adOverlay.style.display = 'none';

}


function showAd(){

    if(!AD_CONFIG.enabled){
        return;
    }

    if(adShown){
        return;
    }

    if(wasAdShown()){
        return;
    }

    if(!everPlayed){
        return;
    }

    adShown = true;

    markAdShown();

    const adImage = document.getElementById(
        'ad-image'
    );

    const adTitle = document.getElementById(
        'ad-title'
    );

    const adDescription = document.getElementById(
        'ad-description'
    );

    const adLink = document.getElementById(
        'ad-link'
    );

    const adCta = document.getElementById(
        'ad-cta'
    );

    const adTimerText = document.getElementById(
        'ad-timer'
    );


    adTitle.textContent =
        AD_CONFIG.title;

    adDescription.textContent =
        AD_CONFIG.description;

    adCta.textContent =
        AD_CONFIG.ctaText;


    /* IMAGE */

    if(AD_CONFIG.imageUrl){

        adImage.src = AD_CONFIG.imageUrl;

        adImage.style.display = 'block';

    }else{

        adImage.style.display = 'none';

    }


    /* CLICK LINK */

    if(AD_CONFIG.clickUrl){

        adLink.href = AD_CONFIG.clickUrl;

        adLink.style.pointerEvents = 'auto';

        adCta.style.display = 'block';

    }else{

        adLink.removeAttribute('href');

        adLink.style.pointerEvents = 'none';

        adCta.style.display = 'none';

    }


    adOverlay.style.display = 'block';

    requestAnimationFrame(() => {

        adOverlay.classList.add(
            'ad-visible'
        );

    });


    /* AUTO CLOSE */

    adRemaining = Math.ceil(
        AD_CONFIG.durationMs / 1000
    );

    adTimerText.textContent =
        'Closing in ' + adRemaining + 's';


    adCountdownTimer = setInterval(() => {

        adRemaining--;

        if(adRemaining <= 0){

            clearInterval(adCountdownTimer);

            return;

        }

        adTimerText.textContent =
            'Closing in ' + adRemaining + 's';

    },1000);


    adCloseTimer = setTimeout(() => {

        closeAd();

    },AD_CONFIG.durationMs);

}


function scheduleAd(){

    if(!AD_CONFIG.enabled){
        return;
    }

    if(adShown || wasAdShown()){
        return;
    }

    clearTimeout(adTimer);

    adTimer = setTimeout(() => {

        if(
            everPlayed &&
            !video.paused &&
            !video.ended
        ){

            showAd();

        }

    },AD_CONFIG.showAfterMs);

}


document.getElementById(
    'ad-close'
).addEventListener(
    'click',
    closeAd
);


/* =====================================
   NO URL
===================================== */

if(!streamSource){

    showState(`

        <div class="state-content">

            <div class="glyph warn">
                &#9888;
            </div>

            <p class="title">
                No stream URL supplied
            </p>

            <p class="sub">
                Add ?url=YOUR_STREAM_LINK
                to this page's address.
            </p>

            ${brandBlock()}

        </div>

    `);

}else{


/* =====================================
   PLAYER INITIALIZATION
===================================== */

const streamType = detectType(
    streamSource
);

let player = null;

let ui = null;

let retryCount = 0;

const maxRetries = 6;

let retryTimer = null;

let noStreamTimer = null;

let everPlayed = false;

let userPaused = false;

let isRetrying = false;

let isNative = false;

const NO_STREAM_TIMEOUT = 12000;


/* VIDEO STYLE */

function applyVideoStyle(){

    video.style.width = '100%';

    video.style.height = '100%';

    video.style.objectFit = 'fill';

    video.style.touchAction = 'manipulation';

    video.setAttribute(
        'playsinline',
        ''
    );

}


/* =====================================
   PLAYBACK STATE
===================================== */

function onFirstPlayback(){

    clearTimeout(noStreamTimer);

    hideLoader();

    if(!everPlayed){

        everPlayed = true;

        retryCount = 0;

        scheduleAd();

    }else{

        retryCount = 0;

    }

    requestWakeLock();

}


/* =====================================
   PLAYER ERROR
===================================== */

function showNoStreamState(err){

    clearTimeout(retryTimer);

    clearTimeout(noStreamTimer);

    clearTimeout(adTimer);

    closeAd();

    releaseWakeLock();

    const message =
        err && err.message
        ? String(err.message)
        : 'The source could not be reached.';

    const safeMessage = message
        .replace(/[&<>"']/g, char => ({
            '&':'&amp;',
            '<':'&lt;',
            '>':'&gt;',
            '"':'&quot;',
            "'":'&#39;'
        })[char]);

    showState(`

        <div class="state-content">

            <div class="glyph">
                &#10060;
            </div>

            <p class="title">
                No streaming — this link won't play
            </p>

            <p class="sub">
                ${safeMessage}
            </p>

            <button
                class="retry-btn"
                onclick="location.reload()"
            >
                Retry
            </button>

            ${brandBlock()}

        </div>

    `);

}


/* =====================================
   AUTO RECONNECT
===================================== */

async function loadStream(){

    if(userPaused){
        return;
    }

    isRetrying = true;

    showLoader();

    statusEl.textContent = 'RECONNECTING';

    try{

        if(isNative){

            video.pause();

            video.src = streamSource;

            video.load();

        }else{

            await player.load(
                streamSource
            );

        }

        const playResult = video.play();

        if(playResult && playResult.catch){

            await playResult.catch(() => {});

        }

        isRetrying = false;

    }catch(error){

        isRetrying = false;

        console.error(
            '[RS Player] reconnect error:',
            error
        );

        if(retryCount < maxRetries){

            retryCount++;

            statusEl.textContent =
                'RECONNECTING (' +
                retryCount +
                '/' +
                maxRetries +
                ')';

            clearTimeout(retryTimer);

            retryTimer = setTimeout(() => {

                loadStream();

            },Math.min(1000 * retryCount,4000));

        }else{

            showNoStreamState(error);

        }

    }

}


function handleFault(error){

    console.error(
        '[RS Player] error:',
        error
    );

    if(userPaused){
        return;
    }

    if(retryCount < maxRetries){

        retryCount++;

        clearTimeout(retryTimer);

        showLoader();

        statusEl.textContent =
            'RECONNECTING (' +
            retryCount +
            '/' +
            maxRetries +
            ')';

        retryTimer = setTimeout(() => {

            loadStream();

        },Math.min(1000 * retryCount,4000));

    }else{

        showNoStreamState(error);

    }

}


/* =====================================
   VIDEO EVENTS
===================================== */

video.addEventListener(
    'playing',
    () => {

        clearTimeout(retryTimer);

        onFirstPlayback();

    }
);


video.addEventListener(
    'waiting',
    () => {

        if(everPlayed){

            statusEl.textContent = 'BUFFERING';

            showLoader();

        }

    }
);


video.addEventListener(
    'stalled',
    () => {

        if(everPlayed){

            statusEl.textContent = 'BUFFERING';

            showLoader();

        }

    }
);


video.addEventListener(
    'pause',
    () => {

        releaseWakeLock();

        if(everPlayed && !isRetrying){

            userPaused = true;

            clearTimeout(adTimer);

            closeAd();

        }

    }
);


video.addEventListener(
    'play',
    () => {

        userPaused = false;

        if(everPlayed){

            hideLoader();

        }

    }
);


video.addEventListener(
    'ended',
    () => {

        releaseWakeLock();

    }
);


video.addEventListener(
    'error',
    () => {

        if(!video.error){
            return;
        }

        handleFault(
            new Error(
                'Video playback error: ' +
                video.error.message
            )
        );

    }
);


/* =====================================
   SHAKA INITIALIZATION
===================================== */

async function initializePlayer(){

    try{

        if(!window.shaka){

            throw new Error(
                'Shaka Player library failed to load.'
            );

        }

        shaka.polyfill.installAll();

        if(!shaka.Player.isBrowserSupported()){

            throw new Error(
                'This browser does not support Shaka Player.'
            );

        }


        /* DIRECT FILE FALLBACK */

        if(isDirectFile(streamType)){

            isNative = true;

            wrapper.classList.add(
                'native-mode'
            );

            video.controls = true;

            video.src = streamSource;

            video.load();

            const result = video.play();

            if(result && result.catch){

                await result.catch(error => {

                    console.warn(
                        '[RS Player] Autoplay blocked:',
                        error
                    );

                });

            }

            return;

        }


        /* SHAKA PLAYER */

        player = new shaka.Player();

        await player.attach(video);


        /* STREAMING CONFIG */

        player.configure({

            streaming:{

                bufferingGoal:20,

                rebufferingGoal:2,

                bufferBehind:30,

                retryParameters:{

                    maxAttempts:3,

                    baseDelay:1000,

                    backoffFactor:2,

                    fuzzFactor:0.5

                }

            }

        });


        /* SHAKA UI */

        ui = new shaka.ui.Overlay(
            player,
            videoContainer,
            video
        );

        ui.configure({

            controlPanelElements:[

                'play_pause',

                'time_and_duration',

                'spacer',

                'mute',

                'volume',

                'fullscreen'

            ],

            overflowMenuButtons:[

                'quality',

                'language',

                'captions',

                'playback_rate'

            ]

        });


        video.controls = false;


        /* PLAYER ERROR EVENT */

        player.addEventListener(
            'error',
            event => {

                console.error(
                    '[RS Player] Shaka error:',
                    event.detail
                );

                handleFault(
                    new Error(
                        'Shaka playback error: ' +
                        (
                            event.detail &&
                            event.detail.message
                            ? event.detail.message
                            : 'Stream error'
                        )
                    )
                );

            }
        );


        /* BUFFERING */

        player.addEventListener(
            'buffering',
            event => {

                if(
                    event.buffering &&
                    everPlayed
                ){

                    statusEl.textContent = 'BUFFERING';

                    showLoader();

                }

            }
        );


        /* LOAD STREAM */

        await player.load(
            streamSource
        );


        applyVideoStyle();


        /* AUTOPLAY */

        const result = video.play();

        if(result && result.catch){

            await result.catch(error => {

                console.warn(
                    '[RS Player] Autoplay blocked:',
                    error
                );

            });

        }


        console.log(
            '[RS Player] Shaka ready:',
            streamType || 'auto'
        );


    }catch(error){

        console.error(
            '[RS Player] setup error:',
            error
        );

        handleFault(error);

    }

}


/* =====================================
   FULLSCREEN + LANDSCAPE
===================================== */

let landscapeLocked = false;


async function lockLandscape(){

    try{

        if(
            screen.orientation &&
            typeof screen.orientation.lock === 'function'
        ){

            await screen.orientation.lock(
                'landscape'
            );

            landscapeLocked = true;

            console.log(
                '[RS Player] Landscape locked'
            );

        }

    }catch(error){

        landscapeLocked = false;

        console.log(
            '[RS Player] Landscape lock unavailable:',
            error
        );

    }

}


function unlockLandscape(){

    try{

        if(
            screen.orientation &&
            typeof screen.orientation.unlock === 'function'
        ){

            screen.orientation.unlock();

        }

    }catch(error){

        console.log(error);

    }

    landscapeLocked = false;

}


function checkFullscreen(){

    const fullscreen =
        document.fullscreenElement ||
        document.webkitFullscreenElement;

    if(fullscreen){

        lockLandscape();

    }else{

        unlockLandscape();

    }

    requestAnimationFrame(() => {

        applyVideoStyle();

    });

}


document.addEventListener(
    'fullscreenchange',
    checkFullscreen
);


document.addEventListener(
    'webkitfullscreenchange',
    checkFullscreen
);


if(screen.orientation){

    screen.orientation.addEventListener(
        'change',
        () => {

            if(
                document.fullscreenElement ||
                document.webkitFullscreenElement
            ){

                requestAnimationFrame(() => {

                    applyVideoStyle();

                });

            }

        }
    );

}


/* =====================================
   INITIAL TIMEOUT
===================================== */

noStreamTimer = setTimeout(() => {

    if(!everPlayed){

        showNoStreamState(
            new Error(
                'Stream did not start within 12 seconds.'
            )
        );

    }

},NO_STREAM_TIMEOUT);


/* =====================================
   TOUCH SAFETY
===================================== */

videoContainer.addEventListener(
    'contextmenu',
    event => {

        event.preventDefault();

    },
    {passive:false}
);


/* =====================================
   VIDEO COMPOSITING
===================================== */

const observer = new MutationObserver(() => {

    applyVideoStyle();

});

observer.observe(
    videoContainer,
    {
        childList:true,
        subtree:true
    }
);


/* =====================================
   START PLAYER
===================================== */

applyVideoStyle();

initializePlayer();


/* =====================================
   PAGE CLEANUP
===================================== */

window.addEventListener(
    'pagehide',
    () => {

        clearTimeout(retryTimer);

        clearTimeout(noStreamTimer);

        clearTimeout(adTimer);

        clearTimeout(adCloseTimer);

        clearInterval(adCountdownTimer);

        releaseWakeLock();

        if(player){

            try{
                player.destroy();
            }catch(e){}

        }

    }
);

}

</script>
