:root{
    --bg-1:#0a0a12;
    --bg-2:#14101f;
    --grad-a:#22d3ee;
    --grad-b:#a78bfa;

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:var(--font);
    position:fixed;
    inset:0;
    overscroll-behavior:none;
}

body{
    touch-action:pan-x pan-y;
}

#player-wrapper{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    contain:layout paint;
}

#player{
    position:absolute;
    inset:0;
    width:100%!important;
    height:100%!important;
    touch-action:manipulation;
}

/*
 IMPORTANT:
 Do not put transition/filter/backdrop-filter on the player.
 These can cause Chrome Android video compositing lag.
*/
#player video,
.jw-video{
    width:100%!important;
    height:100%!important;
    object-fit:fill!important;
    touch-action:manipulation!important;
    -webkit-user-select:none;
    user-select:none;
}

/* Chrome fullscreen */
video::-webkit-media-controls{
    display:none!important;
}

/* ---------- JW SKIN ---------- */

.jw-skin-glow .jw-display-icon-container{
    background:rgba(167,139,250,.10)!important;
    border:1px solid rgba(167,139,250,.4);
    backdrop-filter:none!important;
    -webkit-backdrop-filter:none!important;
}

.jw-skin-glow .jw-button-color{
    color:#fff!important;
}

.jw-skin-glow .jw-controlbar{
    background:linear-gradient(
        0deg,
        rgba(0,0,0,.75),

    )!important;

    -webkit-backdrop-filter:none!important;
}

.jw-skin-glow .jw-slider-time .jw-progress{
    background:var(--grad-b)!important;
}

.jw-skin-glow .jw-knob{

/* ================= LOADER ================= */

#loader{
    position:absolute;
    inset:0;
    background:radial-gradient(
        80% 60% at 50% 40%,
        var(--bg-2) 0%,
        var(--bg-1) 70%
    );

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    z-index:99;

    transition:
        opacity .25s ease,
        visibility .25s ease;

    pointer-events:none;
}

#loader.hide-now{
    opacity:0!important;
    visibility:hidden!important;
    pointer-events:none!important;
}

.tuner{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
}

.tv-wrap{
    position:relative;
    width:78px;
    height:78px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.tv-glow{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            rgba(167,139,250,.35),
            transparent 70%
        );

    animation:glow-pulse 2.4s ease-in-out infinite;
}

@keyframes glow-pulse{
    0%,100%{
        transform:scale(.85);
        opacity:.5;
    }

    50%{
        transform:scale(1.15);
        opacity:1;
    }
}

.tv-icon{
    position:relative;
    width:60px;
    height:60px;
}

.tv-icon .tv-body{
    fill:none;
    stroke:var(--text);
    stroke-width:2;
    stroke-linecap:round;
    stroke-linejoin:round;
}

.tv-icon .screen-bars rect{
    transform-origin:bottom;
    animation:bar-flicker 1.6s ease-in-out infinite;
}

.tv-icon .screen-bars rect:nth-child(1){
    fill:var(--grad-a);
    animation-delay:-1.2s;
}

.tv-icon .screen-bars rect:nth-child(2){
    fill:var(--grad-b);
    animation-delay:-.9s;
}

.tv-icon .screen-bars rect:nth-child(3){
    fill:var(--grad-c);
    animation-delay:-.6s;
}

.tv-icon .screen-bars rect:nth-child(4){
    fill:var(--grad-b);
    animation-delay:-.3s;
}

.tv-icon .screen-bars rect:nth-child(5){
    fill:var(--grad-a);
    animation-delay:0s;
}

@keyframes bar-flicker{
    0%,100%{
        transform:scaleY(.45);
        opacity:.65;
    }

    50%{
        transform:scaleY(1);
        opacity:1;
    }
}

.brand-name{
    font-size:15px;
    font-weight:700;
    letter-spacing:1px;

    background:

        );

    -webkit-background-clip:text;

    color:transparent;
}

.brand-name b{

}

.dots{

}

.dots span{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--grad-b);
    animation:dot-pulse 1.2s ease-in-out infinite;
}

.dots span:nth-child(1){
    animation-delay:0s;
}

.dots span:nth-child(2){
    animation-delay:.2s;
}

.dots span:nth-child(3){
    animation-delay:.4s;
}

@keyframes dot-pulse{
    0%,80%,100%{
        transform:scale(.6);
        opacity:.35;
    }

    40%{
        transform:scale(1);
        opacity:1;
    }
}

.status-line{
    font-family:var(--mono);
    font-size:9.5px;
    letter-spacing:2.5px;
    color:var(--text-dim);
    text-transform:uppercase;
}

/* ---------- ERROR ---------- */

.state-content{
    text-align:center;
    color:var(--text);
    z-index:100;
    padding:0 24px;
    font-family:var(--font);
    pointer-events:auto;
}

.state-content .glyph{
    font-size:34px;
    color:var(--alert);
    margin-bottom:14px;
    line-height:1;
}

.state-content .glyph.warn{
    color:var(--warn);
}

.state-content p.title{
    font-size:13px;
    letter-spacing:1px;

}

.state-content p.sub{

}

.state-content .brand-name{

}

.retry-btn{
    margin-top:16px;

    font-family:var(--font);

    background:

            var(--grad-b)
        );

    border:none;
    border-radius:18px;
    cursor:pointer;
    touch-action:manipulation;
}

.retry-btn:active{
    transform:scale(.96);
}

/* ================= FULLSCREEN ================= */

.jwplayer.jw-flag-fullscreen,
.jwplayer.jw-flag-fullscreen .jw-media,
.jwplayer.jw-flag-fullscreen video{
    width:100%!important;

}

.jwplayer.jw-flag-fullscreen video{

}

/*
 Prevent Chrome from applying visual compositing effects
 during touch/fullscreen.
*/
.jwplayer,
.jw-media,
.jw-video{
    transform:none!important;
    filter:none!important;
    will-change:auto!important;
}

                    x2="44"
                    y2="50"
                />

            </svg>

        </div>

</div><script>

const urlParams =
    new URLSearchParams(window.location.search);

const streamSource =
    urlParams.get('url');

const forcedType =
    (urlParams.get('type') || '').toLowerCase();

const startMuted =
    urlParams.get('mute') === '1';

const loaderEl =
    document.getElementById('loader');

const statusEl =
    document.getElementById('status-line');


/* ================= LOADER STATUS ================= */

const statusMessages = [
    'LOADING',
    'CONNECTING',
    'BUFFERING'
];

let statusIdx = 0;

let statusTimer =
    setInterval(() => {

        if(
            loaderEl.classList.contains('hide-now')
        ) return;

        statusIdx =
            (statusIdx + 1) %
            statusMessages.length;

        statusEl.textContent =
            statusMessages[statusIdx];

    },1800);


function showLoader(){

    loaderEl.classList.remove(
        'hide-now'
    );
}


function hideLoader(){

    loaderEl.classList.add(
        'hide-now'
    );
}


function showState(html){

    clearInterval(statusTimer);

    loaderEl.innerHTML = html;

    showLoader();
}


function brandBlock(){

    return `
        <div class="brand-name">
            <b>RS LIVE</b> TV
        </div>
    `;
}


/* ================= WAKE LOCK ================= */

let wakeLock = null;
let wakeLockWanted = false;

async function requestWakeLock(){

    wakeLockWanted = true;

    if(!('wakeLock' in navigator))
        return;

    if(wakeLock)
        return;

    if(
        document.visibilityState !==
        'visible'
    )
        return;

    try{

        wakeLock =
            await navigator.wakeLock.request(
                'screen'
            );

        wakeLock.addEventListener(
            'release',
            () => {

                wakeLock = null;

            }
        );

    }catch(e){

        wakeLock = null;

    }
}


async function releaseWakeLock(){

    wakeLockWanted = false;

    if(wakeLock){

        try{
            await wakeLock.release();
        }catch(e){}

        wakeLock = null;
    }
}


document.addEventListener(
    'visibilitychange',
    () => {

        if(
            document.visibilityState ===
            'visible' &&
            wakeLockWanted
        ){

            requestWakeLock();
        }

    }
);


/* ================= STREAM TYPE ================= */

function detectType(raw){

    if(forcedType)
        return forcedType;

    const clean =
        raw
        .split('?')[0]
        .split('#')[0]
        .toLowerCase();

    if(clean.endsWith('.m3u8'))
        return 'hls';

    if(clean.endsWith('.mpd'))
        return 'dash';

    if(clean.endsWith('.mp4'))
        return 'mp4';

    if(clean.endsWith('.webm'))
        return 'webm';

    if(clean.endsWith('.mov'))
        return 'mp4';

    if(
        clean.endsWith('.ogg') ||
        clean.endsWith('.ogv')
    )
        return 'ogg';

    if(raw.includes('.m3u8'))
        return 'hls';

    if(raw.includes('.mpd'))
        return 'dash';

    return null;
}


/* ================= NO URL ================= */

if(!streamSource){

    showState(`

        <div class="state-content">

            <div class="glyph warn">
                <i>&#9888;</i>
            </div>

            <p class="title">
                No stream URL supplied
            </p>

            <p class="sub">
                Add ?url=YOUR_STREAM_LINK
                to this page's address.
            </p>

            ${brandBlock()}

        </div>

    `);

}else{

    const streamType =
        detectType(streamSource);

    const playlistItem = {
        file:streamSource
    };

    if(streamType)
        playlistItem.type = streamType;


    /* ================= JW PLAYER ================= */

    const player =
        jwplayer('player').setup({

            playlist:[
                playlistItem
            ],

            width:'100%',
            height:'100%',

            autostart:true,

            mute:startMuted,

            preload:'auto',

            /*
             IMPORTANT:
             Keep uniform here only as JW fallback.
             CSS forces actual video to FILL.
            */
            stretching:'uniform',

            liveTimeout:0,

            skin:{
                name:'glow'
            },

            displaytitle:false,

            displaydescription:false,

            controls:true,

            repeat:false
        });


    /* ================= RETRY ================= */

    let retryCount = 0;

    const maxRetries = 6;

    let retryTimer = null;

    let everPlayed = false;

    let userPaused = false;

    const NO_STREAM_TIMEOUT = 12000;

    let noStreamTimer =
        setTimeout(() => {

            if(!everPlayed)
                showNoStreamState();

        },NO_STREAM_TIMEOUT);


    /* ================= READY ================= */

    player.on(
        'ready',
        () => {

            console.log(
                'RS Player ready:',
                streamType || 'auto'
            );

            /*
             Do NOT attach dblclick handlers
             to the video element.

             Chrome Android may interpret those
             handlers during touch/fullscreen and
             cause playback/compositor issues.
            */

            const video =
                document.querySelector(
                    '#player video'
                );

            if(video){

                video.style.objectFit =
                    'fill';

                video.style.touchAction =
                    'manipulation';

                video.setAttribute(
                    'playsinline',
                    ''
                );

            }

        }
    );


    /* ================= FIRST FRAME ================= */

    player.on(
        'firstFrame',
        () => {

            clearInterval(statusTimer);

            clearTimeout(noStreamTimer);

            hideLoader();

            everPlayed = true;

            retryCount = 0;

        }
    );


    /* ================= PLAY ================= */

    player.on(
        'play',
        () => {

            clearTimeout(noStreamTimer);

            everPlayed = true;

            hideLoader();

            retryCount = 0;

            requestWakeLock();

        }
    );


    /* ================= PAUSE ================= */

    player.on(
        'pause',
        () => {

            userPaused = true;

            releaseWakeLock();

        }
    );


    /* ================= COMPLETE ================= */

    player.on(
        'complete',
        () => {

            releaseWakeLock();

        }
    );


    /* =====================================================
       IMPORTANT CHROME FIX

       Do NOT show a fullscreen/loader overlay simply because
       JW reports "buffer".

       Small buffer events are normal on live streams.
       Showing/hiding a full-screen DOM element during touch
       can trigger Chrome Android compositor lag.
    ===================================================== */

    player.on(
        'buffer',
        () => {

            /*
             Intentionally empty.

             We do NOT call showLoader() here.
             This prevents the screen from being replaced
             every time Chrome/JW briefly buffers.
            */

            console.log(
                '[RS Player] buffer'
            );

        }
    );


    player.on(
        'idle',
        () => {

            /*
             Don't immediately reload.

             JW may enter idle temporarily during
             fullscreen or network recovery.
            */

            console.log(
                '[RS Player] idle'
            );

        }
    );


    /* ================= FULLSCREEN ================= */

    player.on(
        'fullscreen',
        (evt) => {

            console.log(
                '[RS Player] fullscreen:',
                evt && evt.fullscreen
            );

            /*
             IMPORTANT:
             No timeout.
             No loader.
             No pause().
             No play().
             No load().

             This is the main Chrome touch/fullscreen fix.
            */

            requestAnimationFrame(() => {

                const video =
                    document.querySelector(
                        '#player video'
                    );

                if(video){

                    video.style.width =
                        '100%';

                    video.style.height =
                        '100%';

                    video.style.objectFit =
                        'fill';

                }

            });

        }
    );


    /* ================= ERROR ================= */

    player.on(
        'error',
        handleFault
    );

    player.on(
        'setupError',
        handleFault
    );


    function handleFault(err){

        console.error(
            '[RS Player] error:',
            err
        );

        /*
         If the user intentionally paused,
         don't automatically reload.
        */

        if(userPaused)
            return;


        if(!everPlayed){

            clearTimeout(retryTimer);

            retryTimer =
                setTimeout(() => {

                    try{

                        player.load([
                            playlistItem
                        ]);

                        player.play(true);

                    }catch(e){

                        console.warn(e);

                    }

                },900);

            return;
        }


        if(retryCount < maxRetries){

            retryCount++;

            statusEl.textContent =
                'RECONNECTING (' +
                retryCount +
                '/' +
                maxRetries +
                ')';

            /*
             Only show loader for a real
             player error, not normal buffer.
            */

            showLoader();

            clearTimeout(retryTimer);

            retryTimer =
                setTimeout(() => {

                    try{

                        player.load([
                            playlistItem
                        ]);

                        player.play(true);

                    }catch(e){

                        console.warn(e);

                    }

                },
                Math.min(
                    1000 * retryCount,
                    4000
                ));

            return;
        }


        showNoStreamState(err);
    }


    /* ================= NO STREAM ================= */

    function showNoStreamState(err){

        clearTimeout(retryTimer);

        clearTimeout(noStreamTimer);

        releaseWakeLock();

        showState(`

            <div class="state-content">

                <div class="glyph">
                    <i>&#10060;</i>
                </div>

                <p class="title">
                    No streaming — this link won't play
                </p>

                <p class="sub">
                    ${
                        err &&
                        err.message
                        ?
                        err.message
                        :
                        'The source could not be reached.'
                    }
                </p>

                <button
                    class="retry-btn"
                    onclick="location.reload()"
                >
                    Retry
                </button>

                ${brandBlock()}

            </div>

        `);
    }


    /* ================= TOUCH SAFETY ================= */

    /*
     IMPORTANT:
     We only stop browser gesture handling.
     We never stop JW pointer events.
    */

    const playerBox =
        document.getElementById(
            'player'
        );

    if(playerBox){

        playerBox.addEventListener(
            'contextmenu',
            e => {

                e.preventDefault();

            },
            {passive:false}
        );

    }


    /* ================= VIDEO COMPOSITING ================= */

    /*
     Re-apply FILL after JW updates its DOM.
     This is lightweight and does not touch playback.
    */

    const observer =
        new MutationObserver(() => {

            const video =
                document.querySelector(
                    '#player video'
                );

            if(video){

                video.style.objectFit =
                    'fill';

                video.style.touchAction =
                    'manipulation';

            }

        });


    observer.observe(
        document.getElementById('player'),
        {
            childList:true,
            subtree:true
        }
    );

}
