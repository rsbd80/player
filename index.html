<script>

/* =================================
   URL SETTINGS
================================= */

const urlParams = new URLSearchParams(window.location.search);

let currentStreamSource = urlParams.get('url') || '';

let currentName =
    urlParams.get('name') ||
    getNameFromURL(currentStreamSource);

let currentType = (urlParams.get('type') || '').toLowerCase();

const startMuted = urlParams.get('mute') === '1';

const loaderEl = document.getElementById('loader');
const statusEl = document.getElementById('status-line');
const wrapper = document.getElementById('player-wrapper');

function getNameFromURL(url){

    if(!url) return 'Unknown Channel';

    try{
        const parsed = new URL(url);
        return parsed.hostname.replace(/^www\./,'');
    }catch(e){
        return 'Live Channel';
    }

}

/* =================================
   STORAGE HELPERS
================================= */

const FAVORITES_KEY = 'rs_player_favorites_v1';
const RECENT_KEY = 'rs_player_recent_v1';

function readStorage(key){

    try{

        const data = JSON.parse(localStorage.getItem(key) || '[]');

        return Array.isArray(data) ? data : [];

    }catch(e){

        return [];

    }

}

function writeStorage(key,data){

    try{

        localStorage.setItem(key,JSON.stringify(data));

    }catch(e){

        console.warn('Storage unavailable:',e);

    }

}

function getCurrentItem(){

    return {
        url:currentStreamSource,
        name:currentName,
        type:currentType,
        mute:startMuted
    };

}

/* =================================
   LOADER STATUS
================================= */

const statusMessages = [
    'LOADING',
    'CONNECTING',
    'BUFFERING'
];

let statusIdx = 0;

let statusTimer = setInterval(() => {

    if(loaderEl.classList.contains('hide-now')) return;

    statusIdx = (statusIdx + 1) % statusMessages.length;

    statusEl.textContent = statusMessages[statusIdx];

},1800);

function showLoader(){
    loaderEl.classList.remove('hide-now');
}

function hideLoader(){
    loaderEl.classList.add('hide-now');
}

function showState(html){

    clearInterval(statusTimer);

    loaderEl.innerHTML = html;

    showLoader();

}

function brandBlock(){

    return `
        <div class="brand-name">
            <b>RS LIVE</b> TV
        </div>
    `;

}

/* =================================
   WAKE LOCK
================================= */

let wakeLock = null;
let wakeLockWanted = false;

async function requestWakeLock(){

    wakeLockWanted = true;

    if(!('wakeLock' in navigator)) return;
    if(wakeLock) return;

    if(document.visibilityState !== 'visible') return;

    try{

        wakeLock = await navigator.wakeLock.request('screen');

        wakeLock.addEventListener('release',() => {
            wakeLock = null;
        });

    }catch(e){

        wakeLock = null;

    }

}

async function releaseWakeLock(){

    wakeLockWanted = false;

    if(wakeLock){

        try{
            await wakeLock.release();
        }catch(e){}

        wakeLock = null;

    }

}

document.addEventListener('visibilitychange',() => {

    if(
        document.visibilityState === 'visible' &&
        wakeLockWanted
    ){

        requestWakeLock();

    }

});

/* =================================
   STREAM TYPE
================================= */

function detectType(raw){

    if(currentType) return currentType;

    const clean = raw
        .split('?')[0]
        .split('#')[0]
        .toLowerCase();

    if(clean.endsWith('.m3u8')) return 'hls';
    if(clean.endsWith('.mpd')) return 'dash';
    if(clean.endsWith('.mp4')) return 'mp4';
    if(clean.endsWith('.webm')) return 'webm';
    if(clean.endsWith('.mov')) return 'mp4';

    if(
        clean.endsWith('.ogg') ||
        clean.endsWith('.ogv')
    ) return 'ogg';

    if(raw.includes('.m3u8')) return 'hls';
    if(raw.includes('.mpd')) return 'dash';

    return null;

}

function makePlaylistItem(url,type){

    const item = {
        file:url
    };

    const detected = type || detectType(url);

    if(detected){
        item.type = detected;
    }

    return item;

}

/* =================================
   PLAYER INITIALIZATION
================================= */

if(!currentStreamSource){

    showState(`

        <div class="state-content">

            <div class="glyph warn">⚠</div>

            <p class="title">
                No stream URL supplied
            </p>

            <p class="sub">
                Add ?url=YOUR_STREAM_LINK to this page's address.
            </p>

            ${brandBlock()}

        </div>

    `);

}else{

    let playlistItem = makePlaylistItem(
        currentStreamSource,
        currentType
    );

    const player = jwplayer('player').setup({

        playlist:[playlistItem],

        width:'100%',
        height:'100%',

        autostart:true,
        mute:startMuted,
        preload:'auto',

        stretching:'uniform',

        liveTimeout:0,

        skin:{
            name:'glow'
        },

        displaytitle:false,
        displaydescription:false,

        controls:true,
        repeat:false

    });

    /* RETRY */

    let retryCount = 0;
    const maxRetries = 6;

    let retryTimer = null;
    let everPlayed = false;
    let userPaused = false;
    let historySavedForCurrent = false;

    const NO_STREAM_TIMEOUT = 12000;

    let noStreamTimer = setTimeout(() => {

        if(!everPlayed){
            showNoStreamState();
        }

    },NO_STREAM_TIMEOUT);

    /* =================================
       VIDEO STYLE
    ================================= */

    function applyVideoStyle(){

        const video = document.querySelector('#player video');

        if(video){

            video.style.width = '100%';
            video.style.height = '100%';
            video.style.objectFit = 'fill';
            video.style.touchAction = 'manipulation';

            video.setAttribute('playsinline','');

        }

    }

    /* =================================
       RECENTLY WATCHED
    ================================= */

    function saveRecent(){

        if(historySavedForCurrent) return;

        historySavedForCurrent = true;

        const item = getCurrentItem();

        if(!item.url) return;

        let recent = readStorage(RECENT_KEY);

        recent = recent.filter(old => old.url !== item.url);

        recent.unshift({
            ...item,
            time:Date.now()
        });

        recent = recent.slice(0,10);

        writeStorage(RECENT_KEY,recent);

        renderRecent();

    }

    /* =================================
       FAVORITES
    ================================= */

    function isFavorite(url){

        return readStorage(FAVORITES_KEY)
            .some(item => item.url === url);

    }

    function updateFavoriteUI(){

        const button = document.getElementById('favorite-button');
        const label = document.getElementById('favorite-label');
        const status = document.getElementById('favorite-status');

        const active = isFavorite(currentStreamSource);

        button.classList.toggle('active',active);

        button.querySelector('.action-icon').textContent =
            active ? '♥' : '♡';

        label.textContent =
            active ? 'Remove from Favorites' : 'Add to Favorites';

        status.classList.toggle('visible',active);

    }

    function toggleFavorite(){

        if(!currentStreamSource) return;

        let favorites = readStorage(FAVORITES_KEY);

        const existing = favorites.some(
            item => item.url === currentStreamSource
        );

        if(existing){

            favorites = favorites.filter(
                item => item.url !== currentStreamSource
            );

        }else{

            favorites.unshift(getCurrentItem());

        }

        writeStorage(FAVORITES_KEY,favorites);

        updateFavoriteUI();

    }

    /* =================================
       RECENT LIST UI
    ================================= */

    function renderRecent(){

        const list = document.getElementById('recent-list');
        const count = document.getElementById('recent-count');

        const recent = readStorage(RECENT_KEY);

        count.textContent = recent.length + '/10';

        list.replaceChildren();

        if(!recent.length){

            const empty = document.createElement('div');

            empty.className = 'recent-empty';
            empty.textContent = 'No recently watched channels';

            list.appendChild(empty);

            return;

        }

        recent.forEach(item => {

            const button = document.createElement('button');

            button.type = 'button';
            button.className = 'recent-item';

            const icon = document.createElement('span');
            icon.textContent = '▶';

            const name = document.createElement('span');
            name.textContent = item.name || 'Live Channel';

            button.appendChild(icon);
            button.appendChild(name);

            button.addEventListener('click',() => {

                switchStream(item);

                closeExtraPanel();

            });

            list.appendChild(button);

        });

    }

    /* =================================
       CHANGE STREAM
    ================================= */

    function switchStream(item){

        if(!item || !item.url) return;

        currentStreamSource = item.url;
        currentName = item.name || getNameFromURL(item.url);
        currentType = item.type || '';

        playlistItem = makePlaylistItem(
            currentStreamSource,
            currentType
        );

        retryCount = 0;
        everPlayed = false;
        userPaused = false;
        historySavedForCurrent = false;

        clearTimeout(retryTimer);
        clearTimeout(noStreamTimer);

        showLoader();

        statusEl.textContent = 'CONNECTING';

        updateFavoriteUI();

        /* Update URL parameters */

        try{

            const newURL = new URL(window.location.href);

            newURL.searchParams.set('url',currentStreamSource);
            newURL.searchParams.set('name',currentName);

            if(currentType){
                newURL.searchParams.set('type',currentType);
            }else{
                newURL.searchParams.delete('type');
            }

            window.history.replaceState({},'',newURL.toString());

        }catch(e){}

        noStreamTimer = setTimeout(() => {

            if(!everPlayed){
                showNoStreamState();
            }

        },NO_STREAM_TIMEOUT);

        try{

            player.load([playlistItem]);
            player.play(true);

        }catch(error){

            console.warn('Stream change error:',error);

        }

    }

    /* =================================
       EXTRA MENU
    ================================= */

    const menuButton = document.getElementById('extra-menu-button');
    const extraPanel = document.getElementById('extra-panel');

    function openExtraPanel(){
        extraPanel.classList.add('open');
    }

    function closeExtraPanel(){
        extraPanel.classList.remove('open');
    }

    menuButton.addEventListener('click',() => {

        extraPanel.classList.toggle('open');

        renderRecent();
        updateFavoriteUI();

    });

    document.getElementById('favorite-button')
        .addEventListener('click',() => {

            toggleFavorite();

        });

    /* =================================
       SCREEN LOCK
    ================================= */

    const lockShield = document.getElementById('screen-lock-shield');
    const unlockButton = document.getElementById('unlock-button');
    const lockButton = document.getElementById('lock-button');

    let screenLocked = false;

    function lockScreen(){

        screenLocked = true;

        lockShield.classList.add('locked');

        unlockButton.classList.add('visible');

        menuButton.style.display = 'none';

        closeExtraPanel();

        console.log('[RS Player] Screen locked');

    }

    function unlockScreen(){

        screenLocked = false;

        lockShield.classList.remove('locked');

        unlockButton.classList.remove('visible');

        menuButton.style.display = 'flex';

        console.log('[RS Player] Screen unlocked');

    }

    lockButton.addEventListener('click',lockScreen);

    unlockButton.addEventListener('click',unlockScreen);

    /* =================================
       READY
    ================================= */

    player.on('ready',() => {

        console.log(
            'RS Player ready:',
            currentType || 'auto'
        );

        applyVideoStyle();

        updateFavoriteUI();

        renderRecent();

    });

    /* FIRST FRAME */

    player.on('firstFrame',() => {

        clearInterval(statusTimer);
        clearTimeout(noStreamTimer);

        hideLoader();

        everPlayed = true;
        retryCount = 0;

        saveRecent();

    });

    /* PLAY */

    player.on('play',() => {

        clearTimeout(noStreamTimer);

        everPlayed = true;

        hideLoader();

        retryCount = 0;

        requestWakeLock();

        saveRecent();

    });

    /* PAUSE */

    player.on('pause',() => {

        userPaused = true;

        releaseWakeLock();

    });

    /* COMPLETE */

    player.on('complete',() => {
        releaseWakeLock();
    });

    /* BUFFER */

    player.on('buffer',() => {

        console.log('[RS Player] buffer');

    });

    /* IDLE */

    player.on('idle',() => {

        console.log('[RS Player] idle');

    });

    /* =================================
       FULLSCREEN + LANDSCAPE
    ================================= */

    let landscapeLocked = false;

    async function lockLandscape(){

        try{

            if(
                screen.orientation &&
                typeof screen.orientation.lock === 'function'
            ){

                await screen.orientation.lock('landscape');

                landscapeLocked = true;

                console.log('[RS Player] Landscape locked');

            }

        }catch(error){

            landscapeLocked = false;

            console.log(
                '[RS Player] Landscape lock unavailable:',
                error
            );

        }

    }

    function unlockLandscape(){

        try{

            if(
                screen.orientation &&
                typeof screen.orientation.unlock === 'function'
            ){

                screen.orientation.unlock();

            }

        }catch(error){

            console.log(error);

        }

        landscapeLocked = false;

    }

    player.on('fullscreen',(evt) => {

        const isFullscreen = evt && evt.fullscreen;

        console.log(
            '[RS Player] fullscreen:',
            isFullscreen
        );

        if(isFullscreen){

            lockLandscape();

        }else{

            unlockLandscape();

        }

        requestAnimationFrame(applyVideoStyle);

    });

    document.addEventListener('fullscreenchange',() => {

        if(document.fullscreenElement){

            lockLandscape();

        }else{

            unlockLandscape();

        }

        requestAnimationFrame(applyVideoStyle);

    });

    document.addEventListener('webkitfullscreenchange',() => {

        if(document.webkitFullscreenElement){

            lockLandscape();

        }else{

            unlockLandscape();

        }

        requestAnimationFrame(applyVideoStyle);

    });

    if(screen.orientation){

        screen.orientation.addEventListener('change',() => {

            requestAnimationFrame(applyVideoStyle);

        });

    }

    /* =================================
       ERROR + AUTO RECONNECT
    ================================= */

    player.on('error',handleFault);
    player.on('setupError',handleFault);

    function handleFault(err){

        console.error('[RS Player] error:',err);

        if(userPaused) return;

        if(!everPlayed){

            clearTimeout(retryTimer);

            retryTimer = setTimeout(() => {

                try{

                    player.load([playlistItem]);
                    player.play(true);

                }catch(e){

                    console.warn(e);

                }

            },900);

            return;

        }

        if(retryCount < maxRetries){

            retryCount++;

            statusEl.textContent =
                'RECONNECTING (' +
                retryCount +
                '/' +
                maxRetries +
                ')';

            showLoader();

            clearTimeout(retryTimer);

            retryTimer = setTimeout(() => {

                try{

                    player.load([playlistItem]);
                    player.play(true);

                }catch(e){

                    console.warn(e);

                }

            },Math.min(1000 * retryCount,4000));

            return;

        }

        showNoStreamState(err);

    }

    /* NO STREAM */

    function showNoStreamState(err){

        clearTimeout(retryTimer);
        clearTimeout(noStreamTimer);

        releaseWakeLock();

        showState(`

            <div class="state-content">

                <div class="glyph">❌</div>

                <p class="title">
                    No streaming — this link won't play
                </p>

                <p class="sub">
                    ${
                        err && err.message
                        ? err.message
                        : 'The source could not be reached.'
                    }
                </p>

                <button
                    class="retry-btn"
                    onclick="location.reload()"
                >
                    Retry
                </button>

                ${brandBlock()}

            </div>

        `);

    }

    /* =================================
       TOUCH SAFETY
    ================================= */

    const playerBox = document.getElementById('player');

    if(playerBox){

        playerBox.addEventListener(
            'contextmenu',
            e => {
                e.preventDefault();
            },
            {passive:false}
        );

    }

    /* =================================
       VIDEO OBSERVER
    ================================= */

    const observer = new MutationObserver(() => {

        applyVideoStyle();

    });

    observer.observe(
        document.getElementById('player'),
        {
            childList:true,
            subtree:true
        }
    );

}

</script>

</body>
</html>
