<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="referrer" content="no-referrer">

<title>RS Player Pro</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080808;
  font-family:Arial,Helvetica,sans-serif;
}

#player-container{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
}

video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

video.fit-fill{
  object-fit:fill!important;
}

video.fit-zoom{
  object-fit:cover!important;
}

/* LOADER */

#rs-loader{
  position:absolute;
  inset:0;
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  pointer-events:none;
  opacity:1;
  visibility:visible;
  transition:opacity .25s,visibility .25s;
}

#rs-loader.hide{
  opacity:0;
  visibility:hidden;
}

.loader-box{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:12px 16px;
  border-radius:10px;
  background:rgba(0,0,0,.72);
  border:1px solid rgba(255,255,255,.08);
}

.loader-spinner{
  width:27px;
  height:27px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.15);
  border-top-color:#ff3030;
  border-right-color:#ff3030;
  animation:rs-spin .8s linear infinite;
}

.loader-name{
  margin-top:8px;
  font-size:12px;
  font-weight:900;
  color:#fff;
  letter-spacing:.6px;
  white-space:nowrap;
}

.loader-name span{
  color:#ff3030;
}

#loader-message{
  margin-top:4px;
  font-size:10px;
  color:#aaa;
  white-space:nowrap;
}

@keyframes rs-spin{
  to{transform:rotate(360deg)}
}

/* HIDE CONTROLS WHILE LOADING */

#player-container.loading .shaka-controls-container{
  opacity:0!important;
  visibility:hidden!important;
  pointer-events:none!important;
}

#player-container.loading .shaka-play-button-container{
  display:none!important;
}

/* CONTROL PANEL */

.shaka-controls-container{
  width:100%!important;
}

.shaka-bottom-controls{
  width:100%!important;
  padding:0 8px 8px!important;
}

.shaka-controls-button-panel{
  display:flex!important;
  align-items:center!important;
  flex-wrap:nowrap!important;
  width:100%!important;
  min-width:0!important;
  overflow:hidden!important;
  gap:2px!important;
}

/* PLAY / PAUSE */

.shaka-controls-button-panel
.shaka-play-pause-button{
  order:0!important;
  flex:0 0 42px!important;
  width:42px!important;
  min-width:42px!important;
  max-width:42px!important;
  margin:0 0 0 4px!important; /* বামদিকের প্যাডিং বাড়িয়ে ডানদিকে সরানো হলো */
  padding:0!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
}

/* MUTE */

.shaka-controls-button-panel
.shaka-mute-button{
  order:1!important;
  flex:0 0 38px!important;
  width:38px!important;
  min-width:38px!important;
  margin:0!important;
}

/* VOLUME BAR (দাগ আরও চিকন করা হলো) */
.shaka-controls-button-panel
.shaka-volume-bar-container{
  order:2!important;
  flex:1 1 90px!important;
  min-width:60px!important; 
  max-width:110px!important;
  display:flex!important;
  align-items:center!important;
  height: 12px !important; 
  padding: 0 !important;
  margin-right: 4px !important;
}

.shaka-controls-button-panel
.shaka-volume-bar-container input[type="range"],
.shaka-controls-button-panel
.shaka-volume-bar-container .shaka-volume-bar {
  height: 0.75px !important; /* দাগটি অর্ধেক করে দেওয়া হলো */
  margin: 0 !important;
}

/* TIME */

.shaka-controls-button-panel
.shaka-current-time,
.shaka-controls-button-panel
.shaka-time-container{
  order:3!important;
  flex:0 0 auto!important;
  margin-right: 2px !important;
}

/* SPACER */

.shaka-controls-button-panel
.shaka-spacer{
  order:4!important;
  flex:1 1 auto!important;
  min-width:0!important;
}

/* QUALITY */

.shaka-controls-button-panel
.shaka-resolution-button{
  order:5!important;
  flex:0 0 38px!important;
  min-width:38px!important;
}

/* PIP */

.shaka-controls-button-panel
.shaka-pip-button{
  order:6!important;
  flex:0 0 38px!important;
  min-width:38px!important;
}

/* FIT */

.rs-fit-btn{
  order:7!important;
  flex:0 0 43px!important;
}

/* FULLSCREEN */

.shaka-controls-button-panel
.shaka-fullscreen-button{
  order:8!important;
  flex:0 0 42px!important;
  width:42px!important;
  min-width:42px!important;
  max-width:42px!important;
  margin:0!important;
}

.shaka-controls-button-panel button{
  flex-shrink:0!important;
}

/* FIT BUTTON */

.rs-fit-btn{
  border:0;
  background:transparent;
  color:white;
  cursor:pointer;
  padding:0 3px;
  min-width:40px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.rs-fit-label{
  font-size:10px;
  font-weight:800;
  padding:4px 6px;
  border:1px solid #666;
  border-radius:5px;
  color:#ddd;
  white-space:nowrap;
}

.rs-fit-btn.fill .rs-fit-label{
  color:#38bdf8;
  border-color:#38bdf8;
}

.rs-fit-btn.zoom .rs-fit-label{
  color:#a78bfa;
  border-color:#a78bfa;
}

/* FULLSCREEN */

#player-container:fullscreen,
#player-container:-webkit-full-screen{
  width:100vw;
  height:100vh;
  background:#000;
}

#player-container:fullscreen video,
#player-container:-webkit-full-screen video{
  width:100%;
  height:100%;
}

/* STATUS */

#status{
  position:fixed;
  top:max(12px,env(safe-area-inset-top));
  right:12px;
  z-index:100;

  display:flex;
  align-items:center;
  gap:7px;

  padding:7px 11px;
  border-radius:30px;

  background:rgba(15,15,15,.85);
  border:1px solid rgba(255,255,255,.10);

  color:#ddd;
  font-size:11px;
  font-weight:600;

  opacity:0;
  transform:translateY(-8px);
  transition:.25s;
  pointer-events:none;

  backdrop-filter:blur(12px);
}

#status.show{
  opacity:1;
  transform:translateY(0);
}

.dot{
  width:7px;
  height:7px;
  background:#38bdf8;
  border-radius:50%;
}

#status.live .dot{
  background:#22c55e;
  animation:rs-pulse 1.5s infinite;
}

#status.loading .dot{
  background:#fbbf24;
  animation:rs-pulse 1s infinite;
}

#status.error .dot{
  background:#ef4444;
}

@keyframes rs-pulse{
  50%{
    opacity:.35;
    transform:scale(.65);
  }
}

/* MOBILE */

@media(max-width:480px){

  #status{
    top:10px;
    right:10px;
    font-size:10px;
    padding:6px 9px;
  }

  .shaka-bottom-controls{
    padding:0 4px 5px!important;
  }

  .shaka-controls-button-panel{
    gap:1px!important;
  }

  /* মোবাইলে প্লে/পজ বাটন আরও ডানদিকে সরানো হলো */
  .shaka-controls-button-panel
  .shaka-play-pause-button{
    flex:0 0 36px!important;
    width:36px!important;
    min-width:36px!important;
    max-width:36px!important;
    margin-left: 6px !important; /* মোবাইলে বাড়তি স্পেস */
  }

  .shaka-controls-button-panel
  .shaka-mute-button{
    flex:0 0 34px!important;
    width:34px!important;
    min-width:34px!important;
  }

  /* মোবাইলে ভলিউম বার আরও চিকন */
  .shaka-controls-button-panel
  .shaka-volume-bar-container{
    display:flex!important; 
    flex:1 1 70px!important; 
    min-width:50px!important;
    max-width:80px!important;
    height: 10px !important;
    margin-right: 2px !important;
  }

  .shaka-controls-button-panel
  .shaka-volume-bar-container input[type="range"],
  .shaka-controls-button-panel
  .shaka-volume-bar-container .shaka-volume-bar {
    height: 0.5px !important; /* মোবাইলে আরও অর্ধেক চিকন */
  }

  .shaka-controls-button-panel
  .shaka-time-container{
    font-size:10px!important;
    flex:0 0 auto!important;
  }

  .shaka-controls-button-panel
  .shaka-resolution-button{
    flex:0 0 34px!important;
    min-width:34px!important;
  }

  .shaka-controls-button-panel
  .shaka-pip-button{
    flex:0 0 34px!important;
    min-width:34px!important;
  }

  .rs-fit-btn{
    flex:0 0 36px!important;
    min-width:36px!important;
  }

  .rs-fit-label{
    font-size:9px;
    padding:3px 5px;
  }

  .shaka-controls-button-panel
  .shaka-fullscreen-button{
    flex:0 0 36px!important;
    width:36px!important;
    min-width:36px!important;
    max-width:36px!important;
  }

}

/* VERY SMALL SCREENS */

@media(max-width:360px){

  .shaka-controls-button-panel
  .shaka-time-container{
    display:none!important;
  }

}
</style>
</head>

<body>

<div id="player-container" class="loading">

  <video
    id="video"
    autoplay
    playsinline
    preload="metadata">
  </video>

  <!-- LOADER -->

  <div id="rs-loader">

    <div class="loader-box">

      <div class="loader-spinner"></div>

      <div class="loader-name">
        RS <span>LIVE TV</span>
      </div>

      <div id="loader-message">
        Connecting...
      </div>

    </div>

  </div>

</div>

<div id="status">
  <span class="dot"></span>
  <span id="statusText">Ready</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>

<script>
(function(){

"use strict";

const video=document.getElementById("video");
const container=document.getElementById("player-container");
const status=document.getElementById("status");
const statusText=document.getElementById("statusText");
const loader=document.getElementById("rs-loader");
const loaderMessage=document.getElementById("loader-message");

let player;
let ui;
let controls;
let statusTimer;
let fitButton;

let fitIndex=0;
let previousFitIndex=0;
let isFullscreen=false;

let lastTap=0;

/* ==================================
   AUDIO MEMORY
================================== */

const AUDIO_STORAGE_KEY="rs_player_audio_enabled";

let audioEnabled=true;
let audioUnlocked=false;

try{

  const savedAudio=localStorage.getItem(AUDIO_STORAGE_KEY);

  if(savedAudio==="false"){
    audioEnabled=false;
  }else{
    audioEnabled=true;
  }

}catch(error){

  audioEnabled=true;

}

const FIT_MODES=["contain","fill","cover"];
const FIT_LABELS=["FIT","FILL","ZOOM"];

/* SAVE AUDIO */

function saveAudioPreference(){

  try{

    localStorage.setItem(
      AUDIO_STORAGE_KEY,
      String(audioEnabled)
    );

  }catch(error){

    console.log("Audio storage unavailable");

  }

}

/* USER UNLOCK */

function unlockAudio(){

  if(audioUnlocked)return;

  audioUnlocked=true;
  audioEnabled=true;

  saveAudioPreference();

  video.muted=false;

  video.play().catch(function(error){

    console.log("Audio play blocked:",error);

  });

}

/* STATUS */

function setStatus(text,type="loading",duration=4000){

  statusText.textContent=text;
  status.className="show "+type;

  clearTimeout(statusTimer);

  if(duration>0){

    statusTimer=setTimeout(()=>{
      status.classList.remove("show");
    },duration);

  }

}

/* LOADER */

function showLoader(message="Connecting..."){

  loaderMessage.textContent=message;
  loader.classList.remove("hide");
  container.classList.add("loading");

}

function hideLoader(){

  loader.classList.add("hide");
  container.classList.remove("loading");

}

/* FIT MODE */

function applyFit(){

  video.classList.remove("fit-fill","fit-zoom");

  if(fitButton){
    fitButton.classList.remove("fill","zoom");
  }

  if(FIT_MODES[fitIndex]==="fill"){

    video.classList.add("fit-fill");

    if(fitButton){
      fitButton.classList.add("fill");
    }

  }

  if(FIT_MODES[fitIndex]==="cover"){

    video.classList.add("fit-zoom");

    if(fitButton){
      fitButton.classList.add("zoom");
    }

  }

  if(fitButton){

    const label=fitButton.querySelector(".rs-fit-label");

    if(label){
      label.textContent=FIT_LABELS[fitIndex];
    }

  }

}

/* FIT BUTTON */

function addFitButton(){

  const panel=document.querySelector(
    ".shaka-controls-button-panel"
  );

  if(!panel)return;

  if(panel.querySelector(".rs-fit-btn"))return;

  const button=document.createElement("button");

  button.type="button";
  button.className="rs-fit-btn";
  button.title="Video Fit Mode";

  button.innerHTML=
    '<span class="rs-fit-label">FIT</span>';

  fitButton=button;

  const fullscreenButton=panel.querySelector(
    ".shaka-fullscreen-button"
  );

  if(fullscreenButton){

    panel.insertBefore(button,fullscreenButton);

  }else{

    panel.appendChild(button);

  }

  button.addEventListener("click",function(event){

    event.stopPropagation();

    fitIndex=(fitIndex+1)%FIT_MODES.length;

    applyFit();

  });

  applyFit();

}

/* FULLSCREEN */

function checkFullscreen(){

  const fullscreen=
    !!document.fullscreenElement ||
    !!document.webkitFullscreenElement;

  if(fullscreen && !isFullscreen){

    previousFitIndex=fitIndex;
    fitIndex=1;
    isFullscreen=true;

    applyFit();

  }else if(!fullscreen && isFullscreen){

    fitIndex=previousFitIndex;
    isFullscreen=false;

    applyFit();

  }

}

document.addEventListener(
  "fullscreenchange",
  checkFullscreen
);

document.addEventListener(
  "webkitfullscreenchange",
  checkFullscreen
);

/* VIDEO TOUCH - AUDIO UNLOCK */

video.addEventListener("pointerdown",function(){

  if(!audioUnlocked && audioEnabled){

    unlockAudio();

  }

},{passive:true});

/* SHAKA MUTE BUTTON */

document.addEventListener("click",function(event){

  const muteButton=event.target.closest(
    ".shaka-mute-button"
  );

  if(!muteButton)return;

  setTimeout(function(){

    audioEnabled=!video.muted;

    audioUnlocked=true;

    saveAudioPreference();

  },150);

});

/* AUDIO CHANGE */

video.addEventListener("volumechange",function(){

  if(audioUnlocked){

    audioEnabled=!video.muted;

    saveAudioPreference();

  }

});

/* DOUBLE TAP TO HIDE CONTROLS */

video.addEventListener("touchend",function(event){

  if(event.changedTouches.length!==1)return;

  const now=Date.now();

  if(now-lastTap<300){

    lastTap=0;

    if(controls && typeof controls.hide==="function"){
      controls.hide();
    }

  }else{

    lastTap=now;

  }

},{passive:true});

/* DOUBLE CLICK DESKTOP */

video.addEventListener("dblclick",function(){

  if(controls && typeof controls.hide==="function"){
    controls.hide();
  }

});

/* PLAYER INIT */

async function init(){

  showLoader("Initializing player...");

  shaka.polyfill.installAll();

  if(!shaka.Player.isBrowserSupported()){

    showLoader("Browser not supported");

    setStatus("Browser Not Supported","error",0);

    return;

  }

  try{

    player=new shaka.Player();

    await player.attach(video);

    ui=new shaka.ui.Overlay(
      player,
      container,
      video
    );

    /* CONTROLS CONFIGURATION */

    ui.configure({

      addBigPlayButton:false,

      autoHide:true,
      autoHideSeconds:3,

      controlPanelElements:[
        "play_pause",
        "mute",
        "volume",
        "time_and_duration",
        "spacer",
        "quality",
        "picture_in_picture",
        "fullscreen"
      ],

      seekBarColors:{
        base:"#555",
        buffered:"#777",
        played:"#ff3030"
      }

    });

    controls=ui.getControls();

    /* ADD FIT BUTTON */

    let count=0;

    const buttonTimer=setInterval(()=>{

      addFitButton();

      count++;

      if(
        document.querySelector(".rs-fit-btn") ||
        count>=30
      ){

        clearInterval(buttonTimer);

      }

    },250);

    /* JOR KORE VOLUME BAR SHOW KORA */
    const volumeTimer = setInterval(() => {
      const volBar = document.querySelector('.shaka-volume-bar-container');
      if (volBar) {
        volBar.style.display = 'flex';
        volBar.style.opacity = '1';
        volBar.style.visibility = 'visible';
        clearInterval(volumeTimer);
      }
    }, 500);

    /* ERRORS */

    player.addEventListener("error",function(event){

      console.error("Shaka error:",event.detail);

      showLoader("Stream error...");

      setStatus(
        "Stream Error "+(event.detail.code||""),
        "error",
        6000
      );

    });

    /* PLAYING */

    video.addEventListener("playing",function(){

      hideLoader();

      setStatus("LIVE","live",4000);

      if(audioUnlocked && audioEnabled){

        video.muted=false;

      }

      if(controls && typeof controls.hide==="function"){

        setTimeout(()=>{
          controls.hide();
        },800);

      }

    });

    /* BUFFERING */

    video.addEventListener("waiting",function(){

      showLoader("Buffering...");

      setStatus("Buffering...","loading",0);

    });

    video.addEventListener("stalled",function(){

      showLoader("Reconnecting...");

    });

    /* PAUSE */

    video.addEventListener("pause",function(){

      if(!video.ended){

        hideLoader();

        setStatus("Paused","loading",2500);

      }

    });

    /* URL */

    const params=new URLSearchParams(
      window.location.search
    );

    const streamUrl=params.get("url");

    if(!streamUrl){

      hideLoader();

      setStatus(
        "Ready - No Stream URL",
        "loading",
        5000
      );

      return;

    }

    await loadStream(streamUrl);

  }catch(error){

    console.error("Initialization:",error);

    showLoader("Player initialization failed");

    setStatus("Initialization Failed","error",0);

  }

}

/* ==================================
   LOAD STREAM
================================== */

async function loadStream(url){

  try{

    showLoader("Connecting...");

    setStatus("Connecting...","loading",0);

    await player.load(url);

    showLoader("Starting video...");

    if(audioEnabled && audioUnlocked){

      video.muted=false;

    }else if(audioEnabled){

      video.muted=false;

    }else{

      video.muted=true;

    }

    try{

      await video.play();

      if(!video.muted){

        audioEnabled=true;

      }

    }catch(error){

      console.log("Autoplay with audio blocked:",error);

      video.muted=true;

      try{

        await video.play();

      }catch(secondError){

        console.log("Muted autoplay blocked:",secondError);

        showLoader("Tap video to play");

      }

    }

  }catch(error){

    console.error("Load Error:",error);

    showLoader("Playback failed");

    setStatus("Playback Failed","error",0);

  }

}

/* START */

document.addEventListener(
  "DOMContentLoaded",
  init
);

})();
</script>

</body>
</html>
