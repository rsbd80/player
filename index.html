<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000;font-family:'Poppins','Hind Siliguri',sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none}
#player-wrapper{position:relative;width:100%;height:100%;background:#000;overflow:hidden;touch-action:manipulation}
#player-wrapper:fullscreen{width:100vw!important;height:100vh!important;background:#000}
#player-wrapper:fullscreen #player{width:100vw!important;height:100vh!important}
#player-wrapper:fullscreen #player video{width:100vw!important;height:100vh!important;object-fit:fill!important}
#player{position:absolute;inset:0;width:100%!important;height:100%!important}
#player video{width:100%!important;height:100%!important;object-fit:contain!important;background:#000}
video::-webkit-media-controls{display:none!important}
#loader{position:absolute;inset:0;background:radial-gradient(80% 60% at 50% 40%,#14101f 0%,#0a0a12 70%);display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:99;transition:opacity .1s;pointer-events:none}
#loader.hide-now{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
.tuner{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.tv-wrap{position:relative;width:68px;height:68px;display:flex;align-items:center;justify-content:center}
.tv-glow{position:absolute;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,.4),transparent 70%);animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{transform:scale(.85);opacity:.5}50%{transform:scale(1.15);opacity:1}}
.tv-icon{position:relative;width:56px;height:56px;filter:drop-shadow(0 6px 18px rgba(167,139,250,.35))}
.tv-icon .tv-body{fill:none;stroke:#eef0f7;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tv-icon .screen-bars rect{transform-origin:bottom;animation:bar 1.6s ease-in-out infinite}
.tv-icon .screen-bars rect:nth-child(1){fill:#22d3ee;animation-delay:-1.2s}
.tv-icon .screen-bars rect:nth-child(2){fill:#a78bfa;animation-delay:-.9s}
.tv-icon .screen-bars rect:nth-child(3){fill:#fb923c;animation-delay:-.6s}
.tv-icon .screen-bars rect:nth-child(4){fill:#a78bfa;animation-delay:-.3s}
.tv-icon .screen-bars rect:nth-child(5){fill:#22d3ee}
@keyframes bar{0%,100%{transform:scaleY(.45);opacity:.65}50%{transform:scaleY(1);opacity:1}}
.brand-name{font-size:18px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:#fff;text-shadow:0 4px 20px rgba(167,139,250,.4)}
.brand-name i{font-style:normal;background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff5d8f);-webkit-background-clip:text;background-clip:text;color:transparent}
.dots{display:flex;gap:6px;justify-content:center}
.dots span{width:6px;height:6px;border-radius:50%;background:#a78bfa;animation:dot 1.2s ease-in-out infinite;box-shadow:0 0 8px rgba(167,139,250,.7)}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{transform:scale(.6);opacity:.35}40%{transform:scale(1);opacity:1}}
.status-line{font-family:monospace;font-size:9.5px;letter-spacing:2.8px;color:#7a7a92;text-transform:uppercase}
.state-content{text-align:center;color:#eef0f7;padding:0 24px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.state-content .glyph{font-size:34px;color:#ff5d5d;margin-bottom:14px}
.state-content .glyph.warn{color:#ffb84d}
.state-content p.title{font-size:13px;font-weight:600}
.state-content p.sub{font-family:monospace;font-size:10.5px;color:#7a7a92;margin-top:8px;max-width:280px;overflow-wrap:anywhere}
.state-content .brand-name{margin-top:18px}
.retry-btn{margin-top:16px;padding:10px 22px;font-weight:700;font-size:12px;color:#0a0a12;background:linear-gradient(90deg,#22d3ee,#a78bfa);border:none;border-radius:20px;cursor:pointer}
.retry-btn2{margin-top:10px;padding:10px 22px;font-weight:700;font-size:12px;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:20px;cursor:pointer}
#tapPlay{position:absolute;inset:0;z-index:120;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(0,0,0,.55);cursor:pointer;text-align:center;padding:20px}
#tapPlay.show{display:flex}
#tapPlay .tp-btn{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#22d3ee,#a78bfa,#ff5d8f);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;box-shadow:0 10px 30px rgba(167,139,250,.6);animation:tp 1.6s infinite}
@keyframes tp{0%{box-shadow:0 0 0 0 rgba(167,139,250,.6)}70%{box-shadow:0 0 0 18px rgba(167,139,250,0)}100%{box-shadow:0 0 0 0 rgba(167,139,250,0)}}
#tapPlay p{font-size:14px;font-weight:700;color:#fff}
#tapPlay small{font-size:11px;color:#ccc}
#controls{position:absolute;bottom:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:0;padding:6px 4px 2px;padding-bottom:calc(2px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(0,0,0,.88),transparent);opacity:0;transition:opacity .3s;overflow:hidden}
#player-wrapper.show-controls #controls{opacity:1}
#controls .grp{display:flex;align-items:center;gap:2px;flex-shrink:0}
#controls .spacer{flex:1;min-width:8px}
#controls button{background:transparent!important;border:none!important;color:#fff!important;width:36px!important;height:36px!important;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0!important}
#controls button:active{transform:scale(.90)}
#controls button.active-low{background:rgba(255,255,255,.25)!important;border-radius:50%}
#controls svg{width:22px!important;height:22px!important;fill:none!important;stroke:#fff!important;stroke-width:2!important;stroke-linecap:round!important;stroke-linejoin:round!important;display:block}
#controls #playBtn svg,#controls #muteBtn svg{fill:#fff!important}
#pipBtn.active-pip{background:rgba(255,255,255,.22)!important;border-radius:50%}
#volSeek{-webkit-appearance:none;appearance:none;width:75px;height:5px;background:rgba(255,255,255,.85);border-radius:99px;outline:none;cursor:pointer;flex-shrink:0;margin-left:2px}
#volSeek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;border:none;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.6)}
#volSeek::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:none;cursor:pointer}
#qualityMenu{position:absolute;bottom:40px;right:8px;z-index:80;display:none;background:rgba(20,20,20,.95);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:1px;width:135px;max-height:120px;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#qualityMenu.show{display:block}
#player-wrapper:not(.show-controls) #qualityMenu{display:none!important}
#qualityMenu .q-head{display:flex;align-items:center;gap:4px;font-size:7px;font-weight:400;letter-spacing:1px;color:#aaa;padding:2px 6px 2px;position:sticky;top:0;background:rgba(20,20,20,.95);z-index:1}
#qualityMenu .q-head svg{width:10px!important;height:10px!important}
#qualityMenu button{width:100%!important;height:19px!important;border-radius:5px!important;padding:1px 8px!important;display:flex!important;align-items:center!important;justify-content:space-between!important;margin-bottom:0!important;background:transparent!important;border:1px solid transparent!important;color:#fff!important;box-shadow:none!important}
#qualityMenu button .q-main{font-size:9px!important;font-weight:400}
#qualityMenu button .q-tick{font-size:9px;opacity:0}
#qualityMenu button.sel{background:rgba(255,255,255,.12)!important;border:1px solid rgba(255,255,255,.35)!important}
#qualityMenu button.sel .q-tick{opacity:1}
</style>
</head>

<script>
function cleanParam(v){try{v=decodeURIComponent(v||'');}catch(e){}if(!v||v.indexOf('${')!==-1||v.indexOf('undefined')!==-1)return '';return v;}
const PROXY="https://stream-through-spark.lovable.app/api/proxy?u=";
const urlParams=new URLSearchParams(window.location.search);
let streamSource=cleanParam(urlParams.get('url')||'');
let chNameParam=cleanParam(urlParams.get('name')||'');
const srcParam=cleanParam(urlParams.get('src')||'');
const FS_PARAM=urlParams.get('fs')||'';
const IS_TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const IS_IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
const PROXY_FALLBACK=['toffee','jago','ayna','tapmad','sonyliv','bongo'];
const isToffee=['toffee','jago','ayna','tapmad'].some(n=>srcParam.toLowerCase().includes(n)||streamSource.toLowerCase().includes(n));
const canUseProxy=PROXY_FALLBACK.some(n=>srcParam.toLowerCase().includes(n)||streamSource.toLowerCase().includes(n));
if(chNameParam){document.title=chNameParam+' - Rs Live Tv';}
const loaderEl=document.getElementById('loader'),statusEl=document.getElementById('status-line'),wrapper=document.getElementById('player-wrapper'),playBtn=document.getElementById('playBtn'),fsBtn=document.getElementById('fsBtn'),pipBtn=document.getElementById('pipBtn'),tapPlayEl=document.getElementById('tapPlay'),muteBtnEl=document.getElementById('muteBtn'),volSeek=document.getElementById('volSeek');
const PLAY_SVG='<svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5-11-6.5z"/></svg>';
const PAUSE_SVG='<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
const statusMessages=['LOADING','CONNECTING','BUFFERING'];let statusIdx=0;
let statusTimer=setInterval(()=>{if(loaderEl.classList.contains('hide-now'))return;statusIdx=(statusIdx+1)%3;statusEl.textContent=statusMessages[statusIdx];},1800);
function showLoader(){loaderEl.classList.remove('hide-now')}
function hideLoader(){loaderEl.classList.add('hide-now')}
function showState(html){clearInterval(statusTimer);loaderEl.innerHTML=html;showLoader();}
function brandBlock(){return '<div class="brand-name"><b>Rs Live</b> <i>Tv</i></div>';}
let wakeLock=null,wakeLockWanted=false;
async function requestWakeLock(){wakeLockWanted=true;if(!('wakeLock' in navigator))return;if(wakeLock)return;try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>wakeLock=null);}catch(e){wakeLock=null}}
async function releaseWakeLock(){wakeLockWanted=false;if(wakeLock){try{await wakeLock.release()}catch(e){}wakeLock=null;}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&wakeLockWanted)requestWakeLock();});
let hideCtrlTimer=null;
function showControls(){wrapper.classList.add('show-controls');clearTimeout(hideCtrlTimer);hideCtrlTimer=setTimeout(()=>{wrapper.classList.remove('show-controls');document.getElementById('qualityMenu').classList.remove('show');},3000);}
let isFullscreenBusy=false;
let wasPlayingBeforePiP=false;
function getVideoEl(){return document.querySelector('#player video');}
function isAnyFullscreen(){return !!(document.fullscreenElement||document.webkitFullscreenElement||(getVideoEl()&&getVideoEl().webkitDisplayingFullscreen));}
async function toggleFullscreen(){
if(isFullscreenBusy)return;isFullscreenBusy=true;setTimeout(()=>isFullscreenBusy=false,700);
var v=getVideoEl();if(!v)return;
var wasPlaying=!v.paused;
if(isAnyFullscreen()){try{if(document.exitFullscreen)await document.exitFullscreen()}catch(e){}try{if(v.webkitExitFullscreen)v.webkitExitFullscreen()}catch(e){}try{if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock()}catch(e){}if(wasPlaying){setTimeout(()=>v.play().catch(()=>{}),150);}return;}
try{if(document.pictureInPictureElement){wasPlayingBeforePiP=wasPlaying;await document.exitPictureInPicture();await new Promise(r=>setTimeout(r,150));}}catch(e){}
try{if(wrapper.requestFullscreen){await wrapper.requestFullscreen();try{await screen.orientation.lock('landscape')}catch(e){}if(wasPlaying){setTimeout(()=>v.play().catch(()=>{}),200);}return;}}catch(e){}
try{if(v.requestFullscreen){await v.requestFullscreen();if(wasPlaying)setTimeout(()=>v.play().catch(()=>{}),200);return;}if(v.webkitEnterFullscreen){v.webkitEnterFullscreen();if(wasPlaying)setTimeout(()=>v.play().catch(()=>{}),200);return;}if(v.webkitRequestFullscreen){v.webkitRequestFullscreen();if(wasPlaying)setTimeout(()=>v.play().catch(()=>{}),200);return;}}catch(e){}
try{window.parent.postMessage({type:'RS_FULLSCREEN'},'*');}catch(e){}
}
function onFsChange(){var v=getVideoEl();if(!v)return;var fs=document.fullscreenElement||document.webkitFullscreenElement;if(fs){v.style.objectFit='fill';}else if(!v.webkitDisplayingFullscreen){v.style.objectFit='contain';try{if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock()}catch(e){}}}
document.addEventListener('fullscreenchange',onFsChange);document.addEventListener('webkitfullscreenchange',onFsChange);
window.addEventListener('message',e=>{if(e.data&&e.data.type==='RS_TOGGLE_FS')toggleFullscreen();});
async function togglePiP(){var v=getVideoEl();if(!v)return;var wasPlaying=!v.paused;try{if(document.pictureInPictureElement){wasPlayingBeforePiP=wasPlaying;await document.exitPictureInPicture();if(wasPlaying)setTimeout(()=>v.play().catch(()=>{}),150);}else if(v.requestPictureInPicture){wasPlayingBeforePiP=wasPlaying;await v.requestPictureInPicture();if(wasPlaying)setTimeout(()=>v.play().catch(()=>{}),150);}else if(v.webkitSetPresentationMode){v.webkitSetPresentationMode('picture-in-picture');}}catch(e){if(wasPlaying)v.play().catch(()=>{});}}
document.addEventListener('enterpictureinpicture',()=>{pipBtn.classList.add('active-pip');var v=getVideoEl();if(v&&wasPlayingBeforePiP)setTimeout(()=>v.play().catch(()=>{}),100);});
document.addEventListener('leavepictureinpicture',()=>{pipBtn.classList.remove('active-pip');var v=getVideoEl();if(v&&wasPlayingBeforePiP)setTimeout(()=>v.play().catch(()=>{}),100);});
let lastTap=0,singleTapTimer=null,ignoreNextClick=false;
function handleTap(e){if(e.target.closest('button')||e.target.closest('input')||e.target.closest('#tapPlay')||e.target.closest('#qualityMenu'))return;e.preventDefault();var now=Date.now();if(now-lastTap<300){clearTimeout(singleTapTimer);singleTapTimer=null;lastTap=0;ignoreNextClick=true;setTimeout(()=>ignoreNextClick=false,400);toggleFullscreen();return;}lastTap=now;clearTimeout(singleTapTimer);singleTapTimer=setTimeout(()=>{lastTap=0;showControls();},300);}
if(IS_TOUCH){wrapper.addEventListener('touchend',handleTap,{passive:false});}else{wrapper.addEventListener('click',e=>{if(e.target.closest('button')||e.target.closest('input'))return;showControls();});wrapper.addEventListener('dblclick',e=>{if(e.target.closest('button')||e.target.closest('input'))return;e.preventDefault();toggleFullscreen();});}
wrapper.addEventListener('mousemove',showControls);
function makeProxyUrl(o){if(!o)return o;if(o.indexOf(PROXY)===0)return o;return PROXY+encodeURIComponent(o);}
let selectedQuality=-1,availableHeights=[];
try{var sq=parseInt(localStorage.getItem('rslive_quality')||'-1');if(!isNaN(sq))selectedQuality=sq;}catch(e){}
function isLowQuality(){return selectedQuality!==-1&&selectedQuality<=360;}
function renderQualityList(){
var list=document.getElementById('qList');if(!list)return;list.innerHTML='';
function makeBtn(label,val){var b=document.createElement('button');var s1=document.createElement('span');s1.className='q-main';s1.textContent=label;var tick=document.createElement('span');tick.className='q-tick';tick.textContent='✓';b.append(s1,tick);if(selectedQuality===val)b.classList.add('sel');b.addEventListener('click',e=>{e.stopPropagation();setQuality(val);});list.appendChild(b);}
makeBtn('Quality Auto',-1);
if(availableHeights.length===0)makeBtn('Quality 240p',240);
else availableHeights.forEach(h=>makeBtn('Quality '+h+'p',h));
document.getElementById('settingsBtn').classList.toggle('active-low',isLowQuality());
}
function setQuality(val){selectedQuality=val;try{localStorage.setItem('rslive_quality',String(val));}catch(e){}applyQualityToPlayer();renderQualityList();document.getElementById('qualityMenu').classList.remove('show');}
function applyQualityToPlayer(){
if(window._hls){try{if(selectedQuality===-1){window._hls.autoLevelCapping=-1;window._hls.currentLevel=-1;}else{var idx=-1,best=99999;window._hls.levels.forEach((lv,i)=>{var d=Math.abs((lv.height||0)-selectedQuality);if(d<best){best=d;idx=i;}});if(idx>=0){window._hls.autoLevelCapping=idx;window._hls.currentLevel=idx;}}}catch(e){}}
if(window._shaka){try{if(selectedQuality===-1){window._shaka.configure({abr:{enabled:true,restrictions:{maxBandwidth:8000000,maxHeight:1080}}});}else{window._shaka.configure({abr:{enabled:false,restrictions:{maxBandwidth:8000000,maxHeight:selectedQuality}}});var tracks=window._shaka.getVariantTracks(),match=null;tracks.forEach(t=>{if(t.height===selectedQuality)match=t;});if(!match){var sd=99999;tracks.forEach(t=>{var dd=Math.abs((t.height||0)-selectedQuality);if(dd<sd){sd=dd;match=t;}});}if(match)window._shaka.selectVariantTrack(match,true);}}catch(e){}}
}
document.getElementById('settingsBtn').addEventListener('click',e=>{e.stopPropagation();document.getElementById('qualityMenu').classList.toggle('show');showControls();});
document.addEventListener('click',e=>{if(!e.target.closest('#qualityMenu')&&!e.target.closest('#settingsBtn'))document.getElementById('qualityMenu').classList.remove('show');});
renderQualityList();
if(!streamSource){showState('<div class="state-content"><div class="glyph warn">⚠</div><p class="title">No stream URL supplied</p><p class="sub">?url= দিয়ে লিংক দাও</p>'+brandBlock()+'</div>');}
else{
var video=document.createElement('video');video.setAttribute('playsinline','');video.setAttribute('webkit-playsinline','');video.muted=false;video.volume=1;video.autoplay=true;video.controls=false;video.preload='auto';video.playsInline=true;video.disablePictureInPicture=false;video.style.cssText='width:100%;height:100%;object-fit:contain;background:#000';document.getElementById('player').appendChild(video);
var hls=null,shakaPlayer=null,everPlayed=false,triedDirect=false,triedProxy=false,lastVol=1;
function syncVolUI(){if(!volSeek)return;volSeek.value=(video.muted||video.volume===0)?0:Math.round(video.volume*100);}
function updateMuteBtn(){var l1=document.getElementById('muteLine1'),l2=document.getElementById('muteLine2'),w=document.getElementById('muteWave'),w2=document.getElementById('muteWave2');var isMuted=video.muted||video.volume===0;if(isMuted){if(l1)l1.style.display='';if(l2)l2.style.display='';if(w)w.style.display='none';if(w2)w2.style.display='none';}else{if(l1)l1.style.display='none';if(l2)l2.style.display='none';if(w)w.style.display='';if(w2)w2.style.display='';}syncVolUI();}
updateMuteBtn();
function doPlay(){video.muted=false;video.volume=lastVol||1;updateMuteBtn();video.play().then(()=>{hideLoader();everPlayed=true;tapPlayEl.classList.remove('show');requestWakeLock();if(FS_PARAM==='1'&&!document.fullscreenElement)setTimeout(()=>toggleFullscreen(),400);}).catch(()=>{video.muted=true;video.play().then(()=>{hideLoader();everPlayed=true;tapPlayEl.classList.remove('show');requestWakeLock();}).catch(()=>tapPlayEl.classList.add('show'));updateMuteBtn();});}
tapPlayEl.addEventListener('click',()=>{video.muted=false;video.volume=lastVol||1;video.play().then(()=>{tapPlayEl.classList.remove('show');hideLoader();updateMuteBtn();requestWakeLock();}).catch(()=>{});});
muteBtnEl.addEventListener('click',e=>{e.stopPropagation();if(video.muted||video.volume===0){video.muted=false;video.volume=lastVol||1;}else{lastVol=video.volume||1;video.muted=true;}updateMuteBtn();showControls();});
volSeek.addEventListener('input',()=>{var v=parseInt(volSeek.value||'0')/100;video.volume=v;if(v>0){video.muted=false;lastVol=v;}else{video.muted=true;}updateMuteBtn();showControls();});
volSeek.addEventListener('click',e=>{e.stopPropagation();});
async function destroyCurrentPlayer(){if(hls){try{hls.destroy()}catch(e){}hls=null;window._hls=null;}if(shakaPlayer){try{await shakaPlayer.destroy()}catch(e){}shakaPlayer=null;window._shaka=null;}video.pause();video.removeAttribute('src');video.load();}
async function loadStream(url,viaProxy){
try{showLoader();tapPlayEl.classList.remove('show');await destroyCurrentPlayer();
var isMPD=/\.mpd/i.test(url),isM3U8=true;
if(isMPD){shaka.polyfill.installAll();shakaPlayer=new shaka.Player(video);window._shaka=shakaPlayer;if(isLowQuality())shakaPlayer.configure({streaming:{bufferingGoal:8,rebufferingGoal:2,bufferBehind:8},abr:{restrictions:{maxBandwidth:800000,maxHeight:360}}});else shakaPlayer.configure({streaming:{bufferingGoal:30,rebufferingGoal:2,bufferBehind:30}});shakaPlayer.addEventListener('error',ev=>{if(!everPlayed)showNoStreamState({message:'MPD Error: '+(ev.detail.message||ev.detail.code)});});await shakaPlayer.load(url);try{var hs=[];shakaPlayer.getVariantTracks().forEach(tr=>{if(tr.height&&hs.indexOf(tr.height)===-1)hs.push(tr.height);});availableHeights=hs.sort((a,b)=>b-a);renderQualityList();applyQualityToPlayer();}catch(e){}doPlay();return;}
if(isM3U8){if(window.Hls&&Hls.isSupported()){hls=new Hls({maxBufferLength:isLowQuality()?8:30,maxMaxBufferLength:isLowQuality()?12:60,enableWorker:false,lowLatencyMode:false,manifestLoadingMaxRetry:3,levelLoadingMaxRetry:4,fragLoadingMaxRetry:4});window._hls=hls;hls.loadSource(url);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>{try{var hs2=[];hls.levels.forEach(lv=>{if(lv.height&&hs2.indexOf(lv.height)===-1)hs2.push(lv.height);});availableHeights=hs2.sort((a,b)=>b-a);renderQualityList();applyQualityToPlayer();}catch(e){}doPlay();});hls.on(Hls.Events.ERROR,(e,data)=>{if(!data.fatal)return;if(data.type===Hls.ErrorTypes.NETWORK_ERROR){if(!viaProxy&&canUseProxy&&!triedProxy){triedProxy=true;loadStream(makeProxyUrl(streamSource),true);}else if(viaProxy&&!triedDirect){triedDirect=true;loadStream(streamSource,false);}else hls.startLoad();}else if(data.type===Hls.ErrorTypes.MEDIA_ERROR){hls.recoverMediaError();}else showNoStreamState({message:'HLS Error: '+data.details});});}else if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=url;doPlay();}else showNoStreamState({message:'Browser HLS support নেই'});return;}
video.src=url;doPlay();}catch(err){showNoStreamState({message:err.message||'ভিডিও চালানো যাচ্ছে না'});}
}
function showNoStreamState(err){releaseWakeLock();tapPlayEl.classList.remove('show');showState('<div class="state-content"><div class="glyph">❌</div><p class="title">এই চ্যানেলটা এখন চলছে না</p><p class="sub">'+(err&&err.message?err.message:'The source could not be reached.')+'</p><button class="retry-btn" onclick="location.reload()">🔄 Retry</button><br><button class="retry-btn2" onclick="tryProxyManually()">🌐 Proxy দিয়ে চেষ্টা করো</button><br><button class="retry-btn2" onclick="tryDirectManually()">📡 Direct দিয়ে চেষ্টা করো</button>'+brandBlock()+'</div>');}
window.tryProxyManually=()=>{showLoader();loadStream(makeProxyUrl(streamSource),true);};
window.tryDirectManually=()=>{showLoader();loadStream(streamSource,false);};
video.addEventListener('playing',()=>{hideLoader();everPlayed=true;tapPlayEl.classList.remove('show');updateMuteBtn();requestWakeLock();});
video.addEventListener('waiting',()=>{if(!video.paused)showLoader();});
video.addEventListener('canplay',()=>{if(!video.paused)hideLoader();});
video.addEventListener('pause',()=>{playBtn.innerHTML=PLAY_SVG;releaseWakeLock();});
video.addEventListener('play',()=>{playBtn.innerHTML=PAUSE_SVG;requestWakeLock();});
video.addEventListener('volumechange',updateMuteBtn);
video.addEventListener('webkitbeginfullscreen',()=>{video.style.objectFit='fill';});
video.addEventListener('webkitendfullscreen',()=>{video.style.objectFit='contain';});
video.addEventListener('error',()=>{if(!everPlayed&&canUseProxy&&!triedProxy&&!/\.mpd/i.test(streamSource)){triedProxy=true;loadStream(makeProxyUrl(streamSource),true);}});
playBtn.addEventListener('click',e=>{e.stopPropagation();if(video.paused){video.muted=false;video.volume=lastVol||1;video.play().catch(()=>tapPlayEl.classList.add('show'));updateMuteBtn();}else video.pause();showControls();});
fsBtn.addEventListener('click',e=>{e.stopPropagation();toggleFullscreen();showControls();});
pipBtn.addEventListener('click',e=>{e.stopPropagation();togglePiP();showControls();});
if(isToffee)loadStream(makeProxyUrl(streamSource),true);else loadStream(streamSource,false);
setTimeout(()=>{if(!everPlayed&&!triedProxy&&canUseProxy&&!/\.mpd/i.test(streamSource)){triedProxy=true;loadStream(makeProxyUrl(streamSource),true);}},6000);
}
</script>
<script>
(function(){document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('keydown',e=>{if(e.key==='F12'||(e.ctrlKey&&['U','S','C'].includes(e.key.toUpperCase()))){e.preventDefault();}});})();
</script>
</body>
