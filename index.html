<script>
function cleanParam(v){try{v=decodeURIComponent(v||'');}catch(e){}if(!v||v.indexOf('${')!==-1||v.indexOf('encodeURI')!==-1||v.indexOf('undefined')!==-1){return '';}return v;}

const canUseProxy=PROXY_FALLBACK.includes(srcParam.toLowerCase())||PROXY_FALLBACK.some(function(n){return streamSource.toLowerCase().indexOf(n)!==-1;});
let currentName='Rs Live Tv';
try{if(chNameParam){currentName=chNameParam;document.getElementById('chName').textContent=chNameParam;document.title=chNameParam+' - Rs Live Tv';}}catch(e){}
const loaderEl=document.getElementById('loader');const statusEl=document.getElementById('status-line');const wrapper=document.getElementById('player-wrapper');const playBtn=document.getElementById('playBtn');const fsBtn=document.getElementById('fsBtn');const tapPlayEl=document.getElementById('tapPlay');const muteBtnEl=document.getElementById('muteBtn');
const statusMessages=['LOADING','CONNECTING','BUFFERING'];let statusIdx=0;
let statusTimer=setInterval(function(){if(loaderEl.classList.contains('hide-now'))return;statusIdx=(statusIdx+1)%statusMessages.length;statusEl.textContent=statusMessages[statusIdx];},1800);
function showLoader(){loaderEl.classList.remove('hide-now')}

function brandBlock(){return '<div class="brand-name"><b>Rs Live</b> <i>Tv</i></div>';}
let wakeLock=null;let wakeLockWanted=false;
async function requestWakeLock(){wakeLockWanted=true;if(!('wakeLock' in navigator))return;if(wakeLock)return;if(document.visibilityState!=='visible')return;try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',function(){wakeLock=null});}catch(e){wakeLock=null}}
async function releaseWakeLock(){wakeLockWanted=false;if(wakeLock){try{await wakeLock.release()}catch(e){}wakeLock=null;}}

let isFullscreenBusy=false;

function isIOSFullscreen(){var v=getVideoEl();return !!(document.webkitFullscreenElement||document.fullscreenElement||(v&&v.webkitDisplayingFullscreen));}
async function toggleFullscreen(){
if(isFullscreenBusy)return;isFullscreenBusy=true;setTimeout(function(){isFullscreenBusy=false},600);
var v=getVideoEl();if(!v)return;
if(IS_IOS){
if(isIOSFullscreen()){
try{if(document.exitFullscreen)await document.exitFullscreen()}catch(e){}
try{if(v.webkitExitFullscreen)v.webkitExitFullscreen()}catch(e){}
}else{

try{if(v.webkitEnterFullscreen)v.webkitEnterFullscreen();else if(v.webkitRequestFullscreen)v.webkitRequestFullscreen();else if(v.requestFullscreen)await v.requestFullscreen();}catch(e){try{if(v.requestFullscreen)await v.requestFullscreen();}catch(e2){}}
}

}

}else{
try{if(wrapper.requestFullscreen)await wrapper.requestFullscreen();else if(wrapper.webkitRequestFullscreen)await wrapper.webkitRequestFullscreen();}catch(e){}

}
}

function applyQualityToPlayer(){
if(window._hls){
try{

for(var i=0;i<window._hls.levels.length;i++){var h=window._hls.levels[i].height||0;var d=Math.abs(h-selectedQuality);if(d<bestDiff){bestDiff=d;idx=i;}}

if(selectedQuality<=360){window._hls.config.maxMaxBufferLength=12;window._hls.config.maxBufferLength=8;}else{window._hls.config.maxMaxBufferLength=60;window._hls.config.maxBufferLength=30;}
}

}

try{
if(selectedQuality===-1){window._shaka.configure({abr:{enabled:true,restrictions:{maxBandwidth:8000000,maxHeight:1080}}});}
else{window._shaka.configure({abr:{enabled:false,restrictions:{maxBandwidth:8000000,maxHeight:selectedQuality}}});var tracks=window._shaka.getVariantTracks();var match=null;for(var t=0;t<tracks.length;t++){if(tracks[t].height===selectedQuality){match=tracks[t];break;}}if(!match){var sd=99999;for(var t2=0;t2<tracks.length;t2++){var dd=Math.abs((tracks[t2].height||0)-selectedQuality);if(dd<sd){sd=dd;match=tracks[t2];}}}if(match)window._shaka.selectVariantTrack(match,true);}
}catch(e){}
}

var video=document.createElement('video');video.setAttribute('playsinline','');video.setAttribute('webkit-playsinline','');video.setAttribute('x5-video-player-type','h5');video.setAttribute('x5-video-player-fullscreen','true');video.muted=false;video.volume=1;video.autoplay=true;video.controls=false;video.preload='auto';video.playsInline=true;video.style.cssText='width:100%;height:100%;object-fit:contain;background:#000';document.getElementById('player').appendChild(video);
var hls=null;var shakaPlayer=null;var everPlayed=false;var triedDirect=false;var triedProxy=false;var autoplayBlocked=false;
function updateMuteBtn(){var l1=document.getElementById('muteLine1');var l2=document.getElementById('muteLine2');var w=document.getElementById('muteWave');if(video.muted||video.volume===0){if(l1)l1.style.display='';if(l2)l2.style.display='';if(w)w.style.display='none';}else{if(l1)l1.style.display='none';if(l2)l2.style.display='none';if(w)w.style.display='';}}

async function destroyCurrentPlayer(){if(hls){try{hls.destroy()}catch(e){}hls=null;window._hls=null;}if(shakaPlayer){try{await shakaPlayer.destroy()}catch(e){}shakaPlayer=null;window._shaka=null;}video.pause();video.removeAttribute('src');video.load();}
async function loadStream(url,viaProxy){try{showLoader();tapPlayEl.classList.remove('show');await destroyCurrentPlayer();var isMPD=/\.mpd(?:$|[?#])/i.test(url)||/\.mpd/i.test(url);var isM3U8=/\.m3u8(?:$|[?#])/i.test(url)||/m3u8/i.test(url);if(isMPD){if(!window.shaka||!shaka.Player.isBrowserSupported()){showNoStreamState({message:'এই ব্রাউজারে MPD সাপোর্ট নেই'});return;}shaka.polyfill.installAll();shakaPlayer=new shaka.Player(video);window._shaka=shakaPlayer;if(isLowQuality()){shakaPlayer.configure({streaming:{bufferingGoal:8,rebufferingGoal:2,bufferBehind:8,retryParameters:{maxAttempts:4,baseDelay:1000,backoffFactor:2,fuzzFactor:0.5,timeout:30000}},abr:{restrictions:{maxBandwidth:800000,maxHeight:360}}});}else{shakaPlayer.configure({streaming:{bufferingGoal:30,rebufferingGoal:2,bufferBehind:30,retryParameters:{maxAttempts:4,baseDelay:1000,backoffFactor:2,fuzzFactor:0.5,timeout:30000}}});}shakaPlayer.addEventListener('error',function(event){var error=event.detail;if(!everPlayed){showNoStreamState({message:'MPD Error: '+(error.message||error.code||'Stream failed')});}});shakaPlayer.addEventListener('buffering',function(event){if(event.buffering&&!video.paused)showLoader();});await shakaPlayer.load(url);try{var tracks=shakaPlayer.getVariantTracks();var hs=[];tracks.forEach(function(tr){if(tr.height&&hs.indexOf(tr.height)===-1)hs.push(tr.height);});availableHeights=hs.sort(function(a,b){return b-a;});renderQualityList();applyQualityToPlayer();}catch(e){}doPlay();return;}if(isM3U8){if(window.Hls&&Hls.isSupported()){var hlsConfig={maxBufferLength:isLowQuality()?8:30,maxMaxBufferLength:isLowQuality()?12:60,enableWorker:false,lowLatencyMode:false,manifestLoadingMaxRetry:3,levelLoadingMaxRetry:4,fragLoadingMaxRetry:4,manifestLoadingRetryDelay:800,fragLoadingRetryDelay:800};if(viaProxy){hlsConfig.loader=Hls.DefaultConfig.loader;}hls=new Hls(hlsConfig);window._hls=hls;hls.loadSource(url);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,function(){try{var hs2=[];hls.levels.forEach(function(lv){if(lv.height&&hs2.indexOf(lv.height)===-1)hs2.push(lv.height);});availableHeights=hs2.sort(function(a,b){return b-a;});renderQualityList();applyQualityToPlayer();}catch(e){}doPlay();});hls.on(Hls.Events.ERROR,function(e,data){if(!data.fatal)return;if(data.type===Hls.ErrorTypes.NETWORK_ERROR){if(!viaProxy&&canUseProxy&&!triedProxy){triedProxy=true;loadStream(makeProxyUrl(streamSource),true);}else if(viaProxy&&!triedDirect){triedDirect=true;loadStream(streamSource,false);}else{hls.startLoad();}}else if(data.type===Hls.ErrorTypes.MEDIA_ERROR){hls.recoverMediaError();}else{showNoStreamState({message:'HLS Error: '+data.details});}});}else if(video.canPlayType('application/vnd.apple.mpegurl')){video.src=url;doPlay();}else{showNoStreamState({message:'Browser HLS support নেই'});}return;}video.src=url;doPlay();}catch(error){showNoStreamState({message:error.message||'ভিডিও চালানো যাচ্ছে না'});}}
function showNoStreamState(err){releaseWakeLock();tapPlayEl.classList.remove('show');var proxyBtn='<br><button class="retry-btn2" onclick="tryProxyManually()">🌐 Proxy দিয়ে চেষ্টা করো</button>';var directBtn='<br><button class="retry-btn2" onclick="tryDirectManually()">📡 Direct দিয়ে চেষ্টা করো</button>';showState('<div class="state-content"><div class="glyph"><i>&#10060;</i></div><p class="title">এই চ্যানেলটা এখন চলছে না</p><p class="sub">'+(err&&err.message?err.message:'The source could not be reached.')+'</p><button class="retry-btn" onclick="location.reload()">🔄 Retry</button>'+proxyBtn+directBtn+brandBlock()+'</div>');}
window.tryProxyManually=function(){if(/\.mpd/i.test(streamSource)){showNoStreamState({message:'MPD Proxy এই প্লেয়ারে কনফিগার করা নেই। Direct লিংক ব্যবহার করো।'});return;}showLoader();loadStream(makeProxyUrl(streamSource),true);};
window.tryDirectManually=function(){showLoader();loadStream(streamSource,false);};
video.addEventListener('playing',function(){hideLoader();everPlayed=true;tapPlayEl.classList.remove('show');updateMuteBtn();requestWakeLock();});

}
