
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RS Oven Player</title>

<script src="https://cdn.jsdelivr.net/npm/ovenplayer/dist/ovenplayer.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

#player {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #000;
}

#status {
    position: fixed;
    bottom: 15px;
    left: 15px;
    color: white;
    font-size: 12px;
    z-index: 5;
    opacity: .7;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="player"></div>
<div id="status">RS PLAYER PRO</div>

<script>
(() => {

const params = new URLSearchParams(location.search);
const stream = params.get("url");

if (!stream) {
    document.getElementById("status").textContent =
        "Stream URL Missing";
    throw new Error("Missing stream URL");
}

let urls = stream.split(",")
    .map(x => x.trim())
    .filter(Boolean);

let index = 0;
let player = null;
let retryCount = 0;
let retryTimer = null;
let switching = false;

const status = document.getElementById("status");

function playStream() {

    if (index >= urls.length) {
        index = 0;
    }

    switching = false;

    status.textContent = "Connecting...";

    if (player) {
        try {
            player.remove();
        } catch(e) {}
        player = null;
    }

    player = OvenPlayer.create("player", {
        autoStart: true,
        autoFallback: false,
        controls: true,
        mute: false,
        sources: [{
            file: urls[index],
            type: "hls"
        }]
    });

    player.on("ready", function() {
        status.textContent = "RS PLAYER PRO";
    });

    player.on("play", function() {
        retryCount = 0;
        status.textContent = "LIVE";
        clearTimeout(retryTimer);
    });

    player.on("error", function() {
        fallback();
    });
}

function fallback() {

    if (switching) return;
    switching = true;

    status.textContent = "Stream Error - Reconnecting...";

    clearTimeout(retryTimer);

    retryTimer = setTimeout(() => {

        if (index < urls.length - 1) {
            index++;
        } else {
            retryCount++;

            if (retryCount >= 5) {
                status.textContent = "Unable to Play Stream";
                switching = false;
                return;
            }

            index = 0;
        }

        playStream();

    }, 2500);
}

playStream();

window.addEventListener("online", () => {
    retryCount = 0;
    index = 0;
    playStream();
});

})();
</script>

</body>
</html>
