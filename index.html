
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="referrer" content="no-referrer">

<title>RS Player Pro</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/controls.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#080808;
  font-family:Arial,Helvetica,sans-serif;
}

#player-container{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
}

video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
}

video.fit-fill{
  object-fit:fill!important;
}

video.fit-zoom{
  object-fit:cover!important;
}

/* LOADER */

#rs-loader{
  position:absolute;
  inset:0;
  z-index:5;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  pointer-events:none;
  opacity:1;
  visibility:visible;
  transition:opacity .25s,visibility .25s;
}

#rs-loader.hide{
  opacity:0;
  visibility:hidden;
}

.loader-box{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:12px 16px;
  border-radius:10px;
  background:rgba(0,0,0,.72);
  border:1px solid rgba(255,255,255,.08);
}

.loader-spinner{
  width:27px;
  height:27px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.15);
  border-top-color:#ff3030;
  border-right-color:#ff3030;
  animation:rs-spin .8s linear infinite;
}

.loader-name{
  margin-top:8px;
  font-size:12px;
  font-weight:900;
  color:#fff;
  letter-spacing:.6px;
  white-space:nowrap;
}

.loader-name span{
  color:#ff3030;
}

#loader-message{
  margin-top:4px;
  font-size:10px;
  color:#aaa;
  white-space:nowrap;
}

@keyframes rs-spin{
  to{transform:rotate(360deg)}
}

/* STATUS */

#status{
  position:fixed;
  top:max(12px,env(safe-area-inset-top));
  right:12px;
  z-index:20;

  display:flex;
  align-items:center;
  gap:7px;

  padding:7px 11px;
  border-radius:30px;

  background:rgba(15,15,15,.85);
  border:1px solid rgba(255,255,255,.10);

  color:#ddd;
  font-size:11px;
  font-weight:600;

  opacity:0;
  transform:translateY(-8px);
  transition:.25s;
  pointer-events:none;

  backdrop-filter:blur(12px);
}

#status.show{
  opacity:1;
  transform:translateY(0);
}

.dot{
  width:7px;
  height:7px;
  background:#38bdf8;
  border-radius:50%;
}

#status.live .dot{
  background:#22c55e;
  animation:rs-pulse 1.5s infinite;
}

#status.loading .dot{
  background:#fbbf24;
  animation:rs-pulse 1s infinite;
}

#status.error .dot{
  background:#ef4444;
}

@keyframes rs-pulse{
  50%{
    opacity:.35;
    transform:scale(.65);
  }
}

/* CUSTOM FIT BUTTON */
/* Shaka's default controls are otherwise untouched */

.rs-fit-btn{
  border:0;
  background:transparent;
  color:white;
  cursor:pointer;
  padding:0 5px;
  min-width:40px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.rs-fit-label{
  font-size:10px;
  font-weight:800;
  padding:4px 6px;
  border:1px solid #666;
  border-radius:5px;
  color:#ddd;
  white-space:nowrap;
}

.rs-fit-btn.fill .rs-fit-label{
  color:#38bdf8;
  border-color:#38bdf8;
}

.rs-fit-btn.zoom .rs-fit-label{
  color:#a78bfa;
  border-color:#a78bfa;
}

/* FULLSCREEN */

#player-container:fullscreen,
#player-container:-webkit-full-screen{
  width:100vw;
  height:100vh;
  background:#000;
}

#player-container:fullscreen video,
#player-container:-webkit-full-screen video{
  width:100%;
  height:100%;
}

/* MOBILE */

@media(max-width:480px){

  #status{
    top:10px;
    right:10px;
    font-size:10px;
    padding:6px 9px;
  }

  .rs-fit-label{
    font-size:9px;
    padding:3px 5px;
  }

}
</style>
</head>

<body>

<div id="player-container">

  <video
    id="video"
    autoplay
    muted
    playsinline
    preload="metadata">
  </video>

  <!-- Loader -->

  <div id="rs-loader">
    <div class="loader-box">

      <div class="loader-spinner"></div>

      <div class="loader-name">
        RS <span>LIVE TV</span>
      </div>

      <div id="loader-message">
        Connecting...
      </div>

    </div>
  </div>

</div>

<div id="status">
  <span class="dot"></span>
  <span id="statusText">Ready</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/shaka-player@4.16.2/dist/shaka-player.ui.min.js"></script>

<script>
(function(){

"use strict";

const video = document.getElementById("video");
const container = document.getElementById("player-container");
const status = document.getElementById("status");
const statusText = document.getElementById("statusText");
const loader = document.getElementById("rs-loader");
const loaderMessage = document.getElementById("loader-message");

let player;
let statusTimer;
let fitButton;
let fitIndex=0;
let previousFitIndex=0;
let isFullscreen=false;

const FIT_MODES=["contain","fill","cover"];
const FIT_LABELS=["FIT","FILL","ZOOM"];

/* STATUS */

function setStatus(text,type="loading",duration=4000){

  statusText.textContent=text;
  status.className="show "+type;

  clearTimeout(statusTimer);

  if(duration>0){

    statusTimer=setTimeout(()=>{
      status.classList.remove("show");
    },duration);

  }

}

/* LOADER */

function showLoader(message){

  loaderMessage.textContent=message||"Connecting...";
  loader.classList.remove("hide");

}

function hideLoader(){

  loader.classList.add("hide");

}

/* FIT MODE */

function applyFit(){

  video.classList.remove("fit-fill","fit-zoom");

  if(fitButton){
    fitButton.classList.remove("fill","zoom");
  }

  if(FIT_MODES[fitIndex]==="fill"){

    video.classList.add("fit-fill");

    if(fitButton){
      fitButton.classList.add("fill");
    }

  }

  if(FIT_MODES[fitIndex]==="cover"){

    video.classList.add("fit-zoom");

    if(fitButton){
      fitButton.classList.add("zoom");
    }

  }

  if(fitButton){

    const label=fitButton.querySelector(".rs-fit-label");

    if(label){
      label.textContent=FIT_LABELS[fitIndex];
    }

  }

}

/* ADD FIT BUTTON */

function addFitButton(){

  const panel=document.querySelector(
    ".shaka-controls-button-panel"
  );

  if(!panel)return;

  if(panel.querySelector(".rs-fit-btn"))return;

  const button=document.createElement("button");

  button.type="button";
  button.className="rs-fit-btn";
  button.title="Video Fit Mode";

  button.innerHTML=
    '<span class="rs-fit-label">FIT</span>';

  fitButton=button;

  const fullscreenButton=panel.querySelector(
    ".shaka-fullscreen-button"
  );

  if(fullscreenButton){

    panel.insertBefore(button,fullscreenButton);

  }else{

    panel.appendChild(button);

  }

  button.addEventListener("click",function(){

    fitIndex=(fitIndex+1)%FIT_MODES.length;

    applyFit();

  });

  applyFit();

}

/* FULLSCREEN */

function checkFullscreen(){

  const fullscreen=
    !!document.fullscreenElement ||
    !!document.webkitFullscreenElement;

  if(fullscreen && !isFullscreen){

    previousFitIndex=fitIndex;
    fitIndex=1;
    isFullscreen=true;

    applyFit();

  }else if(!fullscreen && isFullscreen){

    fitIndex=previousFitIndex;
    isFullscreen=false;

    applyFit();

  }

}

document.addEventListener(
  "fullscreenchange",
  checkFullscreen
);

document.addEventListener(
  "webkitfullscreenchange",
  checkFullscreen
);

/* PLAYER INIT */

async function init(){

  showLoader("Initializing player...");

  shaka.polyfill.installAll();

  if(!shaka.Player.isBrowserSupported()){

    showLoader("Browser not supported");

    setStatus("Browser Not Supported","error",0);

    return;

  }

  try{

    player=new shaka.Player();

    await player.attach(video);

    const ui=new shaka.ui.Overlay(
      player,
      container,
      video
    );

    /* Shaka native controls */

    ui.configure({

      addBigPlayButton:true,

      controlPanelElements:[
        "play_pause",
        "mute",
        "volume",
        "time_and_duration",
        "spacer",
        "quality",
        "picture_in_picture",
        "fullscreen"
      ],

      seekBarColors:{
        base:"#555",
        buffered:"#777",
        played:"#ff3030"
      }

    });

    /* Wait for controls */

    let count=0;

    const buttonTimer=setInterval(()=>{

      addFitButton();

      count++;

      if(
        document.querySelector(".rs-fit-btn") ||
        count>=30
      ){

        clearInterval(buttonTimer);

      }

    },250);

    /* Player error */

    player.addEventListener("error",function(event){

      console.error("Shaka error:",event.detail);

      showLoader("Stream error...");

      setStatus(
        "Stream Error "+(event.detail.code||""),
        "error",
        6000
      );

    });

    /* Video playing */

    video.addEventListener("playing",function(){

      hideLoader();

      setStatus("LIVE","live",4000);

    });

    /* Buffering */

    video.addEventListener("waiting",function(){

      showLoader("Buffering...");

      setStatus("Buffering...","loading",0);

    });

    video.addEventListener("stalled",function(){

      showLoader("Reconnecting...");

    });

    /* Pause */

    video.addEventListener("pause",function(){

      if(!video.ended){

        hideLoader();

        setStatus("Paused","loading",2500);

      }

    });

    /* URL */

    const params=new URLSearchParams(
      window.location.search
    );

    const streamUrl=params.get("url");

    if(!streamUrl){

      hideLoader();

      setStatus("Ready - No Stream URL","loading",5000);

      return;

    }

    await loadStream(streamUrl);

  }catch(error){

    console.error("Initialization:",error);

    showLoader("Player initialization failed");

    setStatus("Initialization Failed","error",0);

  }

}

/* LOAD STREAM */

async function loadStream(url){

  try{

    showLoader("Connecting...");

    setStatus("Connecting...","loading",0);

    await player.load(url);

    showLoader("Starting video...");

    video.play().catch(()=>{

      video.muted=true;

      video.play().catch(()=>{

        showLoader("Press Play");

      });

    });

  }catch(error){

    console.error("Load Error:",error);

    showLoader("Playback failed");

    setStatus("Playback Failed","error",0);

  }

}

/* START */

document.addEventListener(
  "DOMContentLoaded",
  init
);

})();
</script>

</body>
</html>
