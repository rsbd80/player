/* =========================================================

========================================================= */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const streamSource =
    urlParams.get('url');


const forcedType =
    (
        urlParams.get('type') || ''
    ).toLowerCase();


const startMuted =
    urlParams.get('mute') === '1';


/* =========================================================
   ELEMENTS
========================================================= */

const wrapper =
    document.getElementById(
        'player-wrapper'

const loaderEl =
    document.getElementById(

    document.getElementById(

    document.getElementById(

/* =========================================================
   LOADER
========================================================= */

const statusMessages = [

    'LOADING',

    'CONNECTING',

    'BUFFERING'

];


let statusIdx = 0;


const statusTimer =
    setInterval(() => {

        /*
            Don't update the loader if hidden.
        */

        if(
            loaderEl.classList.contains(
                'hide-now'
            )
        ){

            return;

        }


        statusIdx =
            (
                statusIdx + 1
            ) %
            statusMessages.length;


        statusEl.textContent =
            statusMessages[
                statusIdx
            ];

    },1800);


function showLoader(){

    loaderEl.classList.remove(
        'hide-now'
    );

}


function hideLoader(){

    loaderEl.classList.add(
        'hide-now'
    );

}


function showState(html){

    clearInterval(
        statusTimer
    );

    loaderEl.innerHTML =

}


function brandBlock(){

}


/* =========================================================
   WAKE LOCK
========================================================= */

let wakeLock = null;

let wakeLockWanted = false;


async function requestWakeLock(){

    wakeLockWanted = true;


    if(
        !('wakeLock' in navigator)
    ){

        return;

    }


    if(wakeLock){

        return;

    }


    if(
        document.visibilityState !==
        'visible'
    ){

        return;

    }


    try{

        wakeLock =
            await navigator.wakeLock.request(
                'screen'
            );


        wakeLock.addEventListener(
            'release',
            () => {

                wakeLock = null;

            }
        );


    }catch(error){

        wakeLock = null;

    }

}


async function releaseWakeLock(){

    wakeLockWanted = false;


    if(wakeLock){

        try{

            await wakeLock.release();

        }catch(error){}


        wakeLock = null;

    }

}


document.addEventListener(
    'visibilitychange',
    () => {

        if(
            document.visibilityState ===
            'visible' &&
            wakeLockWanted
        ){

            requestWakeLock();

        }

    }
);


/* =========================================================
   STREAM TYPE
========================================================= */

function detectType(raw){

    if(forcedType){

        return forcedType;

    }


    const clean =
        raw
            .split('?')[0]
            .split('#')[0]
            .toLowerCase();


    if(
        clean.endsWith('.m3u8')
    ){

        return 'hls';

    }


    if(
        clean.endsWith('.mpd')
    ){

        return 'dash';

    }


    if(
        clean.endsWith('.mp4')
    ){

        return 'mp4';

    }


    if(
        clean.endsWith('.webm')
    ){

        return 'webm';

    }


    if(
        clean.endsWith('.mov')
    ){

        return 'mp4';

    }


    if(
        clean.endsWith('.ogg') ||
        clean.endsWith('.ogv')
    ){

        return 'ogg';

    }


    if(
        raw.includes('.m3u8')
    ){

        return 'hls';

    }


    if(
        raw.includes('.mpd')
    ){

        return 'dash';

    }


    return null;

}


/* =========================================================
   FULLSCREEN FUNCTIONS
========================================================= */

let fullscreenBusy = false;


/*
    Detect current fullscreen state.
*/

function isFullscreen(){

    return Boolean(
        document.fullscreenElement ||
        document.webkitFullscreenElement
    );

}


/*
    Update our fullscreen button icon.
*/

function updateFullscreenUI(){

    const active =
        isFullscreen();


    wrapper.classList.toggle(
        'rs-fullscreen',
        active
    );


    if(active){

        enterIcon.style.display =
            'none';

        exitIcon.style.display =
            'block';

        fullscreenButton.setAttribute(
            'aria-label',
            'Exit fullscreen'
        );

    }else{

        enterIcon.style.display =
            'block';

        exitIcon.style.display =
            'none';

        fullscreenButton.setAttribute(
            'aria-label',
            'Fullscreen'
        );

    }

}


/*
    ENTER BROWSER FULLSCREEN.

    IMPORTANT:

    We fullscreen the PLAYER WRAPPER,
    NOT JW Player.

    No player.load()
    No player.play()
    No player.pause()
*/

async function enterFullscreen(){

    if(fullscreenBusy){

        return;

    }


    fullscreenBusy = true;


    try{

        /*
            Modern Chrome Android.
        */

        if(
            wrapper.requestFullscreen
        ){

            await wrapper.requestFullscreen({
                navigationUI:'hide'
            });

        }

        /*
            Older WebKit fallback.
        */

        else if(
            wrapper.webkitRequestFullscreen
        ){

            wrapper.webkitRequestFullscreen();

        }

        else{

            /*
                CSS fallback if Fullscreen API
                is unavailable.
            */

            wrapper.classList.add(
                'rs-fullscreen'
            );

        }


    }catch(error){

        console.warn(
            'Fullscreen request failed:',
            error
        );

        /*
            Fallback to CSS fullscreen.
        */

        wrapper.classList.add(
            'rs-fullscreen'
        );

    }


    /*
        DO NOT touch video playback here.
    */

    updateFullscreenUI();


    requestAnimationFrame(() => {

        const video =
            document.querySelector(
                '#player video'
            );


        if(video){

            video.style.width =
                '100%';

            video.style.height =
                '100%';

            video.style.objectFit =
                'fill';

        }

    });


    setTimeout(() => {

        fullscreenBusy = false;

    },300);

}


/*
    EXIT FULLSCREEN.
*/

async function exitFullscreen(){

    if(fullscreenBusy){

        return;

    }


    fullscreenBusy = true;


    try{

        if(
            document.exitFullscreen &&
            document.fullscreenElement
        ){

            await document.exitFullscreen();

        }

        else if(
            document.webkitExitFullscreen &&
            document.webkitFullscreenElement
        ){

            document.webkitExitFullscreen();

        }

        else{

            wrapper.classList.remove(
                'rs-fullscreen'
            );

        }

    }catch(error){

        console.warn(
            'Exit fullscreen failed:',
            error
        );

        wrapper.classList.remove(
            'rs-fullscreen'
        );

    }


    updateFullscreenUI();


    /*
        Do NOT call player.play().
        Do NOT call player.pause().
        Do NOT reload the stream.
    */


    setTimeout(() => {

        fullscreenBusy = false;

    },300);

}

            screen.orientation.lock
        ){

            await screen.orientation.lock(
                'landscape'
            );

        }

    }catch(error){

        /*
            Not supported or permission denied.
        */

    }

}


/*
    We intentionally DON'T automatically rotate
    the screen.

    User's phone orientation controls it.
*/


/* =========================================================
   NO STREAM URL
========================================================= */

if(!streamSource){

    showState(`

        <div class="state-content">

            <div class="glyph warn">
                <i>&#9888;</i>
            </div>

            <p class="title">
                No stream URL supplied
            </p>

            <p class="sub">
                Add ?url=YOUR_STREAM_LINK
                to this page's address.
            </p>

            ${brandBlock()}

        </div>

    `);

}


/* =========================================================
   PLAYER
========================================================= */

else{

    const streamType =
        detectType(
            streamSource
        );


    const playlistItem = {

        file:
            streamSource

    };


    if(streamType){

        playlistItem.type =
            streamType;

    }


    /*
        JW PLAYER SETUP
    */

    const player =
        jwplayer(
            'player'
        ).setup({

            playlist:[
                playlistItem
            ],

            width:'100%',

            height:'100%',

            autostart:true,

            mute:startMuted,

            preload:'auto',

            stretching:'uniform',

            liveTimeout:0,

            skin:{
                name:'glow'
            },

            displaytitle:false,

            displaydescription:false,

            controls:true,

            repeat:false

        });


    /* =====================================================
       STATE
    ====================================================== */

    let retryCount = 0;

    const maxRetries = 6;

    let retryTimer = null;

    let everPlayed = false;

    let userPaused = false;

    let noStreamTimer =
        setTimeout(() => {

            if(!everPlayed){

                showNoStreamState();

            }

        },12000);


    /* =====================================================
       READY
    ====================================================== */

    player.on(
        'ready',
        () => {

            console.log(
                '[RS Player] READY:',
                streamType || 'AUTO'
            );


            /*
                Apply fill to video.
            */

            const video =
                document.querySelector(
                    '#player video'
                );


            if(video){

                video.style.objectFit =
                    'fill';

                video.style.width =
                    '100%';

                video.style.height =
                    '100%';

                video.style.touchAction =
                    'manipulation';


                /*
                    Inline playback.

                    This is important on mobile.
                */

                video.setAttribute(
                    'playsinline',
                    ''
                );

                video.setAttribute(
                    'webkit-playsinline',
                    ''
                );

            }

        }
    );


    /* =====================================================
       FIRST FRAME
    ====================================================== */

    player.on(
        'firstFrame',
        () => {

            clearTimeout(
                noStreamTimer
            );

            hideLoader();

            everPlayed = true;

            retryCount = 0;

        }
    );


    /* =====================================================
       PLAY
    ====================================================== */

    player.on(
        'play',
        () => {

            clearTimeout(
                noStreamTimer
            );

            everPlayed = true;

            userPaused = false;

            hideLoader();

            retryCount = 0;

            requestWakeLock();

        }
    );


    /* =====================================================
       PAUSE
    ====================================================== */

    player.on(
        'pause',
        () => {

            userPaused = true;

            releaseWakeLock();

        }
    );


    /* =====================================================
       COMPLETE
    ====================================================== */

    player.on(
        'complete',
        () => {

            releaseWakeLock();

        }
    );


    /* =====================================================
       BUFFER

       VERY IMPORTANT:

       We do NOTHING here.

       No loader.
       No pause.
       No play.
       No load.
       No fullscreen action.
    ====================================================== */

    player.on(
        'buffer',
        () => {

            console.log(
                '[RS Player] buffer'
            );

        }
    );


    /* =====================================================
       IDLE

       Do nothing.

       JW can temporarily become idle during
       network changes/fullscreen.
    ====================================================== */

    player.on(
        'idle',
        () => {

            console.log(
                '[RS Player] idle'
            );

        }
    );


    /* =====================================================
       JW FULLSCREEN EVENT

       This should normally never be triggered
       because the native JW fullscreen button
       is hidden.

       If it somehow happens, don't reload/pause.
    ====================================================== */

    player.on(
        'fullscreen',
        event => {

            console.log(
                '[RS Player] JW fullscreen event ignored'
            );

            /*
                Do not call:

                player.load()
                player.play()
                player.pause()
                showLoader()
            */

        }
    );


    /* =====================================================
       ERROR
    ====================================================== */

    player.on(
        'error',
        handleFault
    );


    player.on(
        'setupError',
        handleFault
    );


    function handleFault(error){

        console.error(
            '[RS Player] ERROR:',
            error
        );


        /*
            Don't reload if user intentionally paused.
        */

        if(userPaused){

            return;

        }


        /*
            Initial connection failure.
        */

        if(!everPlayed){

            clearTimeout(
                retryTimer
            );


            retryTimer =
                setTimeout(() => {

                    try{

                        player.load([
                            playlistItem
                        ]);

                        player.play(true);

                    }catch(error){

                        console.warn(
                            error
                        );

                    }

                },900);


            return;

        }


        /*
            Reconnect.
        */

        if(
            retryCount <
            maxRetries
        ){

            retryCount++;


            statusEl.textContent =
                'RECONNECTING (' +
                retryCount +
                '/' +
                maxRetries +
                ')';


            showLoader();


            clearTimeout(
                retryTimer
            );


            retryTimer =
                setTimeout(() => {

                    try{

                        player.load([
                            playlistItem
                        ]);

                        player.play(true);

                    }catch(error){

                        console.warn(
                            error
                        );

                    }

                },
                Math.min(
                    1000 * retryCount,
                    4000
                ));


            return;

        }


        showNoStreamState(
            error
        );

    }


    /* =====================================================
       NO STREAM STATE
    ====================================================== */

    function showNoStreamState(error){

        clearTimeout(
            retryTimer
        );


        clearTimeout(
            noStreamTimer
        );


        releaseWakeLock();


        showState(`

            <div class="state-content">

                <div class="glyph">
                    <i>&#10060;</i>
                </div>


                <p class="title">
                    No streaming — this link won't play
                </p>


                <p class="sub">

                    ${
                        error &&
                        error.message
                        ?
                        error.message
                        :
                        'The source could not be reached.'
                    }

                </p>


                <button
                    class="retry-btn"
                    onclick="location.reload()"
                >
                    Retry
                </button>


                ${brandBlock()}

            </div>

        `);

    }


    /* =====================================================
       VIDEO DOM OBSERVER
    ====================================================== */

    /*
        JW may recreate the video element.

        We only re-apply CSS.

        We NEVER call play/pause/load here.
    */

    const playerElement =
        document.getElementById(
            'player'
        );


    const videoObserver =
        new MutationObserver(() => {

            const video =
                document.querySelector(
                    '#player video'
                );


            if(video){

                video.style.objectFit =
                    'fill';

                video.style.width =
                    '100%';

                video.style.height =
                    '100%';

                video.style.touchAction =
                    'manipulation';

                video.setAttribute(
                    'playsinline',
                    ''
                );

            }

        });


    videoObserver.observe(
        playerElement,
        {
            childList:true,
            subtree:true
        }
    );


    /* =====================================================
       PREVENT CONTEXT MENU ONLY

       We do NOT block touch/click events.
    ====================================================== */

    playerElement.addEventListener(
        'contextmenu',
        event => {

            event.preventDefault();

        },
        {
            passive:false
        }
    );

}


/* =========================================================
   INITIAL FULLSCREEN UI
========================================================= */

updateFullscreenUI();


/* =========================================================
   SCREEN ORIENTATION CHANGE
========================================================= */

window.addEventListener(
    'orientationchange',
    () => {

        /*
            Don't touch playback.

            Just make sure the video remains FILL.
        */

        requestAnimationFrame(() => {

            const video =
                document.querySelector(
                    '#player video'
                );


            if(video){

                video.style.width =
                    '100%';

                video.style.height =
                    '100%';

                video.style.objectFit =
                    'fill';

            }

        });

    }
);

</script></body>
</html>
